# --- PROJECT CONFIGURATION --- #

# Metadata (see https://peps.python.org/pep-0621/)
[project]
name = "nged-substation-forecast"
version = "0.1.0"
description = "Forecast net demand at primary, BSP, and GSP substations, and split the forecast into gross demand, solar, and wind per substation for National Grid Electricity Distribution (NGED)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.14"
license = {text = "MIT License"}
authors = [
    { name = "Open Climate Fix Team", email = "info@openclimatefix.org"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "altair>=6.0.0",
    "contracts",
    "dagster>=1.12.11",
    "dagster-aws>=0.28.11",
    "dagster-postgres>=0.28.11",
    "dagster-webserver>=1.12.11",
    "delta_store",
    "deltalake",
    "dynamical_data",
    "geo",
    "hydra-core",
    "ml_core",
    "mlflow-skinny",
    "nged_data",
    "obstore",
    "patito",
    "plotting",
    "polars>=1.0.0",
    "pyarrow",
    "requests>=2.31.0",
    "sentry-sdk>=2.66,<3",
    "xgboost_forecaster",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "numpy>=1.24",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.16",
    "unittest-xml-reporting>=4.0.0",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-include-markdown-plugin>=7.2.2",
    "pymarkdownlnt>=0.9.13",
    "mlflow>=3.14.0",
    "moto[server]>=5.0.0",
    # dashboard is a leaf marimo app that nothing depends on at runtime, so it is a dev
    # dependency purely so `uv sync` installs it and `uv run pytest` can collect its tests.
    "dashboard",
]

[project.urls]
repository = "https://github.com/openclimatefix/nged-substation-forecast"

# --- UV WORKSPACE CONFIG ---
# See: https://docs.astral.sh/uv/concepts/projects/workspaces

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nged_data = { workspace = true }
contracts = { workspace = true }
delta_store = { workspace = true }
ml_core = { workspace = true }
plotting = { workspace = true }
xgboost_forecaster = { workspace = true }
dynamical_data = { workspace = true }
geo = { workspace = true }
weather_utils = { workspace = true }
dashboard = { workspace = true }

# --- DAGSTER ---

[tool.dagster]
module_name = "nged_substation_forecast.definitions"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "nged_substation_forecast"
registry_modules = [
    "nged_substation_forecast.components.*",
]

# --- LINTING AND TYPING CONFIGURATION --- #

# Ruff configuration
# See https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `select` is always written out here, never inherited. Ruff's *default* rule set is a curated
# menu, not a standard: the docs state no selection criteria and make no stability promise, so an
# inherited selection means a `uv lock` refresh can change which rules this repo enforces. Naming
# the families keeps that decision ours. A ruff upgrade that adds a rule to a family below can
# still surface new findings — but it does so by failing CI on the lock-bump PR, which is one
# visible decision to take, not silent drift.
#
# The families here are chosen from ruff's defaults, then widened. Note that ruff's defaults are
# *not* a superset of the older E4/E7/E9/F gate: of pycodestyle-E they keep only E722 and E902, so
# adopting the defaults verbatim would stop enforcing all fourteen of E401, E402, E701, E702, E703,
# E711, E712, E713, E714, E721, E731, E741, E742 and E743. E4/E7/E9 are therefore listed
# explicitly.
select = [
    "ANN",   # flake8-annotations: complete signatures are a house rule (see docs/architecture/code-style.md)
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle (google convention, configured below)
    "DTZ",   # flake8-datetimez: naive datetimes can silently corrupt our UTC-everywhere data
    "E4",    # pycodestyle: import placement
    "E5",    # pycodestyle: line length (the formatter does not wrap comments or long strings)
    "E7",    # pycodestyle: statement-level errors
    "E9",    # pycodestyle: syntax and IO errors
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming: the naming conventions docs/architecture/code-style.md mandates
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    # flake8-bandit, restricted to the three rules ruff enables by default. The whole family
    # reports about 1,170 findings, of which ~1,149 are S101 (`assert` used) — almost all of them
    # the asserts that *are* the test suite. Exempting S101 in tests the way the DTZ/D entries do
    # leaves 30: our own `git`/`uv` invocations (S603/S607 ×12), settings and moto dummy credentials
    # (S106 ×4), `urlopen` against a local moto server and the MLflow test server (S310 ×5), and 9
    # asserts outside tests. That is 30 suppressions for no signal in a repo that handles no
    # untrusted input. Real security linting is a separate decision, not a side effect of this file.
    "S102",  # exec used
    "S110",  # try-except-pass
    "S112",  # try-except-continue
    "SIM",   # flake8-simplify
    "T10",   # flake8-debugger: never commit a breakpoint
    "TC",    # flake8-type-checking
    "TID251",  # flake8-tidy-imports banned-api only (see banned-api table below)
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]

# Every entry is a family member we deliberately decline, with the reason. Prefer adding a line
# here (and its justification) over dropping a whole family from `select`.
ignore = [
    # --- Rules that fight this repo's own conventions ---
    # docs/architecture/code-style.md explicitly blesses long-but-clear parameter lists ("Eight parameters is acceptable
    # when each is distinct"), and prefers extracting named helpers with more parameters over
    # letting a function body grow.
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    # Our prose — docstrings and error messages alike — uses en-dashes and typographic quotes on
    # purpose. RUF001-003 flag every one of them as an "ambiguous" Unicode character.
    "RUF001", # ambiguous character in a string
    "RUF002", # ambiguous character in a docstring
    "RUF003", # ambiguous character in a comment
    # f-strings in log calls are fine here: this is not a high-volume hot path, and the eager
    # formatting cost is worth the readability.
    "G004", # logging statement uses f-string
    # docs/architecture/code-style.md asks for *complete* type hints, which is what the rest of flake8-annotations
    # enforces. It does not ask for the elimination of `Any`, and the places that use it — a
    # `**kwargs: Any` forwarded verbatim, a test double that accepts and ignores every argument —
    # have no honest narrower type.
    "ANN401", # dynamically typed expressions (`typing.Any`) are disallowed
    # Asserting against a literal is the whole point of a unit test, and `magic-value-comparison`
    # cannot tell a test's expected value from a hard-coded constant in production code. That
    # argument covers 162 of the 169 findings; the rule is nonetheless declined repo-wide rather
    # than under `**/tests/**`, which would leave 7 sites live in `src/` and the notebooks. Those 7
    # are quantile levels, longitude bounds and similar domain literals that read better inline
    # than as named constants. Tighten to a tests-only entry if that ever stops being true.
    "PLR2004", # magic value used in comparison
    # docs/architecture/code-style.md asks for UPPER_SNAKE_CASE constants, and N806 rejects that spelling for a
    # constant
    # that happens to be function-local (`RAD_TO_DEG`, `COMPRESSION`), as well as domain-conventional
    # names such as `X` for a feature matrix. The rest of pep8-naming (N801 classes, N802 functions,
    # N815/N816 mixedCase) is left on and does encode the conventions docs/architecture/code-style.md
    # states. N803 is
    # *not* ignored here — every site is a marimo-generated cell parameter, so it is declined in
    # `per-file-ignores` for the notebooks alone and stays live over `src/` and the tests.
    "N806", # variable in function should be lowercase
    # The three sites are `NoNewData`, `NwpRunNotYetAvailable` and `NwpVariableWhollyMissing`;
    # renaming any of them is a public-API change across several packages, not a lint fix. Revisit
    # deliberately if we ever want the `Error` suffix.
    "N818", # exception name should be suffixed with `Error`

    # --- Rules that would break Patito/pydantic ---
    # Patito and pydantic build their models from *runtime* annotations, so moving an annotation-only
    # import into an `if TYPE_CHECKING:` block turns a working schema into a NameError at import
    # time. That is decisive for the schema modules; the rule is declined repo-wide rather than
    # per-file because the 105 sites are not worth sorting by hand for a rule that has found no
    # defect. TC004/TC005/TC007/TC010 (the rules ruff enables by default) are safe and stay on.
    "TC001", # move application import into a type-checking block
    "TC002", # move third-party import into a type-checking block
    "TC003", # move standard-library import into a type-checking block
    # TC006 moves no imports, so the reason above does not cover it. It wants every `typing.cast()`
    # target quoted, which costs 15 edits and buys nothing here: `cast` never evaluates its type
    # argument at runtime in a way that a quote would rescue, and the unquoted form reads better.
    "TC006", # add quotes to type expression in `typing.cast()`

    # --- Rules whose cure is worse than the disease ---
    # TRY003 wants every message moved into a custom exception class. We raise plain built-in
    # exceptions with a specific, readable message; a class per message would be pure ceremony.
    "TRY003", # long message outside the exception class
    # All 13 sites are deliberate late imports in tests (importing inside the test body so a
    # `monkeypatch` lands first, ×11) and in a marimo notebook cell (×2). Nothing in `src/` defers
    # an import today; the rule is ignored rather than per-file-ignored so that a future late
    # import in `src/` does not have to argue with the linter.
    "PLC0415", # `import` should be at the top level of a file
    # Overlaps with the formatter, which owns line breaks inside implicit string concatenations.
    "ISC001", # single-line implicit string concatenation
]

[tool.ruff.lint.per-file-ignores]
# Marimo notebooks are not ordinary modules. A cell ends in a bare expression to render its output
# (B018), and marimo writes a trailing `return` into every cell (PLR1711); neither is a defect.
# Cells are `def _(...)` functions with no docstring and no annotations, which is marimo's own
# generated shape, not something we hand-maintain.
#
# Note these are *file* patterns, not directory patterns: ruff matches globs with `*` crossing `/`,
# so `packages/notebooks/*.py` would also silence `packages/notebooks/src/` and
# `packages/notebooks/tests/` — real library and test code. A character class does not rescue it
# either: in `packages/notebooks/[!/]*.py` the trailing `*` still crosses. Every notebook is
# therefore named individually.
#
# Contrast the marimo `exclude:` regex in .pre-commit-config.yaml, which is deliberately generic
# rather than a list of filenames. The asymmetry is intentional, because the two failure modes
# differ: forgetting to add a new notebook here is *loud* (the notebook fails lint on rules it was
# never meant to face), whereas forgetting to add it there is *silent* (ruff --fix rewrites the
# notebook into something marimo cannot run, and reports success).
"packages/dashboard/map_and_timeseries.py" = ["ANN", "B018", "D", "PLR1711"]
"packages/dashboard/view_forecasts.py" = ["ANN", "B018", "D", "PLR1711"]
"packages/notebooks/plot_gb_map.py" = ["ANN", "B018", "D", "N803", "PLR1711"]
"packages/notebooks/plot_missing_NWP_data.py" = ["ANN", "B018", "D", "N803", "PLR1711"]
"packages/notebooks/plot_nwp_map.py" = ["ANN", "B018", "D", "N803", "PLR1711"]
"packages/notebooks/view_baseline_export.py" = ["ANN", "B018", "D", "N803", "PLR1711"]
# `**/tests/**` covers both the root `tests/` directory and every `packages/*/tests/`.
#
# DTZ: test frames are hand-built with `datetime(2023, 1, 1, 12, 0)` and fed to helpers that are
#   indifferent to time zone. The rule earns its keep where a naive datetime could reach stored
#   data, which is `src/`, not here.
# D: a test's name is its documentation; requiring a docstring per test case adds noise, not
#   information.
# ANN201: every test function returns `None`; spelling that out on each one is pure boilerplate.
"**/tests/**" = ["ANN201", "D", "DTZ"]
# conftest.py is test scaffolding and follows the same conventions as the tests it serves.
"**/conftest.py" = ["ANN201", "D", "DTZ"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# pandas is strictly forbidden in this repo — Polars only. See docs/architecture/code-style.md.
"pandas".msg = "pandas is forbidden in this repo: use Polars (`pl.LazyFrame`/`pl.DataFrame`)."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
# importlib mode lets test modules in different directories share a basename (e.g.
# tests/test_metrics.py and packages/ml_core/tests/test_metrics.py); the default prepend
# mode aborts collection with an "import file mismatch" error on the duplicate name.
# The network-gated tests are skipped by default by the root conftest.py's collection hook (a plain
# `uv run pytest` — local dev and per-PR CI — never touches the real Dynamical.org catalog). Run them
# with `uv run pytest --run-network` — see docs/architecture/testing.md. The gate lives in a hook,
# not in an `addopts` `-m "not network"`, because any caller-supplied `-m` would silently override it.
addopts = "--import-mode=importlib"
# Put the root `tests/` dir on sys.path so its integration tests can import shared, non-fixture
# test data (e.g. `_nwp_test_data`) by bare name — importlib mode does not add each test file's
# own directory to sys.path the way prepend mode does.
pythonpath = ["tests"]
# `error` first: any warning not explicitly excepted below fails the test that raised it, so a
# deprecation in our own code is caught by the PR that introduces it instead of accumulating in the
# summary. Later entries win, so every exception below is applied on top of `error`.
#
# Each exception silences one *third-party* deprecation we cannot fix from this repo, and is pinned
# to the exact message and the exact upstream module that raises it, so it can never match a warning
# from our own code. Delete an entry when the upstream release named in its comment ships a fix.
# When a dependency upgrade adds a new upstream warning, the suite fails loudly: add an entry here,
# named and dated the same way, rather than widening an existing one.
filterwarnings = [
    "error",
    # mlflow 3.15.1: `utils/file_utils.py` and `utils/yaml_utils.py` (the only two call sites, and
    # both read and write) still use the `codecs.open()` that Python 3.14 deprecated. Triggered by
    # every file-store access, so most of the MLflow-backed tests hit it. Delete once MLflow
    # switches to the builtin `open()`.
    "ignore:codecs\\.open\\(\\) is deprecated:DeprecationWarning:mlflow\\.utils\\.(file_utils|yaml_utils)$",
    # dagster 1.13.16: `_core/storage/event_log/sql_event_log.py` still calls the
    # `datetime.utcfromtimestamp()` that Python 3.12 deprecated. Triggered whenever an asset check
    # evaluation is written to the event log. Delete once Dagster moves to timezone-aware datetimes.
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:dagster\\._core\\.storage\\.event_log\\.sql_event_log$",
]
# `.claude` holds git worktrees (`.claude/worktrees/*`), each a full checkout carrying its own
# copy of this `conftest.py`; recursing into them re-registers the `--run-network` option and
# aborts collection with "option names {'--run-network'} already added".
norecursedirs = [".venv", "venv", ".git", ".claude", "__pycache__"]
markers = [
    "integration: tests that exercise real wiring (Dagster + file-based MLflow + temp Delta)",
    "network: hits the real Dynamical.org NWP catalog; skipped by default, `--run-network` to run",
]

[tool.pymarkdown]
# Line length: prose isn't hard-wrapped in this repo's docs, and ruff's default lint
# selection doesn't enforce E501 either, so there's no existing precedent to match.
plugins.md013.enabled = false
# Duplicate heading: only flag duplicates under the same parent heading, not across
# the whole file (e.g. "Usage" appearing under two different top-level sections).
plugins.md024.siblings_only = true
# Nested list indent: MkDocs' renderer (Python-Markdown, no sane-lists extension) only treats a
# sub-list as nested when it's indented a full 4 spaces; 2-space indent (a bare list's default)
# silently renders as a flat, unnested list instead. Match the renderer, not the default.
#
# Use PML101 ("anchored list indentation"), not the more common MD007 ("ul-indent"), to enforce
# this: MD007 hard-codes bullets nested under an *ordered* item to align with the parent's
# content column (3 spaces for a "1. " marker) and ignores its own `indent` setting for that
# case — but Python-Markdown still needs a full 4 spaces to nest there, so MD007's own preferred
# indent renders flat. It also never checks a numbered sublist's indentation at all. PML101
# anchors every level at (depth − 1) × indent regardless of parent marker width, which is exactly
# Python-Markdown's model, so it accepts 4-space nesting under both bullet and numbered parents
# with no pragmas — and catches under-indented numbered sublists that MD007 misses entirely.
plugins.md007.enabled = false
plugins.pml101.enabled = true
plugins.pml101.indent = 4
# Front matter: Claude Code skills (.claude/skills/*/SKILL.md) require a YAML frontmatter block.
# Without this, pymarkdown misreads the frontmatter as document content (e.g. "---" as a setext
# heading underline), producing spurious heading-style/blank-line errors.
extensions.front-matter.enabled = true

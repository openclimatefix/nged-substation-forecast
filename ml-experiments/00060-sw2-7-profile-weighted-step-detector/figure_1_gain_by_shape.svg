uld count as a gain. 620 injected transfers of 25% to 40% of the receiving load, over 1 day, starting in even months. S1 matches D3's model; S5 works against it.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 31)"><tspan>Dot: estimate. Line: 98.33% interval from resampling whole calendar months. Grey</tspan><tspan x="0" dy="13">rule: no gain. Dashed orange rule: the +0.01 that would count as a gain. 620</tspan><tspan x="0" dy="13">injected transfers of 25% to 40% of the receiving load, over 1 day, starting in</tspan><tspan x="0" dy="13">even months. S1 matches D3&apos;s model; S5 works against it.</tspan></text></g></g></svg>

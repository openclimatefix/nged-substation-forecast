ription="text mark container" class="mark-text role-mark concat_2_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(454 556)">same as ERA5</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_2_layer_2_marks"><text fill="#292b2b" aria-label="x: −1" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 556)">← ICON-DREAM-EU better</text></g><g stroke="#10c5f7" stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_2_layer_3_marks" clip-path="url(#f)" transform="translate(225 562)"><path d="M107.6 20H199m-91.4 40h87"/></g><g fill="#10c5f7" aria-hidden="true" class="mark-symbol role-mark concat_2_layer_4_marks" clip-path="url(#g)" transform="translate(225 562)"><path d="M158.3 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-2.7 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'ICON-DREAM-EU − ERA5, December 2022 to August 2026'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 540)">ICON-DREAM-EU − ERA5, December 2022 to August 2026</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 7: CAMS beats SARAH-3 by about 0.4 points under every satellite, and ICON-DREAM-EU beats ERA5 by 0.3 points'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 7: CAMS beats SARAH-3 by about 0.4 points under every satellite,</tspan><tspan x="0" dy="20">and ICON-DREAM-EU beats ERA5 by 0.3 points</tspan></text><text aria-label="Subtitle text 'Top two: SARAH-3's mean absolute error minus CAMS's. Bottom: ICON-DREAM-EU's minus ERA5's. The satellite rows are on the hours ERA5, CAMS, SARAH-3 and ICON-DREAM-EU all cover; January 2022, one month with a fortnight from Meteosat-9, is too short for an interval and is left out. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Top two: SARAH-3&apos;s mean absolute error minus CAMS&apos;s. Bottom: ICON-DREAM-EU&apos;s minus ERA5&apos;s. The satellite rows are</tspan><tspan x="0" dy="13">on the hours ERA5, CAMS, SARAH-3 and ICON-DREAM-EU all cover; January 2022, one month with a fortnight from</tspan><tspan x="0" dy="13">Meteosat-9, is too short for an interval and is left out.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v80H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v80H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v80H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v80H0z"/></clipPath></defs></svg>

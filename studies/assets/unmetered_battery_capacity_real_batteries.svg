nslate(6 19)"><tspan>Figure 15: Real public batteries added to NGED demand are mostly not</tspan><tspan x="0" dy="20">recovered</tspan></text><text aria-label="Subtitle text 'Exploratory. 23 real batteries and fleets of 2, 4, and 8 batteries, each added to 9 series in 4 blocks: 828 sums per share. The truth is the registered power. On calendar replicas (almost no demand noise, thresholds from their own no-battery blocks) the real batteries are flagged, but the posterior median is still about 6% of the registered power.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Exploratory. 23 real batteries and fleets of 2, 4, and 8 batteries, each added to 9 series in 4 blocks: 828 sums</tspan><tspan x="0" dy="13">per share. The truth is the registered power.</tspan><tspan x="0" dy="13">On calendar replicas (almost no demand noise, thresholds from their own no-battery blocks) the real batteries are</tspan><tspan x="0" dy="13">flagged, but the posterior median is still about 6% of the registered power.</tspan></text></g></g></svg>

3)">CX2</text><text transform="translate(24.5 239)">HM</text><text transform="translate(24.5 265)">S0</text><text transform="translate(24.5 291)">NR</text><text transform="translate(24.5 317)">PR</text><text transform="translate(24.5 343)">CX1</text><text transform="translate(24.5 369)">EM</text><text transform="translate(24.5 395)">R30</text><text transform="translate(24.5 421)">CSQ</text></g><path stroke="#292b2b" d="M31.5 145.5v286" class="mark-rule role-axis-domain"/></g></g><g aria-label="Symbol legend titled 'Grade' for fill color with 3 values: yes, partly, no" aria-roledescription="legend" class="mark-group role-legend"><path d="M31 451h139v29H31Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M31 467.3h34v12.4H31Z" aria-hidden="true" class="background"/><path fill="#306bff" stroke="#fffbf5" stroke-width="1.5" d="M32 468.3h10v10H32Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(47 476.3)">yes</text><path d="M77 467.3h52v12.4H77Z" aria-hidden="true" class="background"/><path fill="#9cb6e1" stroke="#fffbf5" stroke-width="1.5" d="M78 468.3h10v10H78Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(93 476.3)">partly</text><path d="M141 467.3h28v12.4h-28Z" aria-hidden="true" class="background"/><path fill="#d9d0ca" stroke="#fffbf5" stroke-width="1.5" d="M142 468.3h10v10h-10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(157 476.3)">no</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(31 460)">Grade</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 10: DP1 and KF score highest for explainability, and the running maximum and the quantile formulas lowest'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 10: DP1 and KF score highest for explainability, and the running</tspan><tspan x="0" dy="20">maximum and the quantile formulas lowest</tspan></text><text aria-label="Subtitle text 'Each estimator is graded yes, partly, or no on five criteria by reading its code, before any result existed. The score is the number of yes grades plus half the number of partly grades. Criteria: an operator can be told in one sentence why the capacity fell; the fitted quantities have physical units; a change can be attributed to a cause; the estimator returns a spread; the estimator can be differentiated through.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each estimator is graded yes, partly, or no on five criteria by reading its code, before any result existed. The</tspan><tspan x="0" dy="13">score is the number of yes grades plus half the number of partly grades.</tspan><tspan x="0" dy="13">Criteria: an operator can be told in one sentence why the capacity fell; the fitted quantities have physical units;</tspan><tspan x="0" dy="13">a change can be attributed to a cause; the estimator returns a spread; the estimator can be differentiated through.</tspan></text></g></g></svg>

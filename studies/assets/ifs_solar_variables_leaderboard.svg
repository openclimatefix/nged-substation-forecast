-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(306 798.3)">3</text><path d="M324 789.3h22v12.5h-22Z" aria-hidden="true" class="background"/><path fill="#b701ff" stroke="#b701ff" stroke-width="1.5" d="M335 795.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(340 798.3)">5</text><path d="M358 789.3h22v12.5h-22Z" aria-hidden="true" class="background"/><path fill="#10c5f7" stroke="#10c5f7" stroke-width="1.5" d="M369 795.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(374 798.3)">7</text><path d="M392 789.3h22v12.5h-22Z" aria-hidden="true" class="background"/><path fill="#292b2b" stroke="#292b2b" stroke-width="1.5" d="M403 795.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(408 798.3)">9</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(222 782)">Lead day</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 6: Error of every variable set at every lead day'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 6: Error of every variable set at every lead day</text><text aria-label="Subtitle text 'Six solar farms of National Grid Electricity Distribution (NGED), daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. Dot: estimate at the main XGBoost tuning setting. Line: 95% interval from resampling whole months. Every lead day is scored on the same farm-hours, those that all six lead days hold. The intervals of two rows overlap more than the paired differences between rows would. Rows run in ladder order, not best first. A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar. F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective energy (CAPE), inhibition, visibility. F6 (all 20 IFS variables): surface and weather variables. IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day. FP: F0 plus dew point, pressure, precipitation, and wind speed, the variables the production forecast already receives. Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six solar farms of National Grid Electricity Distribution (NGED), daylight hours, March 2024 to April 2026. IFS:</tspan><tspan x="0" dy="13">ECMWF&apos;s forecast via Open-Meteo.</tspan><tspan x="0" dy="13">Dot: estimate at the main XGBoost tuning setting. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Every lead day is scored on the same farm-hours, those that all six lead days hold. The intervals of two rows</tspan><tspan x="0" dy="13">overlap more than the paired differences between rows would. Rows run in ladder order, not best first.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar.</tspan><tspan x="0" dy="13">F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and</tspan><tspan x="0" dy="13">high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective</tspan><tspan x="0" dy="13">energy (CAPE), inhibition, visibility. F6 (all 20 IFS variables): surface and weather variables.</tspan><tspan x="0" dy="13">IFS: ECMWF&apos;s 9 km forecast, 00 UTC run, read at a lead day.</tspan><tspan x="0" dy="13">FP: F0 plus dew point, pressure, precipitation, and wind speed, the variables the production forecast already</tspan><tspan x="0" dy="13">receives.</tspan><tspan x="0" dy="13">Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

pace" font-size="10" transform="translate(96 148)">Calendar replicas, all 25 BMUs</text><path d="M80 152h208v11H80Z" aria-hidden="true" class="background"/><path fill="#306bff" d="M91 158a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(96 161)">Real output, 9 cloud-signal BMUs</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 23: Across all cost settings tried, the fitted solar capacity of the 25 BMUs stays between 1,150 MW and 1,220 MW'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5.3 19)"><tspan>Figure 23: Across all cost settings tried, the fitted solar capacity of</tspan><tspan x="0" dy="20">the 25 BMUs stays between 1,150 MW and 1,220 MW</tspan></text><text aria-label="Subtitle text 'Rung 7b's model fitted to the 25 real aggregate BMUs and their calendar replicas while varying the cost per megawatt of battery throughput (against 1 per megawatt of residual) and adding a cost per megawatt of fitted solar capacity. The dashed line is the fit with no battery and no solar cost. Battery 0.1 and solar 0 are rung 7b's settings. The solar costs of 0.01 and 0.05 are charged once per megawatt of capacity against a residual summed over about 17,500 half-hours, so they are too small to move the fit and test nothing.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.3 58)"><tspan>Rung 7b&apos;s model fitted to the 25 real aggregate BMUs and their calendar replicas while varying the cost per</tspan><tspan x="0" dy="13">megawatt of battery throughput (against 1 per megawatt of residual) and adding a cost per megawatt of fitted solar</tspan><tspan x="0" dy="13">capacity. The dashed line is the fit with no battery and no solar cost. Battery 0.1 and solar 0 are rung 7b&apos;s</tspan><tspan x="0" dy="13">settings. The solar costs of 0.01 and 0.05 are charged once per megawatt of capacity against a residual summed over</tspan><tspan x="0" dy="13">about 17,500 half-hours, so they are too small to move the fit and test nothing.</tspan></text></g></g></svg>

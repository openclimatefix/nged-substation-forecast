her</tspan><tspan x="0" dy="20">products beats an XGBoost model given the best single product and its</tspan><tspan x="0" dy="20">neighbouring hours</tspan></text><text aria-label="Subtitle text 'Blend's mean absolute error minus the best single product's. Each best single product is given its neighbouring hours, and CAMS its beam split, as the blend's products are. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to September 2026. Every row is post hoc: chosen after the first run's results, and fixed before the re-run that produced the numbers on this page.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Blend&apos;s mean absolute error minus the best single product&apos;s. Each best single product is given its neighbouring</tspan><tspan x="0" dy="13">hours, and CAMS its beam split, as the blend&apos;s products are.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to</tspan><tspan x="0" dy="13">September 2026.</tspan><tspan x="0" dy="13">Every row is post hoc: chosen after the first run&apos;s results, and fixed before the re-run that produced the numbers</tspan><tspan x="0" dy="13">on this page.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v260H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v260H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v260H0z"/></clipPath></defs></svg>

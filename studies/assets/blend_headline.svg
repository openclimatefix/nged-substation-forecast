is for a discrete scale with 5 values: Solar: CAMS + ERA5 + UKV + ICON-D2 + ICON-EU + ICON global, against CAMS, Solar: CAMS and ICON-EU, against CAMS, Solar: UKV + ICON-D2 + ICON-EU + ICON global, against ICON-D2, Wind: ERA5 + UKV + ICON-D2 + ICON-EU + ICON global, against UKV, Wind: UKV and ICON-EU, against UKV" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 290)"><tspan>Solar: CAMS + ERA5 + UKV +</tspan><tspan x="0" dy="12">ICON-D2 + ICON-EU + ICON</tspan><tspan x="0" dy="12">global, against CAMS</tspan></text><text transform="translate(219.5 340)"><tspan>Solar: CAMS and ICON-EU,</tspan><tspan x="0" dy="12">against CAMS</tspan></text><text transform="translate(219.5 390)"><tspan>Solar: UKV + ICON-D2 + ICON-EU</tspan><tspan x="0" dy="12">+ ICON global, against ICON-D2</tspan></text><text transform="translate(219.5 440)"><tspan>Wind: ERA5 + UKV + ICON-D2 +</tspan><tspan x="0" dy="12">ICON-EU + ICON global, against</tspan><tspan x="0" dy="12">UKV</tspan></text><text transform="translate(219.5 490)"><tspan>Wind: UKV and ICON-EU, against</tspan><tspan x="0" dy="12">UKV</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_concat_1_layer_0_marks"><path stroke="#292b2b" d="M618.8 257v260" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="end" transform="translate(614.8 251)">same as the best single product</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −0.7" aria-r
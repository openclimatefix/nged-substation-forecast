#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: The seven sets of CERRA wind columns span 0.5 points of pooled error'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: The seven sets of CERRA wind columns span 0.5 points of pooled</tspan><tspan x="0" dy="20">error</tspan></text><text aria-label="Subtitle text 'Mean absolute error of each XGBoost model's estimate of a wind farm's hourly power. Dot: estimate. Line: 95% interval from resampling whole months. Errors are a fraction of each wind farm's capacity. The intervals overlap because months of weather dominate them, which does not mean the sets are equal. Figure 2 compares the sets on the same months. Three wind farms, September 2019 to June 2026, on CERRA's 3-hourly analysis.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Mean absolute error of each XGBoost model&apos;s estimate of a wind farm&apos;s hourly power.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Errors are a fraction of each wind farm&apos;s capacity.</tspan><tspan x="0" dy="13">The intervals overlap because months of weather dominate them, which does not mean the sets are equal. Figure 2</tspan><tspan x="0" dy="13">compares the sets on the same months.</tspan><tspan x="0" dy="13">Three wind farms, September 2019 to June 2026, on CERRA&apos;s 3-hourly analysis.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v560H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v560H0z"/></clipPath></defs></svg>

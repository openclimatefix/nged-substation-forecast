l-global blend, a simple mean and a linear stack, both</tspan><tspan x="0" dy="20">negative controls, and further comparisons among CAMS, CAMS&apos;s split, and</tspan><tspan x="0" dy="20">SARAH-3</tspan></text><text aria-label="Subtitle text 'Every row's label names its own treatment and reference model. Dot: estimate. Line: 95% interval from resampling whole months and a seed. Each negative control adds a noised copy of CAMS's own column, which should carry almost no independent information. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, January 2021 to August 2026. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Every row&apos;s label names its own treatment and reference model.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a seed.</tspan><tspan x="0" dy="13">Each negative control adds a noised copy of CAMS&apos;s own column, which should carry almost no independent</tspan><tspan x="0" dy="13">information.</tspan><tspan x="0" dy="13">Capacity is each generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, January 2021 to August 2026.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v440H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v440H0z"/></clipPath></defs></svg>

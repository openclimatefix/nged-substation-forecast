="true" class="mark-symbol role-mark concat_1_layer_2_marks" clip-path="url(#d)" transform="translate(225 604)"><path fill="#ff4901" d="M214.2 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M178.2 60a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m154 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-71 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m31 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-182 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M242.2 260a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m48 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Extra rows: November 2024 to August 2026'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 596)">Extra rows: November 2024 to August 2026</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12: On the main rows every product with its own direct beam, except ERA5, gains 0.03 to 0.10 points from it; on the extra rows UKV and ICON-D2 gain and ECMWF-IFS-HRES loses'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 12: On the main rows every product with its own direct beam,</tspan><tspan x="0" dy="20">except ERA5, gains 0.03 to 0.10 points from it; on the extra rows UKV</tspan><tspan x="0" dy="20">and ICON-D2 gain and ECMWF-IFS-HRES loses</tspan></text><text aria-label="Subtitle text 'Each product with its own published beam and diffuse, minus with the Erbs split of its own global irradiance. SARAH-3 is left out: its direct beam is modelled from its own global irradiance. The two row sets are scored on their own rows, so compare products within a panel. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Each product with its own published beam and diffuse, minus with the Erbs split of its own global irradiance.</tspan><tspan x="0" dy="13">SARAH-3 is left out: its direct beam is modelled from its own global irradiance. The two row sets are scored on</tspan><tspan x="0" dy="13">their own rows, so compare products within a panel.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v280H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v280H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v320H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v320H0z"/></clipPath></defs></svg>

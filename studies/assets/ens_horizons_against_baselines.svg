y 14 climatology; wind: day 0 smart persistence, day 1 smart persistence, day 2 smart persistence, day 3 smart persistence, day 5 climatology, day 7 climatology, day 10 smart persistence, day 14 smart persistence. Planned: the ensemble mean against climatology at day 7, for solar and wind; every other mark is exploratory. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, every daylight hour, April 2024 to September 2026. Three wind farms in Lincolnshire, every hour, December 2024 to September 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Mean absolute error of an XGBoost model given ENS minus that of the no-weather baseline with the lowest error at</tspan><tspan x="0" dy="13">the same horizon, chosen after the run: solar: day 0 climatology, day 1 climatology, day 2 climatology, day 3</tspan><tspan x="0" dy="13">climatology, day 5 climatology, day 7 climatology, day 10 climatology, day 14 climatology; wind: day 0 smart</tspan><tspan x="0" dy="13">persistence, day 1 smart persistence, day 2 smart persistence, day 3 smart persistence, day 5 climatology, day 7</tspan><tspan x="0" dy="13">climatology, day 10 smart persistence, day 14 smart persistence. Planned: the ensemble mean against climatology at</tspan><tspan x="0" dy="13">day 7, for solar and wind; every other mark is exploratory.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, every daylight hour, April 2024 to September 2026. Three wind farms in</tspan><tspan x="0" dy="13">Lincolnshire, every hour, December 2024 to September 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v410H0z"/></clipPath></defs></svg>

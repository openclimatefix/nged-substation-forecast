<tspan>ICON-D2&apos;s mean absolute error minus ICON-EU&apos;s. Both run every 3 hours, so at each hour both are served at the same</tspan><tspan x="0" dy="13">lead.</tspan><tspan x="0" dy="13">Rows other than all hours were added after the first run. Filled: 1 h lead; pale and hollow: 2 h and 3 h.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to August 2026.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v320H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v320H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v320H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

tion="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58.9)"><tspan>One week in winter, with days numbered rather than dated. Each series is divided by its own 99th percentile. The</tspan><tspan x="0" dy="13">battery exports when its output is positive, which lowers the import.</tspan><tspan x="0" dy="13">The two half-hour changes correlate at -0.29 over the study year, and at 0.07 or less with every primary: the</tspan><tspan x="0" dy="13">evidence that the battery connects to this bulk supply point.</tspan></text></g></g></svg>

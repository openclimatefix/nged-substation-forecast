abel" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(68 634)">Real battery (Lakeside)</text><path d="M218 625h304v11H218Z" aria-hidden="true" class="background"/><path stroke="#ff4901" stroke-width="1.5" d="M219 631h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(234 634)">Rank-rule schedule (2 h)</text><path d="M534 625h202v11H534Z" aria-hidden="true" class="background"/><path stroke="#306bff" stroke-width="1.5" d="M535 631h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(550 634)">Linear-programme schedule (2 h)</text><path d="M52 638h154v11H52Z" aria-hidden="true" class="background"/><path stroke="#17e58f" stroke-width="1.5" d="M53 644h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(68 647)">Day-ahead price</text><path d="M218 638h304v11H218Z" aria-hidden="true" class="background"/><path stroke="#b701ff" stroke-width="1.5" d="M219 644h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(234 647)">State of charge of the linear-programme schedule</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 10: A real battery trades in many small steps, while price-only schedules use full power in a few blocks'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 10: A real battery trades in many small steps, while price-only</tspan><tspan x="0" dy="20">schedules use full power in a few blocks</tspan></text><text aria-label="Subtitle text 'Tuesday 16 and Wednesday 17 December 2025, UTC. Both schedules are built from the day-ahead price alone for a 2-hour battery. The linear programme has one-way efficiency 0.92, state of charge 5% to 95%, at most 1 cycle a day, and each day ends at the state of charge it started at. The real output is Lakeside's, divided by its 99th- percentile output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Tuesday 16 and Wednesday 17 December 2025, UTC. Both schedules are built from the day-ahead price alone for a</tspan><tspan x="0" dy="13">2-hour battery. The linear programme has one-way efficiency 0.92, state of charge 5% to 95%, at most 1 cycle a day,</tspan><tspan x="0" dy="13">and each day ends at the state of charge it started at. The real output is Lakeside&apos;s, divided by its 99th-</tspan><tspan x="0" dy="13">percentile output.</tspan></text></g></g></svg>

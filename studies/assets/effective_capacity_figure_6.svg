t aria-label="Title text 'Figure 6: The Kalman filter raised error in December to February, and HYST did not'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 6: The Kalman filter raised error in December to February, and</tspan><tspan x="0" dy="20">HYST did not</tspan></text><text aria-label="Subtitle text 'Change in an XGBoost forecast's mean absolute error against B0, for the 5 scored months from December to February and the 13 others. Dot: estimate. Line: 95% interval from a t-distribution over those months. KF: the Kalman filter (orange). HYST: hold at static (purple). Post hoc, at the primary setting.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Change in an XGBoost forecast&apos;s mean absolute error against B0, for the 5 scored months from December to February</tspan><tspan x="0" dy="13">and the 13 others. Dot: estimate. Line: 95% interval from a t-distribution over those months.</tspan><tspan x="0" dy="13">KF: the Kalman filter (orange). HYST: hold at static (purple). Post hoc, at the primary setting.</tspan></text></g></g></svg>

"mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(316 580)">differentiable physics</text><path d="M460 571h94v12.5h-94Z" aria-hidden="true" class="background"/><path fill="#b701ff" stroke="#b701ff" stroke-width="1.5" d="M471 577a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(476 580)">post hoc</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(176 548)">Estimator family</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 3: Most estimators recovered a planted loss better than doing nothing, and the Kalman filter did so best'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 3: Most estimators recovered a planted loss better than doing</tspan><tspan x="0" dy="20">nothing, and the Kalman filter did so best</tspan></text><text aria-label="Subtitle text 'Each dot: an estimator's mean gap, over planted steps, ramps, and intermittent losses at every plant in 10 random draws, between the capacity share it recovered and the share left after the loss, in points (a gap of 0.02 in the share is 2 points). Smaller is better. The text at the right gives the mean days an estimator took to cross halfway to a planted step. EM and S0 never detect a step. The dashed line is S0, which always reports the static capacity. Post hoc: designed after the results.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each dot: an estimator&apos;s mean gap, over planted steps, ramps, and intermittent losses at every plant in 10 random</tspan><tspan x="0" dy="13">draws, between the capacity share it recovered and the share left after the loss, in points (a gap of 0.02 in the</tspan><tspan x="0" dy="13">share is 2 points). Smaller is better.</tspan><tspan x="0" dy="13">The text at the right gives the mean days an estimator took to cross halfway to a planted step. EM and S0 never</tspan><tspan x="0" dy="13">detect a step. The dashed line is S0, which always reports the static capacity. Post hoc: designed after the</tspan><tspan x="0" dy="13">results.</tspan></text></g></g></svg>

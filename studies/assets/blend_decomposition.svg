class="mark-text role-mark concat_0_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −0.7" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 244)">← first-named XGBoost model better</text></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_concat_1_layer_3_marks" clip-path="url(#a)" transform="translate(225 250)"><path stroke="#ff4901" d="M234 20h32.5"/><path stroke="#306bff" d="M375 40h18"/><path stroke="#ff4901" d="M272 70h32.5"/><path stroke="#306bff" d="M356.5 90h9.5"/><path stroke="#ff4901" d="M107.5 120h87"/><path stroke="#306bff" d="M362 140h31"/><path stroke="#ff4901" d="M42.5 170h80"/><path stroke="#306bff" d="M359 190h35.5"/><path stroke="#ff4901" d="M183.5 220H240"/><path stroke="#306bff" d="M344.5 240h25"/></g><g fill="#ff4901" aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_4_marks" clip-path="url(#b)" transform="translate(225 250)"><path d="M255.2 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m37.5 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-136.5 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-68.5 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m127.5 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_5_marks" clip-path="url(#c)" transform="translate(225 250)"><path d="m378.8 40 4.2-4.2 4.2 4.2-4.2 4.2Zm-22 50 4.2-4.2 4.2 4.2-4.2 4.2Zm16 50 4.2-4.2 4.2 4.2-4.2 4.2Zm.5 50 4.2-4.2 4.2 4.2-4.2 4.2Zm-19 50 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 7: The gain comes from the other products' weather, not from the extra columns'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 7: The gain comes from the other products&apos; weather, not from the</tspan><tspan x="0" dy="20">extra columns</tspan></text><text aria-label="Subtitle text 'Orange: the blend minus its control, which measures the other products' weather. Blue: the control minus the best single product, which measures the extra columns alone. The control is the blend with every product but the best single one replaced by that product's values from other days of the same month, at the same hour. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to September 2026. Every row is post hoc: chosen after the first run's results, and fixed before the re-run that produced the numbers on this page.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Orange: the blend minus its control, which measures the other products&apos; weather. Blue: the control minus the best</tspan><tspan x="0" dy="13">single product, which measures the extra columns alone. The control is the blend with every product but the best</tspan><tspan x="0" dy="13">single one replaced by that product&apos;s values from other days of the same month, at the same hour.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to</tspan><tspan x="0" dy="13">September 2026.</tspan><tspan x="0" dy="13">Every row is post hoc: chosen after the first run&apos;s results, and fixed before the re-run that produced the numbers</tspan><tspan x="0" dy="13">on this page.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v260H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v260H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v260H0z"/></clipPath></defs></svg>

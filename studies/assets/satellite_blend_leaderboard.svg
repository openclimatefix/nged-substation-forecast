plus SARAH-3 has the lowest error of the single products and blends tested here'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 12: CAMS&apos;s split plus its own neighbouring hours plus SARAH-3 has</tspan><tspan x="0" dy="20">the lowest error of the single products and blends tested here</tspan></text><text aria-label="Subtitle text 'Each arm's own mean absolute error, sorted best first. Dot: estimate. Line: 95% interval from resampling whole months and a seed. The intervals are wide mainly because every arm's error swings together from month to month, a swing the contrasts in Figures 13 and 14 cancel. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, January 2021 to August 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each arm&apos;s own mean absolute error, sorted best first.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a seed.</tspan><tspan x="0" dy="13">The intervals are wide mainly because every arm&apos;s error swings together from month to month, a swing the contrasts</tspan><tspan x="0" dy="13">in Figures 13 and 14 cancel.</tspan><tspan x="0" dy="13">Capacity is each generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, January 2021 to August 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v570H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v570H0z"/></clipPath></defs></svg>

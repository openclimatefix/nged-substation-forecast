s" clip-path="url(#h)" transform="translate(225 865)"><path d="M107 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0m65.3 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m5.2 50a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m117 50a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g stroke="#9cb6e1" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_2_layer_3_marks" clip-path="url(#i)" transform="translate(225 865)"><path d="m133.8 40 4.2-4.2 4.2 4.2-4.2 4.2Zm22.5 50 4.2-4.2 4.2 4.2-4.2 4.2Zm-6 50 4.2-4.2 4.2 4.2-4.2 4.2Zm93 50 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Lead day 3'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 857)">Lead day 3</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12: For the six solar farms, the blend with UKV-CEDA's older run, which starts 9 hours before ENS's run, gains less over padded ENS than the planned blend, in the point estimates at every lead day and both settings'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 12: For the six solar farms, the blend with UKV-CEDA&apos;s older run,</tspan><tspan x="0" dy="20">which starts 9 hours before ENS&apos;s run, gains less over padded ENS than</tspan><tspan x="0" dy="20">the planned blend, in the point estimates at every lead day and both</tspan><tspan x="0" dy="20">settings</tspan></text><text aria-label="Subtitle text 'Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the earlier start. At lead days 1 and 2 the older run also has more hours rebuilt from 3-hourly steps, which the figure cannot separate either. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval from resampling whole months and a fitting seed. The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of</tspan><tspan x="0" dy="13">capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The</tspan><tspan x="0" dy="13">older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the</tspan><tspan x="0" dy="13">earlier start. At lead days 1 and 2 the older run also has more hours rebuilt from 3-hourly steps, which the figure</tspan><tspan x="0" dy="13">cannot separate either. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval</tspan><tspan x="0" dy="13">from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v210H0z"/></clipPath></defs></svg>

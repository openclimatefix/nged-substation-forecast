4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Lead day 3'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 857)">Lead day 3</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 13: For the three wind farms, the blend with UKV-CEDA's older run, which starts 9 hours before ENS's run, gains less over padded ENS than the planned blend, in the point estimates at every lead day and both settings'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 13: For the three wind farms, the blend with UKV-CEDA&apos;s older</tspan><tspan x="0" dy="20">run, which starts 9 hours before ENS&apos;s run, gains less over padded ENS</tspan><tspan x="0" dy="20">than the planned blend, in the point estimates at every lead day and</tspan><tspan x="0" dy="20">both settings</tspan></text><text aria-label="Subtitle text 'Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the earlier start. At lead days 1 and 2 the older run also has more hours rebuilt from 3-hourly steps, which the figure cannot separate either. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval from resampling whole months and a fitting seed. The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of</tspan><tspan x="0" dy="13">capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The</tspan><tspan x="0" dy="13">older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the</tspan><tspan x="0" dy="13">earlier start. At lead days 1 and 2 the older run also has more hours rebuilt from 3-hourly steps, which the figure</tspan><tspan x="0" dy="13">cannot separate either. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval</tspan><tspan x="0" dy="13">from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v210H0z"/></clipPath></defs></svg>

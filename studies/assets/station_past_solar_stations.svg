<svg xmlns="http://www.w3.org/2000/svg" width="680" height="528" class="marks" viewBox="0 0 680 528"><path fill="#fffbf5" d="M0 0h680v528H0z"/><g fill="none" stroke-miterlimit="10" aria-roledescription="group mark container" class="mark-group role-frame root"><path d="M225 198h450z" aria-hidden="true" class="background"/><g aria-roledescription="group mark container" class="mark-group role-scope concat_0_group"><path fill="#fffbf5" d="M225 198h450v280H225Z" aria-hidden="true" class="background"/><g aria-hidden="true" class="mark-group role-axis"><path stroke="#eaeaea" d="M303.5 478.5v-280m80 280v-280m80 280v-280m80 280v-280m80 280v-280" class="mark-rule role-axis-grid" pointer-events="none"/></g><g aria-label="X-axis titled 'Difference in mean absolute error (points of capacity; more negative means first input better)' for a linear scale with values from −2.97 to 2.65" aria-roledescription="axis" class="mark-group role-axis" pointer-events="none"><path stroke="#292b2b" d="M303.5 478.5v5m80-5v5m80-5v5m80-5v5m80-5v5" class="mark-rule role-axis-tick"/><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" text-anchor="middle"><text transform="translate(303.3 493.5)">−2</text><text transform="translate(383.4 493.5)">−1</text><text transform="translate(463.6 493.5)">0</text><text transform="translate(543.7 493.5)">1</text><text transform="translate(623.8 493.5)">2</text></g><path stroke="#292b2b" d="M225.5 478.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(450.5 508.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">first input better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 7 values: Mean of the 3 nearest stations − Nearest station, Second-nearest station − Nearest station, Third-nearest station − Nearest station, Mean of the 3 nearest stations − CAMS, Mean of the 3 nearest stations − ERA5, Second-nearest station − ERA5, Third-nearest station − ERA5" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 221)"><tspan>Mean of the 3 nearest stations</tspan><tspan x="0" dy="12">− Nearest station</tspan></text><text transform="translate(219.5 261)"><tspan>Second-nearest station −</tspan><tspan x="0" dy="12">Nearest station</tspan></text><text transform="translate(219.5 301)"><tspan>Third-nearest station −</tspan><tspan x="0" dy="12">Nearest station</tspan></text><text transform="translate(219.5 341)"><tspan>Mean of the 3 nearest stations</tspan><tspan x="0" dy="12">− CAMS</tspan></text><text transform="translate(219.5 381)"><tspan>Mean of the 3 nearest stations</tspan><tspan x="0" dy="12">− ERA5</tspan></text><text transform="translate(219.5 421)">Second-nearest station − ERA5</text><text transform="translate(219.5 461)">Third-nearest station − ERA5</text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_layer_0_marks"><path stroke="#292b2b" d="M463 198v280" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(467 192)">no difference</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_layer_2_marks"><text fill="#292b2b" aria-label="x: −2.971" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 192)">← first input better</text></g><g stroke="#b701ff" stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_layer_3_marks" clip-path="url(#a)" transform="translate(225 198)"><path d="M200.3 20h18.1m93.5 40h26.7m47.5 40H426m-81.4 40h46.6M24 180h36.4m79.1 40H176m44.3 40h37.3"/></g><g fill="#b701ff" aria-hidden="true" class="mark-symbol role-mark concat_0_layer_4_marks" clip-path="url(#b)" transform="translate(225 198)"><path d="M213.5 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m116 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m80.3 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-35.5 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M46.7 180a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m116 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m80.3 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Exploratory contrasts: more stations, and further stations'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 176)">Exploratory contrasts: more stations, and further stations</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 15: Averaging three stations beats the nearest station alone, and the third-nearest station scores no better than ERA5'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 15: Averaging three stations beats the nearest station alone, and</tspan><tspan x="0" dy="20">the third-nearest station scores no better than ERA5</tspan></text><text aria-label="Subtitle text 'The second- and third-nearest stations differ from the nearest in place, instrument, and record, as well as distance, so the gaps are not a distance effect alone. All six generators take the same nearest radiation station, 17 to 31 km away, so the station rows rest on one pyranometer. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to December 2025. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>The second- and third-nearest stations differ from the nearest in place, instrument, and record, as well as</tspan><tspan x="0" dy="13">distance, so the gaps are not a distance effect alone.</tspan><tspan x="0" dy="13">All six generators take the same nearest radiation station, 17 to 31 km away, so the station rows rest on one</tspan><tspan x="0" dy="13">pyranometer.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to December 2025.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v280H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v280H0z"/></clipPath></defs></svg>

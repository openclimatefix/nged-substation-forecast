 pointer-events="none" transform="translate(6 684)">On the dashed line, an interval means what it says</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 4: A coverage plot shows whether an interval means what it says'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 4: A coverage plot shows whether an interval means what it says</text><text aria-label="Subtitle text 'Each line in the upper two panels is one simulated sum's 90% interval for the battery's power, divided by the true power and sorted by its median; the dashed line is the truth. The lower panel plots, for the 50% and 90% intervals, the share that hold the truth against the nominal level. Below the dashed line, an interval is overconfident.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Each line in the upper two panels is one simulated sum&apos;s 90% interval for the battery&apos;s power, divided by the true</tspan><tspan x="0" dy="13">power and sorted by its median; the dashed line is the truth.</tspan><tspan x="0" dy="13">The lower panel plots, for the 50% and 90% intervals, the share that hold the truth against the nominal level.</tspan><tspan x="0" dy="13">Below the dashed line, an interval is overconfident.</tspan></text></g></g></svg>

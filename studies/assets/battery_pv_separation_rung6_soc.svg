title-subtitle" font-size="11" transform="translate(6 78)"><tspan>The same week and aggregate as Figure 1. The state of charge of the true battery is rung 3&apos;s integral of its output</tspan><tspan x="0" dy="13">at the fitted efficiency, scaled to the aggregate. The fit&apos;s starting charge is free in each 4-week window, so</tspan><tspan x="0" dy="13">every path is shown above its own lowest value in the week.</tspan></text></g></g></svg>

ow that two arms are equal: Figure 2's paired contrasts cancel the swing the arms share from month to month. Dot: estimate. Line: 95% interval from resampling calendar months and a fitting seed. The lighter, hollow row is ERA5, scored on that block's own rows.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each arm&apos;s mean absolute error, sorted best first within its block. Errors are a percentage of each</tspan><tspan x="0" dy="13">farm&apos;s 99th-percentile output, not its nameplate capacity.</tspan><tspan x="0" dy="13">The two blocks are scored on different rows, so compare arms only within a block.</tspan><tspan x="0" dy="13">Overlapping intervals do not show that two arms are equal: Figure 2&apos;s paired contrasts cancel the</tspan><tspan x="0" dy="13">swing the arms share from month to month.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling calendar months and a fitting seed.</tspan><tspan x="0" dy="13">The lighter, hollow row is ERA5, scored on that block&apos;s own rows.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v182H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v182H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v182H0z"/></clipPath></defs></svg>

l="#10c5f7" stroke="#10c5f7" stroke-width="1.5" d="M60 705.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(65 708.3)">total cloud (G1)</text><path d="M173 699.3h154v12.5H173Z" aria-hidden="true" class="background"/><path fill="#17e58f" stroke="#17e58f" stroke-width="1.5" d="M184 705.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(189 708.3)">three cloud layers (G2)</text><path d="M339 699.3h160v12.5H339Z" aria-hidden="true" class="background"/><path fill="#ff4901" stroke="#ff4901" stroke-width="1.5" d="M350 705.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(355 708.3)">every ERA5 variable (G9)</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 9: Change in error by season'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 9: Change in error by season</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. Dot: estimate. Line: 95% interval from resampling whole months. Dashed rule: no difference. Each row is one group of hours. Each colour is the error with a variable set minus the error with G0, the minimal set. Error: mean absolute error. A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar radiation (ssrd), and air temperature (t2m). Each group adds to the one before. G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation. G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation. G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables. G10: G9 plus CAMS aerosol. Clearness index: irradiance divided by the irradiance at the top of the atmosphere. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF&apos;s reanalysis of past weather. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Dashed rule: no difference. Each row is one group of hours. Each colour is the error</tspan><tspan x="0" dy="13">with a variable set minus the error with G0, the minimal set. Error: mean absolute</tspan><tspan x="0" dy="13">error.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar</tspan><tspan x="0" dy="13">radiation (ssrd), and air temperature (t2m). Each group adds to the one before.</tspan><tspan x="0" dy="13">G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation.</tspan><tspan x="0" dy="13">G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation.</tspan><tspan x="0" dy="13">G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables.</tspan><tspan x="0" dy="13">G10: G9 plus CAMS aerosol.</tspan><tspan x="0" dy="13">Clearness index: irradiance divided by the irradiance at the top of the atmosphere.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

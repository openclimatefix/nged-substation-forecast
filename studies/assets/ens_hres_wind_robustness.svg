der five fold designs and one row subset</tspan></text><text aria-label="Subtitle text 'The three planned contrasts, refitted under each fold design. The first row of each panel is the planned contrast itself. The other designs were added after the first results, so those rows are exploratory. A fold is a block of whole months held out for scoring. A design says where the blocks are cut and what the XGBoost model is told about each hour's era. The second row scores the study's own fits without the rows of May 2026, the rows the last design drops. The two rows that drop May 2026 (the row subset and the IFS Cycle 50r1 design) score 41,443 farm-hours, and every other row scores the farm-hours counted in the last line. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three farms are few independent sites. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>The three planned contrasts, refitted under each fold design. The first row of each panel is the planned contrast</tspan><tspan x="0" dy="13">itself. The other designs were added after the first results, so those rows are exploratory.</tspan><tspan x="0" dy="13">A fold is a block of whole months held out for scoring. A design says where the blocks are cut and what the XGBoost</tspan><tspan x="0" dy="13">model is told about each hour&apos;s era. The second row scores the study&apos;s own fits without the rows of May 2026, the</tspan><tspan x="0" dy="13">rows the last design drops.</tspan><tspan x="0" dy="13">The two rows that drop May 2026 (the row subset and the IFS Cycle 50r1 design) score 41,443 farm-hours, and every</tspan><tspan x="0" dy="13">other row scores the farm-hours counted in the last line.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v240H0z"/></clipPath></defs></svg>

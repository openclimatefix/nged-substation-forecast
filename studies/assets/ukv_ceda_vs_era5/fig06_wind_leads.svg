 value favours UKV-CEDA, and each line is a 95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as clear. Lead is also hour of day. Planned: P3 on all hours and P3's early and late windows. Every other row is post hoc.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each dot is UKV-CEDA&apos;s mean absolute error minus ERA5&apos;s, so a negative value favours UKV-CEDA, and each line is a</tspan><tspan x="0" dy="13">95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as</tspan><tspan x="0" dy="13">clear.</tspan><tspan x="0" dy="13">Lead is also hour of day.</tspan><tspan x="0" dy="13">Planned: P3 on all hours and P3&apos;s early and late windows. Every other row is post hoc.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v364H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v364H0z"/></clipPath><clipPath id="k"><path d="M0 0h450v364H0z"/></clipPath></defs></svg>

ext 'No arm beats the 00019 stack, and the capacity statistics make it worse'" aria-roledescription="title" class="mark-text role-title-text" font-size="14" transform="translate(6 16)">No arm beats the 00019 stack, and the capacity statistics make it worse</text><text aria-label="Subtitle text 'Each row is the first arm minus the second, on the quantile score over all leads; below zero favours the first arm. B0 is the 00019 stack. 16 Primary substations; 73 forecast runs, one every 5 days, July 2025 to June 2026. Dot: estimate. Line: 99.17% interval (Bonferroni across the six planned contrasts) from re- drawing whole months and seeds.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 31)"><tspan>Each row is the first arm minus the second, on the quantile score over all leads; below zero</tspan><tspan x="0" dy="13">favours the first arm. B0 is the 00019 stack. 16 Primary substations; 73 forecast runs, one</tspan><tspan x="0" dy="13">every 5 days, July 2025 to June 2026.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 99.17% interval (Bonferroni across the six planned contrasts) from re-</tspan><tspan x="0" dy="13">drawing whole months and seeds.</tspan></text></g></g></svg>

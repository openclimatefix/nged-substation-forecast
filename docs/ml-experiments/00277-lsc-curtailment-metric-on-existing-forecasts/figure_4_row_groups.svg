ans, sans-serif" pointer-events="none"><text aria-label="Title text 'After a logged transfer ends the unmasked GAM stack has the highest CRPS of the four forecasts, but the intervals overlap'" aria-roledescription="title" class="mark-text role-title-text" font-size="14" transform="translate(6 16.9)"><tspan>After a logged transfer ends the unmasked GAM stack has the highest CRPS of the</tspan><tspan x="0" dy="16">four forecasts, but the intervals overlap</tspan></text><text aria-label="Subtitle text 'Six Primaries, scored year, experiment 163's rows. Dot: estimate. Line: 95% interval from resampling whole months (ordinary rows) or whole logged transfers (during, after). The during and after groups rest on 3 and 7 transfers, so their lines understate the uncertainty.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 47.9)"><tspan>Six Primaries, scored year, experiment 163&apos;s rows. Dot: estimate. Line: 95% interval from resampling</tspan><tspan x="0" dy="13">whole months (ordinary rows) or whole logged transfers (during, after). The during and after groups rest</tspan><tspan x="0" dy="13">on 3 and 7 transfers, so their lines understate the uncertainty.</tspan></text></g></g></svg>

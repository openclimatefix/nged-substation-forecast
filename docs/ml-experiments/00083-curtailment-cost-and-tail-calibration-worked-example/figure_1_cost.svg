 dy="20">of the four forecasts</tspan></text><text aria-label="Subtitle text 'Mean total cost per day: curtailing in advance at GBP 100 per MWh, plus GBP 2,000 per MWh on energy left unmet, when each forecast procures its 95% quantile of net export above the export limit. 6 export-constrained demand substations, scored on forecasts made from October 2025 to June 2026. A perfect forecast would cost 8.5. Dot is the mean; line is the 95% interval from resampling whole months.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Mean total cost per day: curtailing in advance at GBP 100 per MWh, plus GBP 2,000 per MWh on energy left unmet,</tspan><tspan x="0" dy="13">when each forecast procures its 95% quantile of net export above the export limit.</tspan><tspan x="0" dy="13">6 export-constrained demand substations, scored on forecasts made from October 2025 to June 2026. A perfect</tspan><tspan x="0" dy="13">forecast would cost 8.5.</tspan><tspan x="0" dy="13">Dot is the mean; line is the 95% interval from resampling whole months.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

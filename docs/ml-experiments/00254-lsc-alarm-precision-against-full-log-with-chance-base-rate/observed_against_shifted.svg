ter XH, DM Sans, sans-serif" pointer-events="none" text-anchor="middle"><text aria-label="Title text 'Every source sits above the share expected by chance, by the widest margin for LR_b20'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(395 19)"><tspan>Every source sits above the share expected by chance, by</tspan><tspan x="0" dy="20">the widest margin for LR_b20</tspan></text><text aria-label="Subtitle text 'Blue dot: share observed, with the 95% interval from resampling whole months. Grey bar: 2.5% to 97.5% range of 200 shifts of every alarm by whole weeks (3 to 100 weeks either way); tick: mean of the shifts. A dot right of the grey bar is more logged closures than chance gives.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(395 55)"><tspan>Blue dot: share observed, with the 95% interval from resampling whole months. Grey bar: 2.5% to 97.5% range of 200</tspan><tspan x="0" dy="13">shifts of every alarm by whole weeks (3 to 100 weeks either way); tick: mean of the shifts. A dot right of the grey</tspan><tspan x="0" dy="13">bar is more logged closures than chance gives.</tspan></text></g></g></svg>

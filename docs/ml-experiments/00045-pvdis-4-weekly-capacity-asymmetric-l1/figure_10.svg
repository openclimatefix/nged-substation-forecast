ext><path d="M561 118h202v11H561Z" aria-hidden="true" class="background"/><path fill="#b701ff" d="M572 124a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(577 127)">symmetric</text><path d="M774 118h190v11H774Z" aria-hidden="true" class="background"/><path fill="#10c5f7" d="M785 124a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(790 127)">free weekly</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'A transfer or a seasonal load leaves the least error in the season-year constant and the most in the free weekly fit'" aria-roledescription="title" class="mark-text role-title-text" font-size="14" transform="translate(5.4 16)"><tspan>A transfer or a seasonal load leaves the least error in the season-year</tspan><tspan x="0" dy="16">constant and the most in the free weekly fit</tspan></text><text aria-label="Subtitle text 'Semi-synthetic baseline, scoring units, median over the 8 Primaries. Transfers: the path error when load is moved between Primaries for a period, inside the masked closure window or outside it. Seasonal loads: the seasonal swing that the error of the path acquires when a seasonal load (independent of the weather, or rising with sunshine) is added; a swing of 0 means the path stays clear of the seasonal load.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.4 47)"><tspan>Semi-synthetic baseline, scoring units, median over the 8 Primaries. Transfers: the path</tspan><tspan x="0" dy="13">error when load is moved between Primaries for a period, inside the masked closure window or</tspan><tspan x="0" dy="13">outside it. Seasonal loads: the seasonal swing that the error of the path acquires when a</tspan><tspan x="0" dy="13">seasonal load (independent of the weather, or rising with sunshine) is added; a swing of 0</tspan><tspan x="0" dy="13">means the path stays clear of the seasonal load.</tspan></text></g></g></svg>

ole-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'The symmetric, free, and post hoc fits show a 26-week fall; the frozen pair and the season-year constant show none'" aria-roledescription="title" class="mark-text role-title-text" font-size="14" transform="translate(5.5 16)"><tspan>The symmetric, free, and post hoc fits show a 26-week fall; the frozen pair</tspan><tspan x="0" dy="16">and the season-year constant show none</tspan></text><text aria-label="Subtitle text 'Share of a temporary fall's depth that the weekly capacity path shows during the fall (0 means the path ignores the fall; 1 means it follows it fully; more than 1 means it overshoots). Dot: median over the 8 Primaries on the scoring units. Line: from the dot to the worst Primary. Dashed line: 0.5, the plan's limit for a 26-week fall.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.5 47)"><tspan>Share of a temporary fall&apos;s depth that the weekly capacity path shows during the fall (0</tspan><tspan x="0" dy="13">means the path ignores the fall; 1 means it follows it fully; more than 1 means it</tspan><tspan x="0" dy="13">overshoots). Dot: median over the 8 Primaries on the scoring units. Line: from the dot to</tspan><tspan x="0" dy="13">the worst Primary. Dashed line: 0.5, the plan&apos;s limit for a 26-week fall.</tspan></text></g></g></svg>

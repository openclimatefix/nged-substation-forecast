e-title-text" font-size="14" transform="translate(6 16)"><tspan>On the real series the first estimate of the newest week is typically 0% to</tspan><tspan x="0" dy="16">10% above its final value; on injected paths its error is 3.6 times the final</tspan><tspan x="0" dy="16">error</tspan></text><text aria-label="Subtitle text 'Top: median over the 8 Primaries on the scoring units, from vintages every 4 weeks over the last 3 years. Bottom: at each origin Monday the fit uses only earlier data; the dot is the median, over origins, of that fit's value for the week just ended divided by the final fit's value for the same week.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 63)"><tspan>Top: median over the 8 Primaries on the scoring units, from vintages every 4 weeks over the</tspan><tspan x="0" dy="13">last 3 years. Bottom: at each origin Monday the fit uses only earlier data; the dot is the</tspan><tspan x="0" dy="13">median, over origins, of that fit&apos;s value for the week just ended divided by the final fit&apos;s</tspan><tspan x="0" dy="13">value for the same week.</tspan></text></g></g></svg>

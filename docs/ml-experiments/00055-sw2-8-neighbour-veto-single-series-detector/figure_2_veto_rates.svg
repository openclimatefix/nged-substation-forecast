-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'The veto removes unexplained alarms only a little more often'" aria-roledescription="title" class="mark-text role-title-text" font-size="14" transform="translate(6 16)">The veto removes unexplained alarms only a little more often</text><text aria-label="Subtitle text 'Share of the real alarms at the matched threshold that the veto removes. A useful veto would remove unexplained alarms at least twice as often as alarms that a logged closure explains.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 31)"><tspan>Share of the real alarms at the matched threshold that the veto removes. A</tspan><tspan x="0" dy="13">useful veto would remove unexplained alarms at least twice as often as alarms</tspan><tspan x="0" dy="13">that a logged closure explains.</tspan></text></g></g></svg>

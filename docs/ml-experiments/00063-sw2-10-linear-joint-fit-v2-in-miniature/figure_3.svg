btitle" font-size="11" transform="translate(6 47)"><tspan>S1: output of a real solar farm added to a substation&apos;s power at 10%, 25%, and 50% of the</tspan><tspan x="0" dy="13">substation&apos;s capacity, and the joint fit&apos;s recovered capacity as a share of the injected</tspan><tspan x="0" dy="13">capacity. Blue dot: median over 6 substations and 3 injection sizes. Blue line: 10th to 90th</tspan><tspan x="0" dy="13">percentile. Orange diamond (post hoc): slope of the farm&apos;s anomaly on the CAMS anomaly.</tspan><tspan x="0" dy="13">Solid rule: exact recovery. Grey band: the pre-registered 0.85 to 1.15. Positive control</tspan><tspan x="0" dy="13">(post hoc): the fit&apos;s own regressor shape injected in place of a farm, which must be</tspan><tspan x="0" dy="13">recovered exactly.</tspan></text></g></g></svg>

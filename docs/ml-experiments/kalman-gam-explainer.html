         ["Step = gain x surprise. Surprise = the reading minus what the filter expected.", "The gain says how much of the surprise the filter takes on."]);
  const mb = [140, 195, 1400, 130];
  const m = panelFrame(mb, [0,168], [-2,20], {yticks:[0,10,20], xticks:weekTicks(), zero:true, ylabel:"error"});
  for (let k = 0; k <= i; k++) el("circle", {cx:m.sx(G.h[k]), cy:m.sy(G.res[k]), r:2.6, fill:C.purple, opacity:0.55});
  path(G.h.slice(0,i+1).map((h,k)=>[m.sx(h), m.sy(G.lvl[k]+G.anom[k])]), {stroke:C.greenDark, "stroke-width":6, opacity:0.9});
  path(G.h.slice(0,i+1).map((h,k)=>[m.sx(h), m.sy(G.lvl[k]+G.anom[k])]), {stroke:C.green, "stroke-width":3.5});
  el("line", {x1:m.sx(G.h[i]), x2:m.sx(G.h[i]), y1:mb[1], y2:mb[1]+mb[3], stroke:C.ink, "stroke-width":2.5, "stroke-dasharray":"6 5"});
  const win = 24, k0 = Math.max(0, i-win+1);
  const zb = [140, 440, 1400, 195];
  const hz0 = G.h[k0] - 0.25, hz1 = G.h[k0] + (win-1)*0.5 + 0.75;
  const ticks = [];
  for (let h = Math.ceil(hz0/2)*2; h <= hz1; h += 2) ticks.push({v:h, label: hhmm(h%24)});
  const z = panelFrame(zb, [hz0, hz1], [-2,20], {yticks:[0,5,10,15,20], xticks:ticks, zero:true, ylabel:"error, points"});
  const pts = [];
  for (let k = k0; k <= i; k++) {
    const x = z.sx(G.h[k]), est = G.lvl[k]+G.anom[k];
    pts.push([x, z.sy(est)]);
    el("line", {x1:x, x2:x, y1:z.sy(G.prior[k]), y2:z.sy(G.res[k]), stroke:C.axis, "stroke-width":2, "stroke-dasharray":"4 4"});
    el("circle", {cx:x, cy:z.sy(G.prior[k]), r:6, fill:"#fff", stroke:C.ink, "stroke-width":2.5});
    el("circle", {cx:x, cy:z.sy(G.res[k]), r:k===i?10:6.5, fill:C.purple});
    el("line", {x1:x, x2:x, y1:z.sy(G.prior[k]), y2:z.sy(est), stroke:C.greenDark, "stroke-width":5});
  }
  path(pts, {stroke:C.green, "stroke-width":5});
  pts.forEach(p => el("circle", {cx:p[0], cy:p[1], r:5.5, fill:C.green, stroke:C.greenDark, "stroke-width":2}));
  legendItem(100, 421, C.purple, "Reading (measured minus GAM)", {dot:true});
  el("circle", {cx:640, cy:413, r:7, fill:"#fff", stroke:C.ink, "stroke-width":2.5}); T(658, 421, "Expected by the filter", {size:26});
  legendItem(970, 421, C.green, "Filter's new estimate of the error", {w:6});
  const bx = [
    ["Expected", f1(G.prior[i]) + " pts"],
    ["Reading", f1(G.res[i]) + " pts"],
    ["Surprise", (G.innov[i]>=0?"+":"") + f1(G.innov[i]) + " pts"],
    ["Gain: slow level | fast part", Math.round(G.gl[i]*100) + "% | " + Math.round(G.gz[i]*100) + "%"],
    ["New estimate = level + fast part", f1(G.lvl[i]+G.anom[i]) + " = " + f1(G.lvl[i]) + (G.anom[i]<0?" - ":" + ") + f1(Math.abs(G.anom[i]))],
  ];
  const widths = [190, 190, 220, 320, 450], gap = 18;
  let x = 60;
  bx.forEach((b, k) => {
    el("rect", {x:x, y:700, width:widths[k], height:88, rx:12, fill:"#F3F5FA", stroke:k===4?C.green:C.line, "stroke-width":k===4?4:1.5});
    T(x+14, 728, b[0], {size:21, fill:C.mute});
    T(x+14, 770, b[1], {size:32, weight:700});
    x += widths[k] + gap;
  });
  const day = Math.floor((G.h[i]-1e-6)/24);
  T(1540, 692, "Reading " + (i+1) + " of " + N + " (" + DAYS[day] + ", half-hour ending " + hhmm(G.h[i]%24) + " UTC). Updates the " + BAND_NAMES[G.band[i]] + " filter.", {size:21, fill:C.mute, anchor:"end"});
  lines(60, 813, ["4 filters run side by side, one per part of the day. Each tracks a slow level and a fast part that halves every " + f1(halfLifeH) + " hours."], {size:22, weight:600});
  footer();
}

/* ---------------- shared: forecast panel at an issue time ---------------- */
function runAt(v) { return Math.min(R.length-1, Math.floor(v*R.length - 1e-9)); }
function issueStrip(sel) {
  R.forEach((r, k) => {
    const day = Math.floor(r.origin_h/24);
    const x = 60 + k*208, w = 198;
    const g = el("g", {style:"cursor:pointer"});
    el("rect", {x:x, y:168, width:w, height:42, rx:21, fill:k===sel?C.blue:"#fff", stroke:k===sel?C.blue:C.axis, "stroke-width":2.5}, g);
    T(x+w/2, 197, DAYS[day] + " " + hhmm(r.origin_h%24), {size:22, weight:k===sel?700:500, fill:k===sel?"#fff":C.ink, anchor:"middle", parent:g});
    g.addEventListener("click", () => { setScene(scene, (k+0.5)/R.length); });
  });
  T(1540, 197, "Issue time (UTC)", {size:22, fill:C.mute, anchor:"end"});
}
const leadTicks = [0,24,48,72,96,120,144,168].map(h=>({v:h, label:h?("+"+h/24+" d"):"issue"}));
function avgBetween(r, arr, a, b) { const xs = []; r.lead.forEach((l,k)=>{ if (l>=a && l<=b) xs.push(arr[k]); }); return mean(xs); }
let yAll = null;
function yRange() {
  if (yAll) return yAll;
  let lo = 1e9, hi = -1e9;
  R.forEach(r => [r.gam, r.corr, r.actual, r.q05, r.q95].forEach(a => a.forEach(x => { lo = Math.min(lo,x); hi = Math.max(hi,x); })));
  yAll = [Math.floor(lo/10)*10, Math.ceil(hi/10)*10];
  return yAll;
}

/* ---------------- Scene 4: forecast at an issue time ---------------- */
function scene4(v) {
  const s = runAt(v), r = R[s];
  header("Added to the GAM, the estimate's fast part fades and its level stays",
         ["Each of the 4 filters is held from its newest reading that ended 3.5 hours (assumed delay) or more before issue.", "The slow level then stays; the fast part decays from that reading. Steps in the level are the 4 filters taking turns."]);
  issueStrip(s);
  const yd = yRange();
  legendItem(60, 250, C.orange, "Measured demand (unknown at issue time)", {w:4});
  legendItem(660, 250, C.blue, "GAM forecast");
  legendItem(930, 250, C.green, "Corrected: GAM + filter's estimate");
  const b1 = [140, 265, 1400, 320];
  const p = panelFrame(b1, [0,168], yd, {yticks:[60,70,80,90,100,110].filter(t=>t>=yd[0]&&t<=yd[1]), xticks:leadTicks, ylabel:"% of capacity"});
  const xs = r.lead;
  path(xs.map((l,k)=>[p.sx(l), p.sy(r.actual[k])]), {stroke:C.orange, "stroke-width":4, opacity:0.75});
  path(xs.map((l,k)=>[p.sx(l), p.sy(r.gam[k])]), {stroke:C.blue, "stroke-width":5});
  path(xs.map((l,k)=>[p.sx(l), p.sy(r.corr[k])]), {stroke:C.greenDark, "stroke-width":8});
  path(xs.map((l,k)=>[p.sx(l), p.sy(r.corr[k])]), {stroke:C.green, "stroke-width":4.5});
  const b2 = [140, 660, 1400, 90];
  const c = panelFrame(b2, [0,168], [-3,12], {yticks:[0,5,10], xticks:leadTicks.map(t=>({v:t.v})), zero:true, ylabel:"pts"});
  path(xs.map((l,k)=>[c.sx(l), c.sy(r.lvl[k])]), {stroke:C.sky, "stroke-width":5});
  path(xs.map((l,k)=>[c.sx(l), c.sy(r.anom[k])]), {stroke:C.purple, "stroke-width":5});
  path(xs.map((l,k)=>[c.sx(l), c.sy(r.lvl[k]+r.anom[k])]), {stroke:C.green, "stroke-width":3, "stroke-dasharray":"10 6"});
  legendItem(160, 653, C.sky, "slow level", {w:5}); legendItem(430, 653, C.purple, "fast part (fades)", {w:5}); legendItem(780, 653, C.green, "total added to the GAM", {w:3, dash:"10 6"});
  const f = (arr,a,b)=>f1(avgBetween(r, arr, a, b));
  const eg = mean(r.actual.map((a,k)=>Math.abs(a-r.gam[k]))), ek = mean(r.actual.map((a,k)=>Math.abs(a-r.corr[k])));
  note(["Fast part added (mean): day 1 " + f(r.anom,15.5,39) + ", day 3 " + f(r.anom,63.5,87) + ", day 7 " + f(r.anom,135.5,159) + " pts.   Slow level: " + f(r.lvl,15.5,39) + ", " + f(r.lvl,63.5,87) + ", " + f(r.lvl,135.5,159) + " pts.",
        "Mean absolute error over the 7 days: GAM " + f1(eg) + " pts, corrected " + f1(ek) + " pts.   Fast part fades by " + phi.toFixed(3) + " per half-hour (half-life " + f1(halfLifeH) + " h)."]);
  footer();
}

/* ---------------- Scene 5: the bands ---------------- */
function scene5(v) {
  const s = runAt(v), r = R[s];
  header("The forecast band comes from past errors, not filter variance",
         ["The band is a table of how far corrected forecasts missed, by time of day, season, and lead time.", "The filter's own uncertainty plays no part in it, and neither does the weather ensemble's spread (experiment 169)."]);
  issueStrip(s);
  const yd = yRange();
  legendItem(60, 250, C.green, "Corrected forecast");
  legendItem(380, 250, C.orange, "Measured demand", {dot:true});
  el("rect", {x:700, y:231, width:30, height:22, fill:C.sky, opacity:0.55}); T(740, 250, "50% band", {size:26});
  el("rect", {x:930, y:231, width:30, height:22, fill:C.sky, opacity:0.3}); T(970, 250, "90% band (5% to 95%)", {size:26});
  const b1 = [140, 265, 1400, 320];
  const p = panelFrame(b1, [0,168], yd, {yticks:[60,70,80,90,100,110].filter(t=>t>=yd[0]&&t<=yd[1]), xticks:leadTicks, ylabel:"% of capacity"});
  const xs = r.lead;
  const band = (lo, hi, op) => {
    const top = xs.map((l,k)=>[p.sx(l), p.sy(r[hi][k])]);
    const bot = xs.map((l,k)=>[p.sx(l), p.sy(r[lo][k])]).reverse();
    el("path", {d:"M"+top.concat(bot).map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join("L")+"Z", fill:C.sky, opacity:op});
  };
  band("q05", "q95", 0.28); band("q25", "q75", 0.42);
  path(xs.map((l,k)=>[p.sx(l), p.sy(r.corr[k])]), {stroke:C.greenDark, "stroke-width":7});
  path(xs.map((l,k)=>[p.sx(l), p.sy(r.corr[k])]), {stroke:C.green, "stroke-width":4});
  xs.forEach((l,k)=> el("circle", {cx:p.sx(l), cy:p.sy(r.actual[k]), r:3.2, fill:C.orange}));
  const inside = xs.filter((l,k)=> r.actual[k] >= r.q05[k] && r.actual[k] <= r.q95[k]).length;
  const hw = xs.map((l,k)=>(r.q95[k]-r.q05[k])/2);
  const hmax = Math.ceil(Math.max(...hw)/2)*2 + 2;
  const b2 = [140, 660, 1400, 90];
  const c = panelFrame(b2, [0,168], [0,hmax], {yticks:[0,hmax/2,hmax], xticks:leadTicks.map(t=>({v:t.v})), ylabel:"points"});
  path(xs.map((l,k)=>[c.sx(l), c.sy(hw[k])]), {stroke:C.sky, "stroke-width":5});
  let sd = null;
  for (let k = 0; k < N; k++) if (Math.abs(G.h[k] - (r.origin_h - 3.5)) < 0.01) { sd = G.sd[k]; break; }
  if (sd === null) sd = mean(G.sd);
  el("line", {x1:c.sx(0), x2:c.sx(168), y1:c.sy(sd), y2:c.sy(sd), stroke:C.purple, "stroke-width":4, "stroke-dasharray":"10 6"});
  legendItem(160, 653, C.sky, "half-width of the 90% band", {w:5}); legendItem(600, 653, C.purple, "filter's own uncertainty at its newest reading (1 sd; grows with lead)", {w:4, dash:"10 6"});
  note(["Band half-width: " + f1(avgBetween(r, hw, 15.5, 39)) + " pts at day 1 and " + f1(avgBetween(r, hw, 135.5, 159)) + " pts at day 7. The filter's own uncertainty about its estimate, at its newest reading, is " + f2(sd) + " pts.",
        "Measured demand fell inside the 90% band in " + inside + " of " + xs.length + " half-hours (the nominal share is 90%)."]);
  footer();
}

/* ---------------- Scene 6: what the filter does not fix ---------------- */
function scene6(v) {
  header("The filter leaves a time-of-day pattern; stage 2 removes most of it",
         ["Each filter holds one level for its whole part of the day (4 parts), so it cannot follow errors that differ hour by hour.", "Stage 2 learns that pattern: a winter night offset, then recipe R (adds back 0.75 times the time-of-day shape of day-ahead errors on days T-2 to T-15)."]);
  const b = [140, 200, 1000, 470];
  const P = D.profile;
  const all = P.flatMap(p => [p.mean_a2m, p.mean_b, p.mean_d]);
  const lo = Math.floor(Math.min(...all)-0.5), hi = Math.ceil(Math.max(...all)+0.5);
  const yt = []; for (let t = lo; t <= hi; t++) yt.push(t);
  const xticks = [0,6,12,18,24].map(h=>({v:h, label:String(h)}));
  const sx0 = lin(0,24,b[0],b[0]+b[2]);
  [[0,6,"night"],[6,11,"morning"],[11,16,"midday"],[16,24,"evening"]].forEach(([a,c,n],k) => {
    el("rect", {x:sx0(a), y:b[1], width:sx0(c)-sx0(a), height:b[3], fill:k%2?"#EEF1F8":"#F8F9FC"});
    T((sx0(a)+sx0(c))/2, b[1]+30, n + " filter", {size:23, fill:C.mute, anchor:"middle"});
  });
  const f = panelFrame(b, [0,24], [lo,hi], {yticks:yt, xticks:xticks, zero:true, ylabel:"mean error, points"});
  T(b[0]+b[2]/2, b[1]+b[3]+66, "Hour of day (half-hour ending; local time, the same as UTC in winter)", {size:24, fill:C.mute, anchor:"middle"});
  const series = [["mean_a2m", C.purple, "After the filter"], ["mean_b", C.sky, "+ winter night offset"], ["mean_d", C.green, "+ recipe R (stage 2)"]];
  series.forEach(([key, col], k) => {
    const frac = Math.max(0, Math.min(1, v*3.2 - k*0.9));
    if (frac <= 0) return;
    const pts = P.map(p => [f.sx(p.hh/2), f.sy(p[key])]);
    const n = Math.max(2, Math.round(pts.length*frac));
    if (key === "mean_d") path(pts.slice(0,n), {stroke:C.greenDark, "stroke-width":8});
    path(pts.slice(0,n), {stroke:col, "stroke-width":key==="mean_d"?4.5:5});
  });
  series.forEach(([key, col, name], k) => legendItem(1210, 250+k*44, col, name, {w:6}));
  const rms = D.profile_rms, mae = D.profile_mae;
  lines(1210, 420, ["Size of the pattern", "(root mean square of the", "half-hourly mean error):"], {size:24, fill:C.mute, lh:30});
  lines(1210, 520, [f2(rms.a2m) + " pts after the filter", f2(rms.b) + " pts with the offset", f2(rms.d) + " pts with recipe R"], {size:27, weight:700, lh:38});
  lines(1210, 650, ["Primary demand research default 3", "stacks more on top of these", "parts: a small neural-network", "head and a solar summary", "(not shown here)."], {size:22, fill:C.mute, lh:28});
  note(["Mean absolute error barely moves (" + f2(mae.a2m) + ", " + f2(mae.b) + ", " + f2(mae.d) + " pts): most error is scatter from one day to the next, not a pattern.",
        "Winter (Nov to Mar) day-ahead forecasts (leads 15.5 to 39 hours), scored year, D11, outside logged load-switching events, " + D.profile_rows + " half-hours. Error = measured minus forecast."]);
  footer();
}

/* ---------------- controller ---------------- */
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];
const NAMES = ["GAM alone","The error","Filter state","Forecast","Bands","Not fixed"];
const DURATION = [9, 9, 28, 12, 12, 10];
let scene = 0, vNow = 1, playing = false, last = 0, hold = 0;
const scrub = document.getElementById("scrub"), playBtn = document.getElementById("play");
const tabs = document.getElementById("tabs");
NAMES.forEach((n,k) => { const b = document.createElement("button"); b.textContent = String(k+1); b.title = n; b.addEventListener("click", ()=>setScene(k,1)); tabs.appendChild(b); });

function draw() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  el("rect", {x:0, y:0, width:1600, height:900, fill:"#FFFFFF"});
  SCENES[scene](vNow);
  [...tabs.children].forEach((b,k)=>b.classList.toggle("on", k===scene));
  scrub.value = Math.round(vNow*1000);
  document.getElementById("sceneLabel").textContent = (scene+1) + "/6  " + NAMES[scene];
}
function setScene(k, v) { scene = k; vNow = v; hold = 0; draw(); }
function step(dt) {
  if (hold > 0) { hold -= dt; return; }
  vNow += dt/DURATION[scene];
  if (vNow >= 1) {
    vNow = 1;
    if (scene < SCENES.length-1) { draw(); hold = 1.6; scene++; vNow = 0.0001; }
    else { playing = false; playBtn.textContent = "Replay"; }
  }
}
function tick(ts) {
  if (!playing) return;
  const dt = Math.min(0.1, (ts-last)/1000); last = ts;
  step(dt);
  draw();
  requestAnimationFrame(tick);
}
function play() {
  if (playBtn.textContent === "Replay") { scene = 0; vNow = 0.0001; }
  else if (vNow >= 1 && scene === SCENES.length-1) { scene = 0; vNow = 0.0001; }
  playing = true; playBtn.textContent = "Pause"; last = performance.now(); requestAnimationFrame(tick);
}
function pause() { playing = false; playBtn.textContent = "Play"; }
playBtn.addEventListener("click", () => playing ? pause() : play());
document.getElementById("prev").addEventListener("click", () => setScene((scene+5)%6, 1));
document.getElementById("next").addEventListener("click", () => setScene((scene+1)%6, 1));
scrub.addEventListener("input", () => { vNow = Math.max(0.0001, scrub.value/1000); hold = 0; draw(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowRight") setScene((scene+1)%6, 1);
  else if (e.key === "ArrowLeft") setScene((scene+5)%6, 1);
});
function fit() { const w = document.getElementById("deck").clientWidth; document.getElementById("deck").style.setProperty("--u", (w/1600)+"px"); }
window.addEventListener("resize", fit); fit();
const q = new URLSearchParams(location.search);
if (q.has("scene")) { scene = +q.get("scene") - 1; if (q.has("v")) vNow = +q.get("v"); }
draw();
if (q.has("autoplay")) { vNow = 0.0001; scene = 0; play(); if (q.has("advance")) { for (let t = 0; t < +q.get("advance"); t += 0.016) step(0.016); draw(); } }
</script>

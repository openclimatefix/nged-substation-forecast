a-roledescription="bar"/></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Known-answer gate: an injected solar farm moves the midday drift, not the night'" aria-roledescription="title" class="mark-text role-title-text" font-size="14" transform="translate(6 16)">Known-answer gate: an injected solar farm moves the midday drift, not the night</text><text aria-label="Subtitle text 'A synthetic farm of 30% of the substation's pinned capacity is switched on at 1 July 2023 and subtracted from the real power. With the capacity pinned, the drift absorbs it in the hours when the farm produces (morning, midday, evening) and leaves the night band alone.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 31)"><tspan>A synthetic farm of 30% of the substation&apos;s pinned capacity is switched on at 1 July 2023 and</tspan><tspan x="0" dy="13">subtracted from the real power. With the capacity pinned, the drift absorbs it in the hours</tspan><tspan x="0" dy="13">when the farm produces (morning, midday, evening) and leaves the night band alone.</tspan></text></g></g></svg>

rm="translate(450.5 275.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means ENS</tspan><tspan x="0" dy="13">better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 2 values: ECMWF ENS (T+3 band) − ERA5, ECMWF ENS (T+3 band) − CAMS" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 188)">ECMWF ENS (T+3 band) − ERA5</text><text transform="translate(219.5 228)">ECMWF ENS (T+3 band) − CAMS</text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_layer_0_marks"><path stroke="#292b2b" d="M343 165v80" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(347 159)">no difference</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_layer_2_marks"><text fill="#292b2b" aria-label="x: −1.38" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 159)">← ENS better</text></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_layer_3_marks" clip-path="url(#a)" transform="translate(225 165)"><path d="M25.6 20H60m309.4 40h55"/></g><g fill="#306bff" aria-hidden="true" class="mark-symbol role-mark concat_0_layer_4_marks" clip-path="url(#b)" transform="translate(225 165)"><path d="M47.2 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m354.4 40a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'The two planned contrasts'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 143)">The two planned contrasts</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 18: ENS beats ERA5 but trails CAMS by more than three points'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)">Figure 18: ENS beats ERA5 but trails CAMS by more than three points</text><text aria-label="Subtitle text 'Both contrasts were fixed before the first model was fitted, after ERA5 and CAMS had been scored on the page's main rows. ENS also differs from ERA5 and CAMS in lead, the 3-hourly steps of its open-data subset, native resolution, spatial support, and model version. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, April 2024 to September 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 38)"><tspan>Both contrasts were fixed before the first model was fitted, after ERA5 and CAMS had been scored on the page&apos;s main</tspan><tspan x="0" dy="13">rows.</tspan><tspan x="0" dy="13">ENS also differs from ERA5 and CAMS in lead, the 3-hourly steps of its open-data subset, native resolution, spatial</tspan><tspan x="0" dy="13">support, and model version.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, April 2024 to September 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v80H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v80H0z"/></clipPath></defs></svg>

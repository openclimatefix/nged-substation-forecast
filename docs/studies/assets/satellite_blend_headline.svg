the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Rows against plain CAMS (split) are the planned comparisons. Rows against CAMS (split + neighbouring hours) are</tspan><tspan x="0" dy="13">post hoc, added after the first science review.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a seed.</tspan><tspan x="0" dy="13">Capacity is each generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, January 2021 to August 2026.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v210H0z"/></clipPath></defs></svg>

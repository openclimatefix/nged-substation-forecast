orm="translate(46 517)"/><g fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10"><text transform="translate(46 543)">0.0</text><text text-anchor="middle" transform="translate(86 543)">0.2</text><text text-anchor="middle" transform="translate(126 543)">0.4</text><text text-anchor="middle" transform="translate(166 543)">0.6</text><text text-anchor="middle" transform="translate(206 543)">0.8</text><text text-anchor="end" transform="translate(246 543)">1.0</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(46 510)">Fitted weight</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 9: Fitting INDDEM on the PNs summed by GSP group does not place most GSP groups in one zone'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 9: Fitting INDDEM on the PNs summed by GSP group does not place</tspan><tspan x="0" dy="20">most GSP groups in one zone</tspan></text><text aria-label="Subtitle text 'Non-negative least-squares weight of each GSP group's summed import PNs in each zone's INDDEM. A GSP group wholly inside a zone would have a weight near 1 there and near 0 elsewhere. Fitted on the half-hours where the sampled PNs reproduce INDDEM's national total. Weights of 0.3 or more are printed. `none` holds the BMUs with no GSP group in Elexon's register.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Non-negative least-squares weight of each GSP group&apos;s summed import PNs in each zone&apos;s INDDEM. A GSP group wholly</tspan><tspan x="0" dy="13">inside a zone would have a weight near 1 there and near 0 elsewhere. Fitted on the half-hours where the sampled PNs</tspan><tspan x="0" dy="13">reproduce INDDEM&apos;s national total. Weights of 0.3 or more are printed. `none` holds the BMUs with no GSP group in</tspan><tspan x="0" dy="13">Elexon&apos;s register.</tspan></text></g></g><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".1" stop-color="#fff6f2"/><stop offset=".1" stop-color="#ffede6"/><stop offset=".1" stop-color="#ffe4d9"/><stop offset=".2" stop-color="#ffdbcc"/><stop offset=".3" stop-color="#ffd2c0"/><stop offset=".3" stop-color="#ffc8b3"/><stop offset=".3" stop-color="#ffbfa6"/><stop offset=".4" stop-color="#ffb699"/><stop offset=".5" stop-color="#ffad8d"/><stop offset=".5" stop-color="#ffa480"/><stop offset=".6" stop-color="#ff9b73"/><stop offset=".6" stop-color="#ff9267"/><stop offset=".7" stop-color="#ff895a"/><stop offset=".7" stop-color="#ff804d"/><stop offset=".8" stop-color="#ff7741"/><stop offset=".8" stop-color="#ff6d34"/><stop offset=".8" stop-color="#ff6427"/><stop offset=".9" stop-color="#ff5b1a"/><stop offset=".9" stop-color="#ff520e"/><stop offset="1" stop-color="#ff4901"/></linearGradient></defs></svg>

oboto Mono, monospace" font-size="10"><text transform="translate(228.5 1433.5)">−6</text><text text-anchor="middle" transform="translate(297.7 1433.5)">−5</text><text text-anchor="middle" transform="translate(367 1433.5)">−4</text><text text-anchor="middle" transform="translate(436.2 1433.5)">−3</text><text text-anchor="middle" transform="translate(505.4 1433.5)">−2</text><text text-anchor="middle" transform="translate(574.7 1433.5)">−1</text><text text-anchor="middle" transform="translate(643.9 1433.5)">0</text></g><path stroke="#292b2b" d="M228.5 1418.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(453.5 1448.5)"><tspan>Change from production for one series (percentage points of that series&apos;</tspan><tspan x="0" dy="13">capacity) (smaller is better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 2 values: Demand 13 (2,722 half-hours removed), Demand 16 (2,025 half-hours removed)" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(222.5 1333)">Demand 13 (2,722 half-hours removed)</text><text transform="translate(222.5 1388)">Demand 16 (2,025 half-hours removed)</text></g></g><g aria-hidden="true" class="mark-symbol role-mark concat_2_concat_1_layer_0_marks" clip-path="url(#e)" transform="translate(228 1297)"><path fill="#306bff" d="M34.6 22a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m126.7 55a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M22 44a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m118.7 55a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_2_concat_1_layer_1_marks"><path stroke="#292b2b" stroke-dasharray="4,3" d="M643.4 1297v121" aria-label="x: 0" aria-roledescription="rule mark" opacity=".7"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_2_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(647.4 1291)">same as production</text></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Change for each of the 2 series whose forecast changed (29 other series are exactly unchanged)'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(228 1237)"><tspan>Change for each of the 2 series whose forecast changed (29 other series are exactly</tspan><tspan x="0" dy="16">unchanged)</tspan></text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 5: Dropping each new meter's first 6 weeks lowers CRPS by 0.3 points of capacity, and only 2 series change'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 5: Dropping each new meter&apos;s first 6 weeks lowers CRPS by 0.3</tspan><tspan x="0" dy="20">points of capacity, and only 2 series change</tspan></text><text aria-label="Subtitle text 'Each dot is the paired difference between a cleaning rule and production, which uses the minimal cleaning already in the stored power table, over 31 series and 53 weekly ECMWF ensemble (ENS) forecast runs, scored from July 2025 to June 2026; seed 0. Rules change only the training data. Zero means no change. Each line is the 95% interval from resampling whole months. Dropping the first 6 months of each series was also tried but removes a whole series, so it was not scored. The chosen rule, drop new-meter settling, removes the 6 weeks after a demand meter first reads live. It was written after seeing the results of the other rules. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory or, where marked, post hoc.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each dot is the paired difference between a cleaning rule and production, which uses the minimal cleaning already</tspan><tspan x="0" dy="13">in the stored power table, over 31 series and 53 weekly ECMWF ensemble (ENS) forecast runs, scored from July 2025</tspan><tspan x="0" dy="13">to June 2026; seed 0. Rules change only the training data. Zero means no change.</tspan><tspan x="0" dy="13">Each line is the 95% interval from resampling whole months. Dropping the first 6 months of each series was also</tspan><tspan x="0" dy="13">tried but removes a whole series, so it was not scored.</tspan><tspan x="0" dy="13">The chosen rule, drop new-meter settling, removes the 6 weeks after a demand meter first reads live. It was written</tspan><tspan x="0" dy="13">after seeing the results of the other rules.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory or, where marked, post hoc.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v400H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v400H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v400H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v400H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v121H0z"/></clipPath></defs></svg>

ter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 21: The nearest weather station trails ERA5's 10 m wind by 0.99 points, and adding it to UKV lowers UKV's error by 0.64 points against a control with as many columns'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 21: The nearest weather station trails ERA5&apos;s 10 m wind by 0.99</tspan><tspan x="0" dy="20">points, and adding it to UKV lowers UKV&apos;s error by 0.64 points against a</tspan><tspan x="0" dy="20">control with as many columns</tspan></text><text aria-label="Subtitle text 'Top: each XGBoost model's own mean absolute error (% of capacity; smaller is better) on the same 34,156 farm-hours in 17 calendar months, best first. Brackets: wind columns given to the model. Below: first-named arm's error minus the second's. S1 and S2 were named in this section's plan before any station arm was fitted, after the five gridded products had been scored. Each planned pair carries the same number of wind columns. S1 compares one 10 m weather station with ERA5's 10 m wind. S2 compares UKV plus the station with UKV plus three of its own extra columns. Dot: estimate. Line: 95% interval from resampling whole calendar months and a fitting seed. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, August 2024 to December 2025: 34,156 farm-hours in 17 calendar months. Three farms are few independent sites. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Top: each XGBoost model&apos;s own mean absolute error (% of capacity; smaller is better) on the same 34,156 farm-hours</tspan><tspan x="0" dy="13">in 17 calendar months, best first. Brackets: wind columns given to the model. Below: first-named arm&apos;s error minus</tspan><tspan x="0" dy="13">the second&apos;s.</tspan><tspan x="0" dy="13">S1 and S2 were named in this section&apos;s plan before any station arm was fitted, after the five gridded products had</tspan><tspan x="0" dy="13">been scored. Each planned pair carries the same number of wind columns. S1 compares one 10 m weather station with</tspan><tspan x="0" dy="13">ERA5&apos;s 10 m wind. S2 compares UKV plus the station with UKV plus three of its own extra columns.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole calendar months and a fitting seed. Capacity is each</tspan><tspan x="0" dy="13">generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, August 2024 to December 2025: 34,156 farm-hours in 17 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v330H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v330H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v310H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v310H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v310H0z"/></clipPath></defs></svg>

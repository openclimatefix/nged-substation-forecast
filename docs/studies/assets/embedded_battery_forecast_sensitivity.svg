le" font-size="11" transform="translate(5.8 58)"><tspan>Contrasts as in Figure 1. One lead party runs 14 of the 35 batteries, so the lead-party resampling is the check</tspan><tspan x="0" dy="13">closest to the question of other batteries.</tspan><tspan x="0" dy="13">The three post hoc rows were decided after the first science review saw the results.</tspan></text></g></g></svg>

pling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, April 2024 to September 2026. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>ERA5 and CAMS averaged over ENS&apos;s seven 3-hour steps and rebuilt to hourly values</tspan><tspan x="0" dy="13">by the code that rebuilds ENS&apos;s own hours; ERA5 also averaged over 3 by 3 cells.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, April 2024 to September 2026.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v240H0z"/></clipPath></defs></svg>

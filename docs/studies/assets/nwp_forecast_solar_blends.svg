l="#292b2b" aria-label="Title text 'Paired differences: blend minus ENS alone, blend minus its own control'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 547)">Paired differences: blend minus ENS alone, blend minus its own control</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 9: For solar power a blend of ENS, ICON-EU, and IFS 0.25° gains 0.35 points at an optimistic lead, but its control is itself worse than ENS alone'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 9: For solar power a blend of ENS, ICON-EU, and IFS 0.25° gains</tspan><tspan x="0" dy="20">0.35 points at an optimistic lead, but its control is itself worse than</tspan><tspan x="0" dy="20">ENS alone</tspan></text><text aria-label="Subtitle text 'XGBoost models given the ENS mean alone, or ENS plus two more products. A control has the same columns as its blend, with the two other products' weather shuffled among hours of the same site, year-month and hour of day, so it carries no real information from them. Points of capacity; negative means the first forecast in a row is better. P4a uses the day-1 forecasts of ICON-EU and IFS 0.25°, P4b their day-2 forecasts. Every product is scored on exactly the same hours. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>XGBoost models given the ENS mean alone, or ENS plus two more products. A control has the same columns as its</tspan><tspan x="0" dy="13">blend, with the two other products&apos; weather shuffled among hours of the same site, year-month and hour of day, so</tspan><tspan x="0" dy="13">it carries no real information from them. Points of capacity; negative means the first forecast in a row is better.</tspan><tspan x="0" dy="13">P4a uses the day-1 forecasts of ICON-EU and IFS 0.25°, P4b their day-2 forecasts. Every product is scored on</tspan><tspan x="0" dy="13">exactly the same hours. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v220H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v220H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v310H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v310H0z"/></clipPath></defs></svg>

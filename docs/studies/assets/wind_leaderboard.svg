.772; Upper 95%: 8.653" aria-roledescription="point"/></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: UKV and ICON-D2 describe past wind best of the five products tested'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: UKV and ICON-D2 describe past wind best of the five products</tspan><tspan x="0" dy="20">tested</tspan></text><text aria-label="Subtitle text 'Each product's own mean absolute error, sorted best first. Figure 2 shows the paired contrasts, which test whether a gap is statistically significant: shared weather noise makes these intervals overlap more than a paired difference does. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, August 2024 to September 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each product&apos;s own mean absolute error, sorted best first. Figure 2 shows the paired contrasts, which test whether</tspan><tspan x="0" dy="13">a gap is statistically significant: shared weather noise makes these intervals overlap more than a paired</tspan><tspan x="0" dy="13">difference does.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Capacity is each generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, August 2024 to September 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v110H0z"/></clipPath></defs></svg>

a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_5_marks" clip-path="url(#c)" transform="translate(225 198)"><path d="m95.6 40 4.2-4.2L104 40l-4.2 4.2Zm-8.4 50 4.2-4.2 4.2 4.2-4.2 4.2Zm80.2 50 4.2-4.2 4.2 4.2-4.2 4.2Zm96.4 50 4.2-4.2 4.1 4.2-4.1 4.2Z"/></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 10: On January to September of each year, UKV's lead over ERA5 grew in 2026; ICON-EU's and ICON-D2's did not'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 10: On January to September of each year, UKV&apos;s lead over ERA5</tspan><tspan x="0" dy="20">grew in 2026; ICON-EU&apos;s and ICON-D2&apos;s did not</tspan></text><text aria-label="Subtitle text 'Each product's mean absolute error minus ERA5's, on January to September of one calendar year. August to December 2024, five months, is too short for an interval and is left out. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, August 2024 to September 2026. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each product&apos;s mean absolute error minus ERA5&apos;s, on January to September of one calendar year. August to December</tspan><tspan x="0" dy="13">2024, five months, is too short for an interval and is left out.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, August 2024 to September 2026.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v210H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v210H0z"/></clipPath></defs></svg>

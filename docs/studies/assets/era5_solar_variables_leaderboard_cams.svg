s-serif" font-size="14" pointer-events="none" transform="translate(5 919)">Correlation</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 7b: Error and correlation of every arm for CAMS clearness index'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)">Figure 7b: Error and correlation of every arm for CAMS clearness index</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. Dot: estimate at the main XGBoost tuning setting. Line: 95% interval. Each row is one variable set, scored on the same hours, so these intervals overlap more than the paired differences between rows would. Correlation: Pearson, of the prediction with the measured value. A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar radiation (ssrd), and air temperature (t2m). Each group adds to the one before. G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation. G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation. G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables. G10: G9 plus CAMS aerosol. Negative control: G2 plus shuffled copies of the other variables, which carry no information. Positive control: G2 plus CAMS irradiance, which is the answer. MARS-only: 12 ERA5 variables that neither ECMWF's free forecast feed nor Open-Meteo serves. Clearness index: irradiance divided by the irradiance at the top of the atmosphere. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 38)"><tspan>Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF&apos;s reanalysis of past weather. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate at the main XGBoost tuning setting. Line: 95% interval.</tspan><tspan x="0" dy="13">Each row is one variable set, scored on the same hours, so these intervals overlap</tspan><tspan x="0" dy="13">more than the paired differences between rows would.</tspan><tspan x="0" dy="13">Correlation: Pearson, of the prediction with the measured value.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar</tspan><tspan x="0" dy="13">radiation (ssrd), and air temperature (t2m). Each group adds to the one before.</tspan><tspan x="0" dy="13">G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation.</tspan><tspan x="0" dy="13">G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation.</tspan><tspan x="0" dy="13">G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables.</tspan><tspan x="0" dy="13">G10: G9 plus CAMS aerosol.</tspan><tspan x="0" dy="13">Negative control: G2 plus shuffled copies of the other variables, which carry no information.</tspan><tspan x="0" dy="13">Positive control: G2 plus CAMS irradiance, which is the answer.</tspan><tspan x="0" dy="13">MARS-only: 12 ERA5 variables that neither ECMWF&apos;s free forecast feed nor Open-Meteo serves.</tspan><tspan x="0" dy="13">Clearness index: irradiance divided by the irradiance at the top of the atmosphere.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

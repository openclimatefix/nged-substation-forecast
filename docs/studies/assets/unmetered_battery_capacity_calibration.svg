oledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="18" pointer-events="none" transform="translate(12 424.5)">Coverage of the credible intervals (planned contrast C2)</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 11: The 90% interval for a simulated merchant battery holds the truth from a 5% share; a domestic fleet's does not'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19.7)"><tspan>Figure 11: The 90% interval for a simulated merchant battery holds the</tspan><tspan x="0" dy="20">truth from a 5% share; a domestic fleet&apos;s does not</tspan></text><text aria-label="Subtitle text '756 rung 1 sums (9 series, 4 blocks, 3 durations) and 252 rung 2 sums. Dashed line: the nominal 90%; the 50% interval should sit at 0.5. Below a 2% share the posterior is the prior, so the coverage and the error describe the prior, not the data.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58.7)"><tspan>756 rung 1 sums (9 series, 4 blocks, 3 durations) and 252 rung 2 sums. Dashed line: the nominal 90%; the 50%</tspan><tspan x="0" dy="13">interval should sit at 0.5.</tspan><tspan x="0" dy="13">Below a 2% share the posterior is the prior, so the coverage and the error describe the prior, not the data.</tspan></text></g></g></svg>

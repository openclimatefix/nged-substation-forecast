#g)" transform="translate(225 694)"><path d="M160.7 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M217 60a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0M94.2 100a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m79.5 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'P3 at each farm: ECMWF HRES − ERA5'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 686)">P3 at each farm: ECMWF HRES − ERA5</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 7b: ECMWF rows - The three planned contrasts pooled over the three farms and at each farm'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 7b: ECMWF rows - The three planned contrasts pooled over the</tspan><tspan x="0" dy="20">three farms and at each farm</tspan></text><text aria-label="Subtitle text 'Each planned contrast pooled over the three farms, which is the planned row, and at each farm. The per-farm rows were not planned, so they are exploratory. HRES − ERA5 differs between farms by -0.49 points [-0.69, -0.26] for W2 minus W1, -0.32 [-0.63, +0.02] for W2 minus W3, and -0.17 [-0.54, +0.22] for W3 minus W1 (exploratory). Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three farms are few independent sites. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each planned contrast pooled over the three farms, which is the planned row, and at each farm. The per-farm rows</tspan><tspan x="0" dy="13">were not planned, so they are exploratory.</tspan><tspan x="0" dy="13">HRES − ERA5 differs between farms by -0.49 points [-0.69, -0.26] for W2 minus W1, -0.32 [-0.63, +0.02] for W2 minus</tspan><tspan x="0" dy="13">W3, and -0.17 [-0.54, +0.22] for W3 minus W1 (exploratory).</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

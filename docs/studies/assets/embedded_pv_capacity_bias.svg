2" d="m358 270 56 8.8 84 13.1 140 22" aria-hidden="true" class="mark-line role-mark concat_0_child_layer_1_marks"/></g><path stroke="#292b2b" stroke-dasharray="2,2" d="M638 270H358m280 0H358m280 0H358m280 0H358m280 0H358m280 0H358m280 0H358m280 0H358" aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_child_layer_2_marks"/></g></g><g aria-label="Symbol legend titled 'Estimate of capacity' for fill color and stroke color with 2 values: C (six-arm), Daily fit" aria-roledescription="legend" class="mark-group role-legend"><path d="M54 380h165v29H54Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M54 396.3h82v12.4H54Z" aria-hidden="true" class="background"/><path fill="#306bff" stroke="#306bff" stroke-width="1.5" d="M65 402.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(70 405.3)">C (six-arm)</text><path d="M148 396.3h70v12.4h-70Z" aria-hidden="true" class="background"/><path fill="#b701ff" stroke="#b701ff" stroke-width="1.5" d="M159 402.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(164 405.3)">Daily fit</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(54 389)">Estimate of capacity</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 6: An undetected demand load on dull days biases the daily-fit capacity about 2.6 times as much as the six-arm capacity C'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 6: An undetected demand load on dull days biases the daily-fit</tspan><tspan x="0" dy="20">capacity about 2.6 times as much as the six-arm capacity C</tspan></text><text aria-label="Subtitle text 'Relative error of each capacity estimate, (estimate over true capacity) minus 1, when a demand the test cannot see is added to injected solar output. No measurement noise. The six-arm capacity C comes from six fits of the same series; the daily fit is a seventh, made on whole days. The load is sized by the capacity the first of the six fits would report for it, as a share of the true capacity. Line: median over 218 cases, each using the load's arm vector measured on one solar farm's rows at one Primary substation in one season-year, added to the Primary substation's typical solar output. Band: 10th to 90th percentile. Positive means too high. For a load that rises with sunshine, C is biased low by more than the daily fit.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Relative error of each capacity estimate, (estimate over true capacity) minus 1, when a demand the test cannot see</tspan><tspan x="0" dy="13">is added to injected solar output. No measurement noise. The six-arm capacity C comes from six fits of the same</tspan><tspan x="0" dy="13">series; the daily fit is a seventh, made on whole days.</tspan><tspan x="0" dy="13">The load is sized by the capacity the first of the six fits would report for it, as a share of the true capacity.</tspan><tspan x="0" dy="13">Line: median over 218 cases, each using the load&apos;s arm vector measured on one solar farm&apos;s rows at one Primary</tspan><tspan x="0" dy="13">substation in one season-year, added to the Primary substation&apos;s typical solar output. Band: 10th to 90th</tspan><tspan x="0" dy="13">percentile. Positive means too high. For a load that rises with sunshine, C is biased low by more than the daily</tspan><tspan x="0" dy="13">fit.</tspan></text></g></g></svg>

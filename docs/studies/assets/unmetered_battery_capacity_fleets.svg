 power interval</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 14: A simulated domestic fleet is found only through its Agile homes, and not below a 20% share'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 14: A simulated domestic fleet is found only through its Agile</tspan><tspan x="0" dy="20">homes, and not below a 20% share</tspan></text><text aria-label="Subtitle text 'Exploratory, simulated: 36 sums per share (9 series, 4 blocks), fleets built home by home on the four tariffs. Dashed lines: 5% false alarms and the nominal 90%. Moving the windows alone leaves the detections, because the Agile unit follows a price; moving the prices as well brings flags to 1 of 36 at every share.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Exploratory, simulated: 36 sums per share (9 series, 4 blocks), fleets built home by home on the four tariffs.</tspan><tspan x="0" dy="13">Dashed lines: 5% false alarms and the nominal 90%.</tspan><tspan x="0" dy="13">Moving the windows alone leaves the detections, because the Agile unit follows a price; moving the prices as well</tspan><tspan x="0" dy="13">brings flags to 1 of 36 at every share.</tspan></text></g></g></svg>

,-4.183,0A4.183,4.183,0,1,1,4.183,0" fill="#FF4901" stroke-width="2" opacity="1"/><path transform="translate(352.7228626351077,39)" d="M4.183,0A4.183,4.183,0,1,1,-4.183,0A4.183,4.183,0,1,1,4.183,0" fill="#FF4901" stroke-width="2" opacity="1"/><path transform="translate(262.5201524286563,65)" d="M4.183,0A4.183,4.183,0,1,1,-4.183,0A4.183,4.183,0,1,1,4.183,0" fill="#FF4901" stroke-width="2" opacity="1"/><path transform="translate(287.8805107934604,91)" d="M4.183,0A4.183,4.183,0,1,1,-4.183,0A4.183,4.183,0,1,1,4.183,0" fill="#FF4901" stroke-width="2" opacity="1"/><path transform="translate(272.17549982254457,117)" d="M4.183,0A4.183,4.183,0,1,1,-4.183,0A4.183,4.183,0,1,1,4.183,0" fill="#FF4901" stroke-width="2" opacity="1"/><path transform="translate(162.6565856752605,143)" d="M4.183,0A4.183,4.183,0,1,1,-4.183,0A4.183,4.183,0,1,1,4.183,0" fill="#FF4901" stroke-width="2" opacity="1"/></g><g class="mark-group role-title"><g transform="translate(-226,-19)"><path class="background" aria-hidden="true" d="M0,0h0v0h0Z" pointer-events="none"/><g><g class="mark-text role-title-text" role="graphics-symbol" aria-roledescription="title" aria-label="Title text 'Lead days 1 to 3, pooled'" pointer-events="none"><text text-anchor="start" transform="translate(0,11)" font-family="Matter XH, DM Sans, sans-serif" font-size="14px" font-weight="normal" fill="#292B2B" opacity="1">Lead days 1 to 3, pooled</text></g></g><path class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g><g class="mark-group role-title"><g transform="translate(-226,-244)"><path class="background" aria-hidden="true" d="M0,0h0v0h0Z" pointer-events="none"/><g><g class="mark-text role-title-text" role="graphics-symbol" aria-roledescription="title" aria-label="Title text 'Figure 9: Change in error when one group of variables is removed from all 20 IFS variables'" pointer-events="none"><text text-anchor="start" transform="translate(0,14)" font-family="Matter XH, DM Sans, sans-serif" font-size="18px" font-weight="normal" fill="#292B2B" opacity="1"><tspan>Figure 9: Change in error when one group of variables is removed from</tspan><tspan x="0" dy="20">all 20 IFS variables</tspan></text></g><g class="mark-text role-title-subtitle" role="graphics-symbol" aria-roledescription="subtitle" aria-label="Subtitle text 'Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. CAMS: satellite irradiance service. Dot: estimate. Line: 95% interval from resampling whole months. Dashed rule: no difference. Each row is the error of F6 without the variables that one group adds, minus the error of F6. Error: mean absolute error. Positive means the group helped. A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar. F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow, precipitation, pressure, wind, gusts. IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day. Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" pointer-events="none"><text text-anchor="start" transform="translate(0,53)" font-family="Matter XH, DM Sans, sans-serif" font-size="11px" fill="#292B2B" opacity="1"><tspan>Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Dashed rule: no difference. Each row is the error</tspan><tspan x="0" dy="13">of F6 without the variables that one group adds, minus the error of F6. Error: mean absolute error. Positive means</tspan><tspan x="0" dy="13">the group helped.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar.</tspan><tspan x="0" dy="13">F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and</tspan><tspan x="0" dy="13">high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective</tspan><tspan x="0" dy="13">energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow,</tspan><tspan x="0" dy="13">precipitation, pressure, wind, gusts.</tspan><tspan x="0" dy="13">IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day.</tspan><tspan x="0" dy="13">Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g><path class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>
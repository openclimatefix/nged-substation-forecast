 The station rows also read the station's own air temperature. The top row is CAMS with the station's irradiance added. All six generators take the same nearest radiation station, 17 to 31 km away, so the station rows rest on one pyranometer. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to December 2025.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 38)"><tspan>Every input scored on the same 60,033 site-hours, each through its own XGBoost model.</tspan><tspan x="0" dy="13">The station rows also read the station&apos;s own air temperature. The top row is CAMS with the station&apos;s irradiance</tspan><tspan x="0" dy="13">added.</tspan><tspan x="0" dy="13">All six generators take the same nearest radiation station, 17 to 31 km away, so the station rows rest on one</tspan><tspan x="0" dy="13">pyranometer.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Capacity is each generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to December 2025.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v280H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v280H0z"/></clipPath></defs></svg>

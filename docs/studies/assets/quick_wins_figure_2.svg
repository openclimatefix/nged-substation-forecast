xisted. Every other row is exploratory or, where marked, post hoc.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each dot is the paired difference between an arm and production with cleaning in mean score, over 31 series and 53</tspan><tspan x="0" dy="13">weekly ECMWF ensemble (ENS) forecast runs, scored from July 2025 to June 2026; average of seeds 0, 1, 2. Zero means</tspan><tspan x="0" dy="13">no change.</tspan><tspan x="0" dy="13">Each line is the 95% interval from resampling whole months with the same months drawn for both arms. A line that</tspan><tspan x="0" dy="13">excludes zero is a reliable difference.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory or, where marked, post hoc.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v560H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v560H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v560H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v560H0z"/></clipPath></defs></svg>

34 593h135v27H34Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M34 609h52v11H34Z" aria-hidden="true" class="background"/><path stroke="#ff4901" stroke-width="1.5" d="M35 615h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(50 618)">Kirton</text><path d="M98 609h70v11H98Z" aria-hidden="true" class="background"/><path stroke="#306bff" stroke-width="1.5" d="M99 615h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(114 618)">Donington</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(34 602)">Primary</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 5: At Kirton the extra power drawn on overcast days at midday is larger in November and February than in summer; at Donington it is the same size'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 5: At Kirton the extra power drawn on overcast days at midday is</tspan><tspan x="0" dy="20">larger in November and February than in summer; at Donington it is the</tspan><tspan x="0" dy="20">same size</tspan></text><text aria-label="Subtitle text 'Mean power drawn on overcast days minus clear days, by half-hour (MW), at the Kirton and Donington Primary substations. A positive value means more power drawn on overcast days. Season-years 2020/21 to 2025/26 pooled, each weighted by its number of days. Winter holds only November and February days, because the sun stays below 15 degrees in December and January: at Kirton 30 clear and 33 overcast days, at Donington 26 and 31. Summer holds 342 and 51 at Kirton, 319 and 52 at Donington. Solar output is far lower in winter, so if solar alone caused the gap it would be smaller in winter. A larger winter gap may be cold weather instead, so it is a difference and not a proof.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Mean power drawn on overcast days minus clear days, by half-hour (MW), at the Kirton and Donington Primary</tspan><tspan x="0" dy="13">substations. A positive value means more power drawn on overcast days.</tspan><tspan x="0" dy="13">Season-years 2020/21 to 2025/26 pooled, each weighted by its number of days. Winter holds only November and</tspan><tspan x="0" dy="13">February days, because the sun stays below 15 degrees in December and January: at Kirton 30 clear and 33 overcast</tspan><tspan x="0" dy="13">days, at Donington 26 and 31. Summer holds 342 and 51 at Kirton, 319 and 52 at Donington. Solar output is far lower</tspan><tspan x="0" dy="13">in winter, so if solar alone caused the gap it would be smaller in winter. A larger winter gap may be cold weather</tspan><tspan x="0" dy="13">instead, so it is a difference and not a proof.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h625v150H0z"/></clipPath><clipPath id="b"><path d="M0 0h625v150H0z"/></clipPath><clipPath id="c"><path d="M0 0h625v150H0z"/></clipPath><clipPath id="d"><path d="M0 0h625v150H0z"/></clipPath></defs></svg>

 column, CAMS and the nearest station − CAMS" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 305)"><tspan>Nearest station − Nearest</tspan><tspan x="0" dy="12">station&apos;s irradiance with</tspan><tspan x="0" dy="12">ERA5&apos;s temperature</tspan></text><text transform="translate(219.5 345)"><tspan>CAMS and a shuffled station</tspan><tspan x="0" dy="12">column − CAMS</tspan></text><text transform="translate(219.5 385)"><tspan>ERA5 and a shuffled station</tspan><tspan x="0" dy="12">column − ERA5</tspan></text><text transform="translate(219.5 425)"><tspan>ERA5 and the nearest station −</tspan><tspan x="0" dy="12">ERA5 and a shuffled station</tspan><tspan x="0" dy="12">column</tspan></text><text transform="translate(219.5 465)"><tspan>CAMS and the nearest station −</tspan><tspan x="0" dy="12">CAMS</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_concat_1_layer_0_marks"><path stroke="#292b2b" d="M628.7 282v200" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="end" transform="translate(624.7 276)">no difference</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −2.973" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 276)">← first input better</text></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_concat_1_layer_3_marks" clip-path="url(#a)" transform="translate(225 282)"><path stroke="#b701ff" d="M398.8 20h6.4"/><path stroke="#ff4901" d="M403.2 60h3.4"/><path stroke="#10c5f7" d="M401.3 100h8"/><path stroke="#b701ff" d="M40.7 140h64.8m242.4 40h19.6"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_4_marks" clip-path="url(#b)" transform="translate(225 282)"><path fill="#b701ff" d="M406.2 20a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M409.1 60a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M409.5 100a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#b701ff" d="M77.6 140a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0M363 180a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Exploratory contrasts: controls, and what a station adds to a product'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 260)">Exploratory contrasts: controls, and what a station adds to a product</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 24: The real station column lowers ERA5's error by 2.432 points against a shuffled column, and CAMS's error by 0.331 points against plain CAMS; a shuffled station column, or the station's own temperature, moves no error by more than 0.041'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 24: The real station column lowers ERA5&apos;s error by 2.432 points</tspan><tspan x="0" dy="20">against a shuffled column, and CAMS&apos;s error by 0.331 points against</tspan><tspan x="0" dy="20">plain CAMS; a shuffled station column, or the station&apos;s own temperature,</tspan><tspan x="0" dy="20">moves no error by more than 0.041</tspan></text><text aria-label="Subtitle text 'The first row swaps the station's air temperature for ERA5's; the next two pad a product with a shuffled station column, one more column than the plain product; the last two add the real station column, and the last row's two arms differ by one column. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to December 2025. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>The first row swaps the station&apos;s air temperature for ERA5&apos;s; the next two pad a product with a shuffled station</tspan><tspan x="0" dy="13">column, one more column than the plain product; the last two add the real station column, and the last row&apos;s two</tspan><tspan x="0" dy="13">arms differ by one column.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to December 2025.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v200H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v200H0z"/></clipPath></defs></svg>

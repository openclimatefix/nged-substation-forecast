sform="translate(221.04581499025173,124)" d="M3.873,0A3.873,3.873,0,1,1,-3.873,0A3.873,3.873,0,1,1,3.873,0" stroke="#B701FF" stroke-width="1.5" opacity="0.7"/></g><g class="mark-group role-title"><g transform="translate(-174.02734375,-19)"><path class="background" aria-hidden="true" d="M0,0h0v0h0Z" pointer-events="none"/><g><g class="mark-text role-title-text" role="graphics-symbol" aria-roledescription="title" aria-label="Title text 'Lead days 1 to 3 pooled, main XGBoost tuning setting'" pointer-events="none"><text text-anchor="start" transform="translate(0,11)" font-family="Matter XH, DM Sans, sans-serif" font-size="14px" font-weight="normal" fill="#292B2B" opacity="1">Lead days 1 to 3 pooled, main XGBoost tuning setting</text></g></g><path class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g><g class="mark-group role-title"><g transform="translate(-174.02734375,-322)"><path class="background" aria-hidden="true" d="M0,0h0v0h0Z" pointer-events="none"/><g><g class="mark-text role-title-text" role="graphics-symbol" aria-roledescription="title" aria-label="Title text 'Figure 1: Change in solar farm error from adding IFS variables: the five planned contrasts'" pointer-events="none"><text text-anchor="start" transform="translate(0,14)" font-family="Matter XH, DM Sans, sans-serif" font-size="18px" font-weight="normal" fill="#292B2B" opacity="1"><tspan>Figure 1: Change in solar farm error from adding IFS variables: the five</tspan><tspan x="0" dy="20">planned contrasts</tspan></text></g><g class="mark-text role-title-subtitle" role="graphics-symbol" aria-roledescription="subtitle" aria-label="Subtitle text 'Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. CAMS: satellite irradiance service. Dot: estimate. Thin line: 95% interval from resampling whole months. Thick line: 99% interval, adjusted for the five planned contrasts. Hollow point: the estimate at the second XGBoost tuning setting. Dashed rules: no difference, and the smallest improvement worth acting on (0.1 points of capacity). Each row is the error with the first variable set minus the error with the second. The bracket is the verdict from both settings and the negative control: gain, no gain, or unresolved. Error: mean absolute error, pooled over the farm-hours that lead days 1, 2, and 3 all hold. P4 and P5 use only the months that AIFS Single also covers. A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar. F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow, precipitation, pressure, wind, gusts. IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day. FB: F0 plus AIFS Single (ECMWF's machine-learned forecast) radiation and temperature. F6B: F6 plus the same two. Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before. Planned: written into the study plan before any result existed. Lead days 1 to 3 are pooled.'" pointer-events="none"><text text-anchor="start" transform="translate(0,53)" font-family="Matter XH, DM Sans, sans-serif" font-size="11px" fill="#292B2B" opacity="1"><tspan>Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate. Thin line: 95% interval from resampling whole months. Thick line: 99% interval, adjusted for the</tspan><tspan x="0" dy="13">five planned contrasts.</tspan><tspan x="0" dy="13">Hollow point: the estimate at the second XGBoost tuning setting.</tspan><tspan x="0" dy="13">Dashed rules: no difference, and the smallest improvement worth acting on (0.1 points of capacity).</tspan><tspan x="0" dy="13">Each row is the error with the first variable set minus the error with the second. The bracket is the verdict from</tspan><tspan x="0" dy="13">both settings and the negative control: gain, no gain, or unresolved.</tspan><tspan x="0" dy="13">Error: mean absolute error, pooled over the farm-hours that lead days 1, 2, and 3 all hold. P4 and P5 use only the</tspan><tspan x="0" dy="13">months that AIFS Single also covers.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar.</tspan><tspan x="0" dy="13">F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and</tspan><tspan x="0" dy="13">high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective</tspan><tspan x="0" dy="13">energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow,</tspan><tspan x="0" dy="13">precipitation, pressure, wind, gusts.</tspan><tspan x="0" dy="13">IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day.</tspan><tspan x="0" dy="13">FB: F0 plus AIFS Single (ECMWF's machine-learned forecast) radiation and temperature. F6B: F6 plus the same two.</tspan><tspan x="0" dy="13">Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before.</tspan><tspan x="0" dy="13">Planned: written into the study plan before any result existed. Lead days 1 to 3 are pooled.</tspan></text></g></g><path class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>
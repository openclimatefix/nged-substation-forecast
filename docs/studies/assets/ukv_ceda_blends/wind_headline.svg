ings. Dot: primary setting. Hollow triangle: sensitivity setting. Line: 95% interval from resampling whole months and a fitting seed, at the primary setting. The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. UKV-CEDA's lead is 3 hours fresher than ENS's at every hour, which favours the blend. All rows are planned: written into the study plan before any result existed.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity.</tspan><tspan x="0" dy="13">Negative means the blend forecasts better. The blend lowers the error only if its interval and both shuffled-</tspan><tspan x="0" dy="13">control intervals are below zero at both settings. Dot: primary setting. Hollow triangle: sensitivity setting.</tspan><tspan x="0" dy="13">Line: 95% interval from resampling whole months and a fitting seed, at the primary setting.</tspan><tspan x="0" dy="13">The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output. UKV-CEDA&apos;s lead is 3 hours fresher than</tspan><tspan x="0" dy="13">ENS&apos;s at every hour, which favours the blend.</tspan><tspan x="0" dy="13">All rows are planned: written into the study plan before any result existed.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="k"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="l"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="n"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="o"><path d="M0 0h450v120H0z"/></clipPath></defs></svg>

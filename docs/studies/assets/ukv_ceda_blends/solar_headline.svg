600.5 918.5)">0.1</text><text text-anchor="end" transform="translate(675.5 918.5)">0.2</text></g><path stroke="#292b2b" d="M225.5 903.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(450.5 933.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">blend better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 3 values: Blend minus padded ENS, Blend minus shuffled UKV-CEDA, Blend minus shuffled UKV-CEDA, second seed" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 806)">Blend minus padded ENS</text><text transform="translate(219.5 846)">Blend minus shuffled UKV-CEDA</text><text transform="translate(219.5 886)"><tspan>Blend minus shuffled UKV-CEDA,</tspan><tspan x="0" dy="12">second seed</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_3_layer_0_marks"><path stroke="#292b2b" d="M525 783v120" aria-label="x: 0" aria-roledescription="rule mark"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_3_layer_1_marks" clip-path="url(#l)" transform="translate(225 783)"><path d="M171 20h168.7M224.3 60h171.6m-263.1 40h228.7"/></g><g fill="#306bff" aria-hidden="true" class="mark-symbol role-mark concat_3_layer_2_marks" clip-path="url(#n)" transform="translate(225 783)"><path d="M263.7 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M317 60a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0m-58.5 40a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_3_layer_4_marks" clip-path="url(#o)" transform="translate(225 783)"><path d="m273 16.4-4.2 7.2h8.4Zm17.2 40-4.1 7.2h8.3Zm-50.2 40-4.2 7.2h8.4Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Lead day 4'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 775)">Lead day 4</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: For the six solar farms, adding UKV-CEDA to the ENS mean is compared with ENS alone and with shuffled UKV-CEDA at lead days 1 to 4'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: For the six solar farms, adding UKV-CEDA to the ENS mean is</tspan><tspan x="0" dy="20">compared with ENS alone and with shuffled UKV-CEDA at lead days 1 to 4</tspan></text><text aria-label="Subtitle text 'Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity. Negative means the blend forecasts better. The blend lowers the error only if its interval and both shuffled- control intervals are below zero at both settings. Dot: primary setting. Hollow triangle: sensitivity setting. Line: 95% interval from resampling whole months and a fitting seed, at the primary setting. The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. UKV-CEDA's lead is 3 hours fresher than ENS's at every hour, which favours the blend. All rows are planned: written into the study plan before any result existed.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity.</tspan><tspan x="0" dy="13">Negative means the blend forecasts better. The blend lowers the error only if its interval and both shuffled-</tspan><tspan x="0" dy="13">control intervals are below zero at both settings. Dot: primary setting. Hollow triangle: sensitivity setting.</tspan><tspan x="0" dy="13">Line: 95% interval from resampling whole months and a fitting seed, at the primary setting.</tspan><tspan x="0" dy="13">The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output. UKV-CEDA&apos;s lead is 3 hours fresher than</tspan><tspan x="0" dy="13">ENS&apos;s at every hour, which favours the blend.</tspan><tspan x="0" dy="13">All rows are planned: written into the study plan before any result existed.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="k"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="l"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="n"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="o"><path d="M0 0h450v120H0z"/></clipPath></defs></svg>

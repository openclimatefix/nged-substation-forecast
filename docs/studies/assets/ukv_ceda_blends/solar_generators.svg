ithin one generator, so it does not cover differences between generators. All rows are exploratory. The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. UKV-CEDA's lead is 3 hours fresher than ENS's at every hour, which favours the blend. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Difference in mean absolute error between the blend and ENS&apos;s mean padded to the blend&apos;s column count, blend minus</tspan><tspan x="0" dy="13">padded ENS, in points of capacity, at each generator alone and the primary setting. Negative means the blend</tspan><tspan x="0" dy="13">forecasts better. The 95% interval resamples whole months and a fitting seed within one generator, so it does not</tspan><tspan x="0" dy="13">cover differences between generators. All rows are exploratory.</tspan><tspan x="0" dy="13">The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output. UKV-CEDA&apos;s lead is 3 hours fresher than</tspan><tspan x="0" dy="13">ENS&apos;s at every hour, which favours the blend.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v240H0z"/></clipPath></defs></svg>

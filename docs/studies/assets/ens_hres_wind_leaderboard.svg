83.5)">0.6</text></g><path stroke="#292b2b" d="M225.5 868.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(450.5 898.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">first-named product better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 2 values: ECMWF ENS day-0 mean − ECMWF HRES, ECMWF ENS day-0 mean − ERA5" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 811)"><tspan>ECMWF ENS day-0 mean − ECMWF</tspan><tspan x="0" dy="12">HRES</tspan></text><text transform="translate(219.5 851)">ECMWF ENS day-0 mean − ERA5</text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_2_layer_0_marks"><path stroke="#292b2b" d="M412.5 788v80" aria-label="x: 0" aria-roledescription="rule mark"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_2_layer_1_marks" clip-path="url(#e)" transform="translate(225 788)"><path d="M214.5 20h96.8M117 60h92.3"/></g><g fill="#306bff" aria-hidden="true" class="mark-symbol role-mark concat_2_layer_2_marks" clip-path="url(#f)" transform="translate(225 788)"><path d="M268.6 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M165.8 60a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Paired differences: two exploratory contrasts'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 780)">Paired differences: two exploratory contrasts</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 13: UKV beats ECMWF's HRES by 0.20 points and ENS day 0 by 0.41, and HRES beats ERA5 by 0.27'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 13: UKV beats ECMWF&apos;s HRES by 0.20 points and ENS day 0 by 0.41,</tspan><tspan x="0" dy="20">and HRES beats ERA5 by 0.27</tspan></text><text aria-label="Subtitle text 'Top: each product's own mean absolute error on the same 43,555 farm-hours in 22 calendar months, best first. Below: paired differences. Own intervals overlap more than paired ones, because every product's error rises and falls with the month. ECMWF HRES is Open-Meteo's freshest-run forecast from ECMWF's high-resolution model. ECMWF ENS day-0 mean is the mean of ECMWF's 51 ensemble members for the hours 00 to 23 UTC of the 00 UTC run's own day. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three farms are few independent sites. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Top: each product&apos;s own mean absolute error on the same 43,555 farm-hours in 22 calendar months, best first. Below:</tspan><tspan x="0" dy="13">paired differences.</tspan><tspan x="0" dy="13">Own intervals overlap more than paired ones, because every product&apos;s error rises and falls with the month.</tspan><tspan x="0" dy="13">ECMWF HRES is Open-Meteo&apos;s freshest-run forecast from ECMWF&apos;s high-resolution model. ECMWF ENS day-0 mean is the</tspan><tspan x="0" dy="13">mean of ECMWF&apos;s 51 ensemble members for the hours 00 to 23 UTC of the 00 UTC run&apos;s own day.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v238H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v238H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v80H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v80H0z"/></clipPath></defs></svg>

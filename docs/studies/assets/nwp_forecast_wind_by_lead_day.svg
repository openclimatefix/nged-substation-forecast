0.8 37.8v-88.7"/><path stroke="#009c75" d="M232.1 573.7v-71.4M353 529.2V455m120.8 26.3V394"/><path stroke="#bf4f04" d="M239.4 579.4v-72m120.8 44.7v-74.6M481 501.8v-81.4M246.6 564.8v-72.2M367.5 527v-84.7M488.3 468v-90.6"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_1_layer_5_marks"><path fill="#306bff" d="M78.6 577.3a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-31.8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-38.3a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M441 452.8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#10c5f7" d="M206.7 516.5a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0m120.9-46.6a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-39.3a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#fc9700" d="M214 524a3.5 3.5 0 1 1-7.2 0 3.5 3.5 0 1 1 7.1 0m120.8-48a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-56a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m-234.4 85.2a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0M342 454.8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-56.7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#17e58f" d="M228.4 528a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-43.1a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M470 435.6a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#009c75" d="M235.7 539.8a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0m120.9-47.1a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-54a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#bf4f04" d="M243 545.4a3.5 3.5 0 1 1-7.2 0 3.5 3.5 0 1 1 7.1 0m120.8-28.8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-54.4a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m-234.4 68a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0M371 486.4a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-63a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/></g><g aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10"><text fill="#306bff" transform="translate(500.3 482.5)">ENS mean</text><text fill="#10c5f7" transform="translate(500.3 426.3)">GEFS mean</text><text fill="#fc9700" transform="translate(500.3 388.8)">GFS (Open-Meteo)</text><text fill="#fc9700" transform="translate(500.3 370)">GFS (native)</text><text fill="#17e58f" transform="translate(500.3 445)">ICON global</text><text fill="#009c75" transform="translate(500.3 463.8)">ICON-EU</text><text fill="#bf4f04" transform="translate(500.3 501.3)">IFS 0.25°</text><text fill="#bf4f04" transform="translate(500.3 407.5)">IFS HRES 9 km</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12: Wind error rises with lead day for every forecast; IFS 0.25°, at a lead shorter than ENS's on most hours, cannot be told apart from the ENS mean at days 2 and 3'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 12: Wind error rises with lead day for every forecast; IFS 0.25°,</tspan><tspan x="0" dy="20">at a lead shorter than ENS&apos;s on most hours, cannot be told apart from</tspan><tspan x="0" dy="20">the ENS mean at days 2 and 3</tspan></text><text aria-label="Subtitle text 'Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity. The XGBoost model uses the primary setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean's day-0 and day-1 errors, the two ENS leads between which a Previous Runs product's day-1 lead falls. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn side by side, and each product's name is written beside its last point. The dashed lines are GFS (native) and IFS HRES 9 km. GFS (native) and IFS HRES 9 km each share a colour with a solid line, GFS (Open-Meteo) and IFS 0.25°. IFS HRES 9 km is IFS HRES (9 km, Open-Meteo): 00 UTC runs only, not checked against a native archive, and its day-3 values after lead 90 hours are interpolated from 3-hourly steps. Only the ENS mean's day 0 is drawn, as the lower of the two ENS references; every other product's day 0, and every product's days 5 to 14, appear only in Figure 2. Products fitted at fewer than three of days 0 to 3 are left out. Lead day: ENS, GFS (native), and IFS HRES 9 km read a 24-hour band of leads of the 00 UTC run that many days earlier; other products read the freshest run at least that many days old. Every product except IFS HRES 9 km is scored on exactly the same hours; IFS HRES 9 km is scored without the target days its archive lacks. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">The XGBoost model uses the primary setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s</tspan><tspan x="0" dy="13">day-0 and day-1 errors, the two ENS leads between which a Previous Runs product&apos;s day-1 lead falls.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and each product&apos;s name is written beside its last point. The dashed lines are GFS (native) and IFS</tspan><tspan x="0" dy="13">HRES 9 km. GFS (native) and IFS HRES 9 km each share a colour with a solid line, GFS (Open-Meteo) and IFS 0.25°.</tspan><tspan x="0" dy="13">IFS HRES 9 km is IFS HRES (9 km, Open-Meteo): 00 UTC runs only, not checked against a native archive, and its day-3</tspan><tspan x="0" dy="13">values after lead 90 hours are interpolated from 3-hourly steps. Only the ENS mean&apos;s day 0 is drawn, as the lower</tspan><tspan x="0" dy="13">of the two ENS references; every other product&apos;s day 0, and every product&apos;s days 5 to 14, appear only in Figure 2.</tspan><tspan x="0" dy="13">Products fitted at fewer than three of days 0 to 3 are left out.</tspan><tspan x="0" dy="13">Lead day: ENS, GFS (native), and IFS HRES 9 km read a 24-hour band of leads of the 00 UTC run that many days</tspan><tspan x="0" dy="13">earlier; other products read the freshest run at least that many days old. Every product except IFS HRES 9 km is</tspan><tspan x="0" dy="13">scored on exactly the same hours; IFS HRES 9 km is scored without the target days its archive lacks.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g></svg>

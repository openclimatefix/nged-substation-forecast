city.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s day-0 and day-1</tspan><tspan x="0" dy="13">errors; a whole-day product at day 1 lies between them when it is bracketed.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and the name of each is written beside its last point. Products with a day-1 forecast only are left</tspan><tspan x="0" dy="13">out; Figure 2 shows them. Every product is scored on exactly the same hours.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g></svg>

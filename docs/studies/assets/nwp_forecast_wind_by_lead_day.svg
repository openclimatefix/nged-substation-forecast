 3.5 0 1 1 7 0"/><path fill="#bf4f04" d="M233.8 407.4a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M354.7 378a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-55.7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/></g><g aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10"><text fill="#306bff" transform="translate(465.9 330.7)">ENS mean</text><text fill="#009c75" transform="translate(480.4 312)">ICON-EU</text><text fill="#10c5f7" transform="translate(469.5 274.5)">GEFS mean</text><text fill="#fc9700" transform="translate(473.1 255.7)">GFS</text><text fill="#17e58f" transform="translate(476.7 293.2)">ICON global</text><text fill="#bf4f04" transform="translate(484 349.5)">IFS 0.25°</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12: Wind error rises with lead day for every forecast, and no product beats the ENS mean at matched lead'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 12: Wind error rises with lead day for every forecast, and no</tspan><tspan x="0" dy="20">product beats the ENS mean at matched lead</tspan></text><text aria-label="Subtitle text 'Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity. Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean's day-0 and day-1 errors; a whole-day product at day 1 lies between them when it is bracketed. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn side by side, and the name of each is written beside its last point. Products with a day-1 forecast only are left out; Figure 2 shows them. Every product is scored on exactly the same hours. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s day-0 and day-1</tspan><tspan x="0" dy="13">errors; a whole-day product at day 1 lies between them when it is bracketed.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and the name of each is written beside its last point. Products with a day-1 forecast only are left</tspan><tspan x="0" dy="13">out; Figure 2 shows them. Every product is scored on exactly the same hours.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g></svg>

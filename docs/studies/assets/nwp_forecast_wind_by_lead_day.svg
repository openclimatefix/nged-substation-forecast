a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M470 340.7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#009c75" d="M235.7 451.2a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0m120.9-49.9a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M477.3 344a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#bf4f04" d="M243 457a3.5 3.5 0 1 1-7.2 0 3.5 3.5 0 1 1 7.1 0m120.8-30.4a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M484.6 369a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/></g><g aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10"><text fill="#306bff" transform="translate(493 376.5)">ENS mean</text><text fill="#10c5f7" transform="translate(493 320.3)">GEFS mean</text><text fill="#fc9700" transform="translate(493 301.5)">GFS</text><text fill="#17e58f" transform="translate(493 339)">ICON global</text><text fill="#009c75" transform="translate(493 357.8)">ICON-EU</text><text fill="#bf4f04" transform="translate(493 395.3)">IFS 0.25°</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12: Wind error rises with lead day for every forecast; IFS 0.25° has a lower error than the ENS mean at days 2 and 3, at a lead shorter than ENS's on most hours'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 12: Wind error rises with lead day for every forecast; IFS 0.25°</tspan><tspan x="0" dy="20">has a lower error than the ENS mean at days 2 and 3, at a lead shorter</tspan><tspan x="0" dy="20">than ENS&apos;s on most hours</tspan></text><text aria-label="Subtitle text 'Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity. The XGBoost model uses the primary setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean's day-0 and day-1 errors; the two ENS leads between which a Previous Runs product's day-1 lead falls. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn side by side, and each product's name is written beside its last point. ICON-EU's day 0 is not drawn here: it is Open-Meteo's freshest ICON-EU run, a lead of at most 3 hours, fitted later on a GPU. Products fitted at fewer than three of days 0 to 3, and days 5, 10, and 14, are left out; Figure 2 shows them. Every product is scored on exactly the same hours. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">The XGBoost model uses the primary setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s</tspan><tspan x="0" dy="13">day-0 and day-1 errors; the two ENS leads between which a Previous Runs product&apos;s day-1 lead falls.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and each product&apos;s name is written beside its last point. ICON-EU&apos;s day 0 is not drawn here: it is</tspan><tspan x="0" dy="13">Open-Meteo&apos;s freshest ICON-EU run, a lead of at most 3 hours, fitted later on a GPU. Products fitted at fewer than</tspan><tspan x="0" dy="13">three of days 0 to 3, and days 5, 10, and 14, are left out; Figure 2 shows them. Every product is scored on exactly</tspan><tspan x="0" dy="13">the same hours.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g></svg>

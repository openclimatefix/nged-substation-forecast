g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 7: At each of the six solar farms UKV and ICON-EU have a higher error than ENS at day 1'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 7: At each of the six solar farms UKV and ICON-EU have a higher</tspan><tspan x="0" dy="20">error than ENS at day 1</tspan></text><text aria-label="Subtitle text 'Difference in mean absolute error between two XGBoost models, first product minus second, in points of capacity, at each generator alone. Negative means the first product forecasts better. Primary XGBoost setting. The 95% interval resamples whole months and a fitting seed within one generator, so it does not cover differences between generators. All rows are exploratory. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity. Every product is scored on exactly the same hours.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Difference in mean absolute error between two XGBoost models, first product minus second, in points of capacity, at</tspan><tspan x="0" dy="13">each generator alone. Negative means the first product forecasts better. Primary XGBoost setting. The 95% interval</tspan><tspan x="0" dy="13">resamples whole months and a fitting seed within one generator, so it does not cover differences between</tspan><tspan x="0" dy="13">generators. All rows are exploratory.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity. Every product is scored on exactly the same hours.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0
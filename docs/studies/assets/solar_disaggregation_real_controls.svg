/tspan><tspan x="0" dy="13">changes in output, once with cloud and once with CAMS&apos;s clear-sky irradiance.</tspan><tspan x="0" dy="13">A calendar replica is the BMU&apos;s mean output by month, half-hour of the day, and day type: it has the BMU&apos;s daily</tspan><tspan x="0" dy="13">shape and no cloud. Non-solar controls are the 12 largest BMUs of each type.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h515v290H0z"/></clipPath></defs></svg>

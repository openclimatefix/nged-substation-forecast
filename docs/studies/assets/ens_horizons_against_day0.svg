itle text 'Figure 2: Forecast error rises with horizon, fastest over the first week'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)">Figure 2: Forecast error rises with horizon, fastest over the first week</text><text aria-label="Subtitle text 'Mean absolute error at each horizon minus the same way's error at day 0, on the same generator-hours. Planned: the ensemble mean at days 1 and 7; every other mark is exploratory. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, every daylight hour, April 2024 to September 2026. Three wind farms in Lincolnshire, every hour, August 2024 to September 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 38)"><tspan>Mean absolute error at each horizon minus the same way&apos;s error at day 0, on the same generator-hours. Planned: the</tspan><tspan x="0" dy="13">ensemble mean at days 1 and 7; every other mark is exploratory.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, every daylight hour, April 2024 to September 2026. Three wind farms in</tspan><tspan x="0" dy="13">Lincolnshire, every hour, August 2024 to September 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v360H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v360H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v360H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v360H0z"/></clipPath></defs></svg>

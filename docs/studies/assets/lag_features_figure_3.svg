.8 39.4 29.6 39.3-1.9 39.3 13.7 39.3 25 39.3 5.8 39.3 36 39.3 25 39.3 4.5" aria-hidden="true" class="mark-line role-mark concat_0_concat_0_layer_2_marks"/><path d="M46 124h629v260H46Z" aria-hidden="true" class="background"/><path stroke="#306bff" stroke-width="2" d="m65.7 364 39.3-7.6 39.3-20.7 39.3-15.7 39.3-8.3 39.3 2.4 39.3-19.5 39.3 28.8 39.4-38.2 39.3 4.8 39.3-22.4L498 249l39.3 15.5 39.3 55.9L616 357l39.3 7.3" aria-hidden="true" class="mark-line role-mark concat_0_concat_0_layer_2_marks"/><path d="M46 124h629v260H46Z" aria-hidden="true" class="background"/><path stroke="#306bff" stroke-width="2" d="m65.7 364 39.3-7.7 39.3-21.5 39.3-37.2 39.3-26.4 39.3-92.2 39.3 10.5 39.3 12.8 39.4 4.6 39.3-13.8 39.3 52.8 39.3 3.4 39.3 44.4 39.3 39.3 39.3 29.2 39.3 2.2" aria-hidden="true" class="mark-line role-mark concat_0_concat_0_layer_2_marks"/></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 3: How each lag column is read for one target day'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 3: How each lag column is read for one target day</text><text aria-label="Subtitle text 'One example target day at plant B, at the day-ahead lead (the forecast for the day after the day it is issued). Each line or band is read at the same clock hour as the target hour, on an earlier whole day before the forecast was issued. Power is a share of capacity. Black: the measured power on the target day. Orange: L1, the latest whole day before the forecast was issued (day 1 back). Blue: CTX7's other six daily lags (days 2 to 7 back). Green band: W7's minimum to maximum over days 1 to 7 back. Green dashed line: W7's mean over those days.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>One example target day at plant B, at the day-ahead lead (the forecast for the day after the day it is issued).</tspan><tspan x="0" dy="13">Each line or band is read at the same clock hour as the target hour, on an earlier whole day before the forecast</tspan><tspan x="0" dy="13">was issued. Power is a share of capacity.</tspan><tspan x="0" dy="13">Black: the measured power on the target day. Orange: L1, the latest whole day before the forecast was issued (day 1</tspan><tspan x="0" dy="13">back). Blue: CTX7&apos;s other six daily lags (days 2 to 7 back). Green band: W7&apos;s minimum to maximum over days 1 to 7</tspan><tspan x="0" dy="13">back. Green dashed line: W7&apos;s mean over those days.</tspan></text></g></g><g aria-label="Symbol legend titled 'Series' for stroke color with 3 values: Target: measured power, L1: day 1 back, CTX7: days 2 to 7 back" aria-roledescription="legend" class="mark-group role-legend"><path d="M46 434h421v27H46Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M46 450h148v11H46Z" aria-hidden="true" class="background"/><path stroke="#292b2b" stroke-width="1.5" d="M47 456h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(62 459)">Target: measured power</text><path d="M206 450h100v11H206Z" aria-hidden="true" class="background"/><path stroke="#ff4901" stroke-width="1.5" d="M207 456h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(222 459)">L1: day 1 back</text><path d="M318 450h148v11H318Z" aria-hidden="true" class="background"/><path stroke="#306bff" stroke-width="1.5" d="M319 456h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(334 459)">CTX7: days 2 to 7 back</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(46 443)">Series</text></g><g class="mark-group role-title"><text fill="#5c5c5c" aria-label="Title text 'The example is chosen by rule, not by eye: the plant-day with the most hours that hold all seven lags, then the most power. Arms. L1: B0 plus the power at the same hour on the latest whole day before the forecast was issued (two days before the target day for a day-ahead forecast). CTX7: seven separate daily lags and their weather forecasts. W7: the minimum, maximum, and mean of the same hour over the last 7 whole days.'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="10" pointer-events="none" transform="translate(6 483)"><tspan>The example is chosen by rule, not by eye: the plant-day with the most hours that hold all seven lags, then the most power.</tspan><tspan x="0" dy="13">Arms. L1: B0 plus the power at the same hour on the latest whole day before the forecast was issued (two days before the</tspan><tspan x="0" dy="13">target day for a day-ahead forecast). CTX7: seven separate daily lags and their weather forecasts. W7: the minimum, maximum,</tspan><tspan x="0" dy="13">and mean of the same hour over the last 7 whole days.</tspan></text></g></g></svg>

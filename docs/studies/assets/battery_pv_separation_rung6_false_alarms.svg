t model fits no solar with</tspan><tspan x="0" dy="20">rung 3&apos;s energy capacity or more, and under 2 MW with less</tspan></text><text aria-label="Subtitle text 'Each dot is one of the 16 aggregates of a battery alone (4 batteries by 4 solar sets, solar share 0%), so the true solar capacity is 0 MW. The dashed line is the detection threshold, 2% of the aggregate's 99th percentile (2 MW); a dot to its right is a false alarm. The horizontal axis is stretched near 0 so that small capacities are visible.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each dot is one of the 16 aggregates of a battery alone (4 batteries by 4 solar sets, solar share 0%), so the true</tspan><tspan x="0" dy="13">solar capacity is 0 MW. The dashed line is the detection threshold, 2% of the aggregate&apos;s 99th percentile (2 MW); a</tspan><tspan x="0" dy="13">dot to its right is a false alarm. The horizontal axis is stretched near 0 so that small capacities are visible.</tspan></text></g></g></svg>

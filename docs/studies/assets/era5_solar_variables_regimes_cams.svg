7.7 0"/><path fill="#17e58f" d="M323.6 567.8a3.9 3.9 0 1 1-7.7 0 3.9 3.9 0 1 1 7.7 0"/><path fill="#ff4901" d="M154.9 578a3.9 3.9 0 1 1-7.7 0 3.9 3.9 0 1 1 7.7 0"/><path fill="#10c5f7" d="M386.3 480a3.9 3.9 0 1 1-7.8 0 3.9 3.9 0 1 1 7.8 0"/><path fill="#17e58f" d="M332.4 490.3a3.9 3.9 0 1 1-7.8 0 3.9 3.9 0 1 1 7.8 0"/><path fill="#ff4901" d="M203.4 500.6a3.9 3.9 0 1 1-7.7 0 3.9 3.9 0 1 1 7.7 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'CAMS clearness index'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(6 459)">CAMS clearness index</text></g></g><g aria-label="Symbol legend for fill color and stroke color with 3 values: g1, g2, g9" aria-roledescription="legend" class="mark-group role-legend"><path d="M61 641h451v13H61Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M61 641.3h112v12.5H61Z" aria-hidden="true" class="background"/><path fill="#10c5f7" stroke="#10c5f7" stroke-width="1.5" d="M72 647.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(77 650.3)">total cloud (G1)</text><path d="M185 641.3h154v12.5H185Z" aria-hidden="true" class="background"/><path fill="#17e58f" stroke="#17e58f" stroke-width="1.5" d="M196 647.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(201 650.3)">three cloud layers (G2)</text><path d="M351 641.3h160v12.5H351Z" aria-hidden="true" class="background"/><path fill="#ff4901" stroke="#ff4901" stroke-width="1.5" d="M362 647.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(367 650.3)">every ERA5 variable (G9)</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 8b: Contrasts by sky regime, from the CAMS clear-sky index'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 8b: Contrasts by sky regime, from the CAMS clear-sky index</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. Dot: estimate. Line: 95% interval from resampling whole months. Dashed rule: no difference. Each row is one group of hours. Each colour is the error with a variable set minus the error with G0, the minimal set. Error: mean absolute error. A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar radiation (ssrd), and air temperature (t2m). Each group adds to the one before. G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation. G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation. G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables. G10: G9 plus CAMS aerosol. Clear is a CAMS clear-sky index of 0.8 or more, and overcast is below 0.4. The thresholds were fixed before any result. Clearness index: irradiance divided by the irradiance at the top of the atmosphere. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF&apos;s reanalysis of past weather. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Dashed rule: no difference. Each row is one group of hours. Each colour is the error</tspan><tspan x="0" dy="13">with a variable set minus the error with G0, the minimal set. Error: mean absolute</tspan><tspan x="0" dy="13">error.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar</tspan><tspan x="0" dy="13">radiation (ssrd), and air temperature (t2m). Each group adds to the one before.</tspan><tspan x="0" dy="13">G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation.</tspan><tspan x="0" dy="13">G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation.</tspan><tspan x="0" dy="13">G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables.</tspan><tspan x="0" dy="13">G10: G9 plus CAMS aerosol.</tspan><tspan x="0" dy="13">Clear is a CAMS clear-sky index of 0.8 or more, and overcast is below 0.4. The thresholds were fixed before any</tspan><tspan x="0" dy="13">result.</tspan><tspan x="0" dy="13">Clearness index: irradiance divided by the irradiance at the top of the atmosphere.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

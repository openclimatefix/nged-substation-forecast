 concat_2_marks"/></g><g aria-label="Symbol legend for stroke color and strokeWidth with 3 values: A neighbouring node, shorter, A neighbouring node, longer, Interpolated at the fitted duration" aria-roledescription="legend" class="mark-group role-legend"><path d="M52 615h226v37H52Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M52 615h225v10.5H52Z" aria-hidden="true" class="background"/><path stroke="#306bff" d="M52.5 620.5h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(67 623.5)">A neighbouring node, shorter</text><path d="M52 628h225v10.5H52Z" aria-hidden="true" class="background"/><path stroke="#10c5f7" d="M52.5 633.5h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(67 636.5)">A neighbouring node, longer</text><path d="M52 641h225v10.5H52Z" aria-hidden="true" class="background"/><path stroke="#ff4901" d="M52.5 646.5h10" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(67 649.5)">Interpolated at the fitted duration</text></g></g></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Read between neighbouring nodes at the fitted duration of 1.99 hours'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="18" pointer-events="none" transform="translate(6 467)">Read between neighbouring nodes at the fitted duration of 1.99 hours</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 3: The differentiable battery follows the price through precomputed dispatches and fits only a few numbers'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 3: The differentiable battery follows the price through</tspan><tspan x="0" dy="20">precomputed dispatches and fits only a few numbers</tspan></text><text aria-label="Subtitle text 'Two days from 6 October 2025 (UTC). Positive is export. Each node is the day-by-day linear programme for one usable duration and efficiency; the stack holds 3,800 nodes. The estimator fits the power, the duration, the efficiency, and a cap weight by gradient descent, reading the schedule between nodes, then passes it through a smooth state-of-charge limit.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Two days from 6 October 2025 (UTC). Positive is export. Each node is the day-by-day linear programme for one usable</tspan><tspan x="0" dy="13">duration and efficiency; the stack holds 3,800 nodes.</tspan><tspan x="0" dy="13">The estimator fits the power, the duration, the efficiency, and a cap weight by gradient descent, reading the</tspan><tspan x="0" dy="13">schedule between nodes, then passes it through a smooth state-of-charge limit.</tspan></text></g></g></svg>

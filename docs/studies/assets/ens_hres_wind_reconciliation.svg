024</text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_1_concat_1_layer_0_marks"><path stroke="#292b2b" d="M450 536v110" aria-label="x: 0" aria-roledescription="rule mark"/></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_1_concat_1_layer_1_marks" clip-path="url(#c)" transform="translate(225 536)"><path stroke="#306bff" d="M161.5 16.7h182.8"/><path stroke="#ff4901" d="M143.6 30h196.2"/><path stroke="#292b2b" d="M81.5 43.3h124.2"/><path stroke="#306bff" d="M119.3 66.7H292"/><path stroke="#ff4901" d="M103.5 80h183.1"/><path stroke="#292b2b" d="M60.3 93.3h139.9"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_1_concat_1_layer_2_marks" clip-path="url(#d)" transform="translate(225 536)"><path fill="#306bff" d="M254 16.7a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M244 30a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#292b2b" d="M141.9 43.3a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M204 66.7a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M190.5 80a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#292b2b" d="M125.2 93.3a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'ECMWF HRES − ERA5, refitted here'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 528)">ECMWF HRES − ERA5, refitted here</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 17: An extra era cut at IFS Cycle 49r1 changes ENS day 0's and HRES's scores against ERA5 far more than rotating the folds does'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 17: An extra era cut at IFS Cycle 49r1 changes ENS day 0&apos;s and</tspan><tspan x="0" dy="20">HRES&apos;s scores against ERA5 far more than rotating the folds does</tspan></text><text aria-label="Subtitle text 'ECMWF changed its forecast model, IFS Cycle 49r1, on 12 November 2024. The ENS horizons page's folds do not treat that date as a break; the extra cut does. All rows: 50,734 farm-hours in 26 calendar months from 12 August 2024. Rows from 1 December 2024: 43,555 in 22 months, the rows the rest of this section scores. Fold cells with no training row for a calendar month that occurs in two years: 6 under the horizons page's folds, 0 with those folds rotated, and 0 with the extra cut. The ENS horizons page published ENS day 0 − ERA5 as +0.170 points [+0.021, +0.322] on its own rows and folds. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire. Three farms are few independent sites. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>ECMWF changed its forecast model, IFS Cycle 49r1, on 12 November 2024. The ENS horizons page&apos;s folds do not treat</tspan><tspan x="0" dy="13">that date as a break; the extra cut does.</tspan><tspan x="0" dy="13">All rows: 50,734 farm-hours in 26 calendar months from 12 August 2024. Rows from 1 December 2024: 43,555 in 22</tspan><tspan x="0" dy="13">months, the rows the rest of this section scores.</tspan><tspan x="0" dy="13">Fold cells with no training row for a calendar month that occurs in two years: 6 under the horizons page&apos;s folds, 0</tspan><tspan x="0" dy="13">with those folds rotated, and 0 with the extra cut.</tspan><tspan x="0" dy="13">The ENS horizons page published ENS day 0 − ERA5 as +0.170 points [+0.021, +0.322] on its own rows and folds.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire. Three farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v110H0z"/></clipPath></defs></svg>

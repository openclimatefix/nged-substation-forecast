orm="translate(225 510)"><path stroke="#ff4901" d="M187.8 20h166"/><path stroke="#306bff" d="M102.3 40h125.6"/><path stroke="#ff4901" d="M149.3 70h157.1"/><path stroke="#306bff" d="M78.1 90h137"/></g><g fill="#ff4901" aria-hidden="true" class="mark-symbol role-mark concat_1_concat_1_layer_2_marks" clip-path="url(#e)" transform="translate(225 510)"><path d="M272.1 20a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m-45.4 50a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_1_concat_1_layer_3_marks" clip-path="url(#f)" transform="translate(225 510)"><path d="m155.8 40 4.2-4.2 4 4.2-4.1 4.2Zm-21.3 50 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'ECMWF HRES − ERA5, refitted here'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 502)">ECMWF HRES − ERA5, refitted here</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 17: How the folds treat IFS Cycle 49r1 decides whether ENS day 0 trails ERA5 and whether HRES beats ERA5'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 17: How the folds treat IFS Cycle 49r1 decides whether ENS day 0</tspan><tspan x="0" dy="20">trails ERA5 and whether HRES beats ERA5</tspan></text><text aria-label="Subtitle text 'ECMWF changed its forecast model, IFS Cycle 49r1, on 12 November 2024. The ENS horizons page's folds do not treat that date as a break; the extra cut does. All rows: 50,734 farm-hours in 26 calendar months from 12 August 2024. Rows from 1 December 2024: 43,555 in 22 months, the rows the rest of this section scores. The ENS horizons page published ENS day 0 − ERA5 as +0.170 points [+0.021, +0.322] on its own rows and folds. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire. Three farms are few independent sites. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>ECMWF changed its forecast model, IFS Cycle 49r1, on 12 November 2024. The ENS horizons page&apos;s folds do not treat</tspan><tspan x="0" dy="13">that date as a break; the extra cut does.</tspan><tspan x="0" dy="13">All rows: 50,734 farm-hours in 26 calendar months from 12 August 2024. Rows from 1 December 2024: 43,555 in 22</tspan><tspan x="0" dy="13">months, the rows the rest of this section scores.</tspan><tspan x="0" dy="13">The ENS horizons page published ENS day 0 − ERA5 as +0.170 points [+0.021, +0.322] on its own rows and folds.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire. Three farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v110H0z"/></clipPath></defs></svg>

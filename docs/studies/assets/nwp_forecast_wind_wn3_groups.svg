roke="#10c5f7" d="M267.8 1260v-74.4"/><path stroke="#ff4901" d="M276.5 1258.5v-59.3"/><path stroke="#306bff" d="M285.2 1253.5v-49.7"/><path stroke="#10c5f7" d="M412.8 1153.2v-123.1"/><path stroke="#ff4901" d="M421.5 1208.5v-44.3"/><path stroke="#306bff" d="M430.2 1186.3v-111.7"/><path stroke="#10c5f7" d="M557.8 1055.6V1023"/><path stroke="#ff4901" d="M566.5 1219.2v-54.6"/><path stroke="#306bff" d="M575.2 1172.5V1042"/></g><g stroke-width="1.5" aria-hidden="true" class="mark-symbol role-mark concat_3_layer_1_marks"><path stroke="#10c5f7" d="m119 1238.2 3.8-3.9 3.9 3.9-3.9 3.9Z"/><path stroke="#ff4901" d="m127.6 1262.5 3.9-3.9 3.9 3.9-3.9 3.9Z"/><path stroke="#306bff" d="m136.3 1250 3.9-4 3.9 4-3.9 3.8Z"/><path stroke="#10c5f7" d="m264 1214.5 3.8-3.8 3.9 3.8-3.9 4Z"/><path stroke="#ff4901" d="m272.6 1249.6 3.9-4 3.9 4-3.9 3.8Z"/><path stroke="#306bff" d="m281.3 1229.6 3.9-3.9 3.9 4-3.9 3.8Z"/><path stroke="#10c5f7" d="m409 1081 3.8-3.8 3.9 3.9-3.9 3.9Z"/><path stroke="#ff4901" d="m417.6 1198.3 3.9-3.8 3.9 3.8-3.9 3.9Z"/><path stroke="#306bff" d="m426.3 1131 3.9-3.8 3.9 3.9-3.9 3.9Z"/><path stroke="#10c5f7" d="m554 1037.4 3.8-3.9 3.9 4-3.9 3.8Z"/><path stroke="#ff4901" d="m562.6 1205.3 3.9-3.9 3.9 3.9-3.9 3.9Z"/><path stroke="#306bff" d="m571.3 1110.1 3.9-3.8 3.9 3.8-3.9 4Z"/></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 18: WeatherNext 3's error against ENS mean-vector reference for the three wind farms, in the months before July, from July, and pooled'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 18: WeatherNext 3&apos;s error against ENS mean-vector reference for</tspan><tspan x="0" dy="20">the three wind farms, in the months before July, from July, and pooled</tspan></text><text aria-label="Subtitle text 'Each mark is an XGBoost model's error, given one forecast product, in percent of capacity, or the difference between two such models in points of capacity. Top panel: WeatherNext 3's error minus the reference's, on the same rows. Lower panels: each product's own error. Dot: estimate. Line: 95% interval from resampling whole months. Filled dots are WeatherNext 3; hollow diamonds are the reference. The three colours are three groups of the same out-of-fold rows: February to June 2026 (4 calendar months), July to September 2026 (3 months), and every row from February to September 2026 (7 months). Only the second group is certain to lie after WeatherNext 3's training data, and the third mixes both, so it is not a fair comparison and not the headline until the archive's provenance is confirmed. Each calendar month occurs in one year only, so every contrast is descriptive. Every product is scored on exactly the same hours. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each mark is an XGBoost model&apos;s error, given one forecast product, in percent of capacity, or the difference</tspan><tspan x="0" dy="13">between two such models in points of capacity. Top panel: WeatherNext 3&apos;s error minus the reference&apos;s, on the same</tspan><tspan x="0" dy="13">rows. Lower panels: each product&apos;s own error. Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Filled dots are WeatherNext 3; hollow diamonds are the reference.</tspan><tspan x="0" dy="13">The three colours are three groups of the same out-of-fold rows: February to June 2026 (4 calendar months), July to</tspan><tspan x="0" dy="13">September 2026 (3 months), and every row from February to September 2026 (7 months). Only the second group is</tspan><tspan x="0" dy="13">certain to lie after WeatherNext 3&apos;s training data, and the third mixes both, so it is not a fair comparison and</tspan><tspan x="0" dy="13">not the headline until the archive&apos;s provenance is confirmed. Each calendar month occurs in one year only, so every</tspan><tspan x="0" dy="13">contrast is descriptive.</tspan><tspan x="0" dy="13">Every product is scored on exactly the same hours. Every error is a fraction of the generator&apos;s own capacity, taken</tspan><tspan x="0" dy="13">as its 99th percentile of metered output.</tspan></text></g></g></svg>

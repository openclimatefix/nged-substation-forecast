t role-title-text" font-size="18" transform="translate(6 19)">Figure 3: Error of F0, FP, and F6 at each lead day</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. CAMS: satellite irradiance service. Dot: estimate at the main XGBoost tuning setting. Line: 95% interval from resampling whole months. Every lead day is scored on the same farm-hours, those that all six lead days hold, so the lead days compare. A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar. F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow, precipitation, pressure, wind, gusts. IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day. FP: F0 plus dew point, pressure, precipitation, and wind speed, the variables the production forecast already receives. Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF&apos;s forecast via Open-Meteo. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate at the main XGBoost tuning setting. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Every lead day is scored on the same farm-hours, those that all six lead days hold, so the lead days compare.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar.</tspan><tspan x="0" dy="13">F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and</tspan><tspan x="0" dy="13">high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective</tspan><tspan x="0" dy="13">energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow,</tspan><tspan x="0" dy="13">precipitation, pressure, wind, gusts.</tspan><tspan x="0" dy="13">IFS: ECMWF&apos;s 9 km forecast, 00 UTC run, read at a lead day.</tspan><tspan x="0" dy="13">FP: F0 plus dew point, pressure, precipitation, and wind speed, the variables the production forecast already</tspan><tspan x="0" dy="13">receives.</tspan><tspan x="0" dy="13">Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

901" d="M468.9 271.2a3.9 3.9 0 1 1-7.8 0 3.9 3.9 0 1 1 7.8 0"/><path fill="#b701ff" d="M468.9 270a3.9 3.9 0 1 1-7.8 0 3.9 3.9 0 1 1 7.8 0"/></g></g><g aria-label="Symbol legend for fill color and stroke color with 3 values: f0, fp, f6" aria-roledescription="legend" class="mark-group role-legend"><path d="M40 489h601v13H40Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M40 489.3h226v12.4H40Z" aria-hidden="true" class="background"/><path fill="#306bff" stroke="#306bff" stroke-width="1.5" d="M51 495.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(56 498.3)">F0 minimal (radiation, temperature)</text><path d="M278 489.3h154v12.4H278Z" aria-hidden="true" class="background"/><path fill="#b701ff" stroke="#b701ff" stroke-width="1.5" d="M289 495.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(294 498.3)">FP production reference</text><path d="M444 489.3h196v12.4H444Z" aria-hidden="true" class="background"/><path fill="#ff4901" stroke="#ff4901" stroke-width="1.5" d="M455 495.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(460 498.3)">F6 + surface, weather (all 20)</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 3: Error of F0, FP, and F6 at each lead day'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 3: Error of F0, FP, and F6 at each lead day</text><text aria-label="Subtitle text 'Six solar farms of National Grid Electricity Distribution (NGED), daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. Dot: estimate at the main XGBoost tuning setting. Line: 95% interval from resampling whole months. Every lead day is scored on the same farm-hours, those that all six lead days hold, so the lead days compare. A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar. F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective energy (CAPE), inhibition, visibility. F6 (all 20 IFS variables): surface and weather variables. IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day. FP: F0 plus dew point, pressure, precipitation, and wind speed, the variables the production forecast already receives. Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six solar farms of National Grid Electricity Distribution (NGED), daylight hours, March 2024 to April 2026. IFS:</tspan><tspan x="0" dy="13">ECMWF&apos;s forecast via Open-Meteo.</tspan><tspan x="0" dy="13">Dot: estimate at the main XGBoost tuning setting. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Every lead day is scored on the same farm-hours, those that all six lead days hold, so the lead days compare.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar.</tspan><tspan x="0" dy="13">F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and</tspan><tspan x="0" dy="13">high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective</tspan><tspan x="0" dy="13">energy (CAPE), inhibition, visibility. F6 (all 20 IFS variables): surface and weather variables.</tspan><tspan x="0" dy="13">IFS: ECMWF&apos;s 9 km forecast, 00 UTC run, read at a lead day.</tspan><tspan x="0" dy="13">FP: F0 plus dew point, pressure, precipitation, and wind speed, the variables the production forecast already</tspan><tspan x="0" dy="13">receives.</tspan><tspan x="0" dy="13">Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

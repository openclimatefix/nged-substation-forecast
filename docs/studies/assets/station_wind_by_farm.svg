itting seed. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, August 2024 to December 2025: 34,156 farm-hours in 17 calendar months. Three farms are few independent sites. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>First-named arm&apos;s mean absolute error minus the second&apos;s, at each farm. Statistically significant at the 5% level</tspan><tspan x="0" dy="13">means the 95% interval lies wholly on one side of zero.</tspan><tspan x="0" dy="13">Each farm&apos;s interval resamples whole calendar months and a fitting seed.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole calendar months and a fitting seed. Capacity is each</tspan><tspan x="0" dy="13">generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, August 2024 to December 2025: 34,156 farm-hours in 17 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

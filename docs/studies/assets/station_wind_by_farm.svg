00.6"/></g><g fill="#ff4901" aria-hidden="true" class="mark-symbol role-mark concat_1_layer_4_marks" clip-path="url(#e)" transform="translate(225 575)"><path d="M208 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-30.6 50a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m-6.7 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_1_layer_5_marks" clip-path="url(#f)" transform="translate(225 575)"><path d="m200.9 40 4.2-4.2 4.2 4.2-4.2 4.2Zm-14.8 50 4.2-4.2 4.2 4.2-4.2 4.2Zm-2.6 50 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'S2, at each farm: (UKV + station) minus (UKV + its own 80 m wind)'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 553)">S2, at each farm: (UKV + station) minus (UKV + its own 80 m wind)</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 7: The nearest station's deficit against ERA5's 10 m wind is larger at W1 than at W3, and adding it to UKV lowers UKV's error at all three farms'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 7: The nearest station&apos;s deficit against ERA5&apos;s 10 m wind is</tspan><tspan x="0" dy="20">larger at W1 than at W3, and adding it to UKV lowers UKV&apos;s error at all</tspan><tspan x="0" dy="20">three farms</tspan></text><text aria-label="Subtitle text 'First-named arm's mean absolute error minus the second's, at each farm. Statistically significant at the 5% level means the 95% interval lies wholly on one side of zero. S1 at W1 minus S1 at W3, exploratory: +1.40 points [+0.63, +2.40] at the main setting. Where one farm's interval excludes zero and another's does not, the farms are not shown to differ; the direct comparison is this one. Each farm's interval resamples whole calendar months and a fitting seed. Dot: estimate. Line: 95% interval from resampling whole calendar months and a fitting seed. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, August 2024 to December 2025: 34,156 farm-hours in 17 calendar months. Three farms are few independent sites. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>First-named arm&apos;s mean absolute error minus the second&apos;s, at each farm. Statistically significant at the 5% level</tspan><tspan x="0" dy="13">means the 95% interval lies wholly on one side of zero.</tspan><tspan x="0" dy="13">S1 at W1 minus S1 at W3, exploratory: +1.40 points [+0.63, +2.40] at the main setting. Where one farm&apos;s interval</tspan><tspan x="0" dy="13">excludes zero and another&apos;s does not, the farms are not shown to differ; the direct comparison is this one.</tspan><tspan x="0" dy="13">Each farm&apos;s interval resamples whole calendar months and a fitting seed.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole calendar months and a fitting seed. Capacity is each</tspan><tspan x="0" dy="13">generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, August 2024 to December 2025: 34,156 farm-hours in 17 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v160H0z"/></clipPath></defs>
"/><path fill="#306bff" d="M299.9 433.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#292b2b" d="m209 245.7 3.4-3.4 3.3 3.4-3.3 3.4Z"/><path fill="#306bff" d="M282.5 253.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M348.5 261.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M415.7 270a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#306bff" d="M235 133.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M285.3 141.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M363.7 150a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#17e58f" d="M469.2 158.1a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#306bff" d="M313.8 673.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0m-5.4-120a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10"><text transform="translate(8 429)">ENS mean</text><text transform="translate(8 489)">IFS 0.25°</text><text transform="translate(8 549)">ENS control member</text><text transform="translate(8 609)">ICON-EU</text><text transform="translate(8 669)">ICON global</text><text transform="translate(8 729)">DMI HARMONIE-AROME</text><text transform="translate(8 789)">ICON-D2</text><text transform="translate(8 849)">AROME France</text><text transform="translate(8 909)">UKV</text><text transform="translate(8 969)">GEFS mean</text><text transform="translate(8 1029)">KNMI HARMONIE-AROME</text><text transform="translate(8 1089)">ARPEGE Europe</text><text transform="translate(8 1149)">GFS</text></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" text-anchor="end"><text transform="translate(579 384)">Climatology</text><text transform="translate(628.8 354)">Smart persistence, day 1</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: Error rises with lead to day 10: at day 1 every weather forecast shown has a lower error than climatology (14.5%), but at day 14 neither the ENS mean nor the GEFS mean does; ENS and IFS 0.25° have the lowest day-1 errors'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5.5 19)"><tspan>Figure 1: Error rises with lead to day 10: at day 1 every weather</tspan><tspan x="0" dy="20">forecast shown has a lower error than climatology (14.5%), but at day 14</tspan><tspan x="0" dy="20">neither the ENS mean nor the GEFS mean does; ENS and IFS 0.25° have the</tspan><tspan x="0" dy="20">lowest day-1 errors</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product. Each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day, on the hours every forecast is scored on. The XGBoost model uses the primary setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines mark the no-weather baselines. Within each row, marks run from day 0 at the top to day 14 at the bottom. Day 0 is read from a run that started 0 to 23 hours (ENS) or 0 to 3 hours (ICON-EU and ICON-D2, Open-Meteo's freshest run) before the hour it describes, so it is not a day-ahead forecast a service could read. Marks at days 5, 10, and 14, and the day-0 marks of ICON-EU and ICON-D2, were fitted later, on a graphics processing unit (GPU), at the primary setting only; a GPU refit of an arm differs from its CPU fit by at most 0.02 points. Overlapping intervals here can still hide a significant paired difference (Figure 3). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Leads are not equal: a forecast from Open-Meteo's Previous Runs archive comes from the freshest run made at least a day before the hour it describes, so its day-1 lead is shorter than ENS's on most hours, which favours that product. Of the products drawn here, only GEFS shares ENS's lead. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.5 98)"><tspan>Each row is one forecast product. Each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day, on the hours every forecast is scored on. The XGBoost model uses the</tspan><tspan x="0" dy="13">primary setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in.</tspan><tspan x="0" dy="13">Dashed lines mark the no-weather baselines.</tspan><tspan x="0" dy="13">Within each row, marks run from day 0 at the top to day 14 at the bottom. Day 0 is read from a run that started 0</tspan><tspan x="0" dy="13">to 23 hours (ENS) or 0 to 3 hours (ICON-EU and ICON-D2, Open-Meteo&apos;s freshest run) before the hour it describes, so</tspan><tspan x="0" dy="13">it is not a day-ahead forecast a service could read. Marks at days 5, 10, and 14, and the day-0 marks of ICON-EU</tspan><tspan x="0" dy="13">and ICON-D2, were fitted later, on a graphics processing unit (GPU), at the primary setting only; a GPU refit of an</tspan><tspan x="0" dy="13">arm differs from its CPU fit by at most 0.02 points. Overlapping intervals here can still hide a significant paired</tspan><tspan x="0" dy="13">difference (Figure 3). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Leads are not equal: a forecast from Open-Meteo&apos;s Previous Runs archive comes from the freshest run made at least a</tspan><tspan x="0" dy="13">day before the hour it describes, so its day-1 lead is shorter than ENS&apos;s on most hours, which favours that</tspan><tspan x="0" dy="13">product. Of the products drawn here, only GEFS shares ENS&apos;s lead.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h670v840H0z"/></clipPath><clipPath id="b"><path d="M0 0h670v840H0z"/></clipPath></defs></svg>

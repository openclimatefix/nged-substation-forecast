#292b2b" d="m212.2 121.7 3.3-3.4 3.4 3.3-3.4 3.4Z"/><path fill="#306bff" d="M275.5 129.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M320.8 137.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M392.6 146a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#17e58f" d="M487.7 154a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="gray" d="m587.8 162.2 3.4-3.4 3.4 3.3-3.4 3.4Z"/><path fill="#292b2b" d="m268.9 361.7 3.3-3.4 3.4 3.3-3.4 3.4Z"/><path fill="#306bff" d="M328 369.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M385.5 377.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M447.7 386a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#17e58f" d="M533.5 394a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="gray" d="m583.9 402.2 3.3-3.4 3.4 3.3-3.4 3.4Z"/><path fill="#292b2b" d="m276.4 721.7 3.4-3.4 3.3 3.4-3.3 3.3Z"/><path fill="#306bff" d="M346.6 729.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#292b2b" d="m229.6 601.7 3.4-3.4 3.4 3.4-3.4 3.3Z"/><path fill="#306bff" d="M342.2 609.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10"><text transform="translate(8 403)">ENS mean</text><text transform="translate(8 463)">IFS 0.25°</text><text transform="translate(8 523)">ENS control member</text><text transform="translate(8 583)">ICON-EU</text><text transform="translate(8 643)">ICON global</text><text transform="translate(8 703)">IFS HRES (9 km, Open-Meteo)</text><text transform="translate(8 763)">DMI HARMONIE-AROME</text><text transform="translate(8 823)">ICON-D2</text><text transform="translate(8 883)">AROME France</text><text transform="translate(8 943)">UKV</text><text transform="translate(8 1003)">GEFS mean</text><text transform="translate(8 1063)">KNMI HARMONIE-AROME</text><text transform="translate(8 1123)">ARPEGE Europe</text><text transform="translate(8 1183)">GFS (Open-Meteo)</text><text transform="translate(8 1243)">GFS (native)</text></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" text-anchor="end"><text transform="translate(587.6 358)">Climatology</text><text transform="translate(632.8 328)">Smart persistence, day 1</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: For solar power, error rises with lead to day 10: at day 1 every weather forecast shown has a lower error than climatology (14.5%), but at day 14 neither the ENS mean nor the GEFS mean does; the ENS mean and IFS 0.25° have the lowest day-1 errors'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5.5 19)"><tspan>Figure 1: For solar power, error rises with lead to day 10: at day 1</tspan><tspan x="0" dy="20">every weather forecast shown has a lower error than climatology (14.5%),</tspan><tspan x="0" dy="20">but at day 14 neither the ENS mean nor the GEFS mean does; the ENS mean</tspan><tspan x="0" dy="20">and IFS 0.25° have the lowest day-1 errors</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product. Each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day. Smaller is better. Marks run from day 0 at the top to day 14 at the bottom; day 7 is a grey diamond and day 0 is a black diamond. A lead day with no mark was not fitted; nothing is filled in. Dashed lines mark the no-weather baselines. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Overlapping intervals can still hide a significant paired difference (Figure 3). Day 0 is not a day-ahead forecast a service could read, because each product reads a run that started before the hour it describes. Every mark is a graphics processing unit (GPU) fit, so no mark mixes devices. Leads are not equal: a Previous Runs product reads the freshest run at least a day old, a shorter lead than ENS's on most hours, which favours that product. IFS HRES (9 km, Open-Meteo) is scored on the shared hours minus the target days its archive lacks, which the other rows include. That difference alone moves the ENS mean's day-1 error by +0.022 points (8.771% on all 35,263 shared rows, 8.792% on the 34,771 rows without the gap days). Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.5 98)"><tspan>Each row is one forecast product. Each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day. Smaller is better. Marks run from day 0 at the top to day 14 at the</tspan><tspan x="0" dy="13">bottom; day 7 is a grey diamond and day 0 is a black diamond. A lead day with no mark was not fitted; nothing is</tspan><tspan x="0" dy="13">filled in. Dashed lines mark the no-weather baselines. Dot: estimate. Line: 95% interval from resampling whole</tspan><tspan x="0" dy="13">months and a fitting seed. Overlapping intervals can still hide a significant paired difference (Figure 3).</tspan><tspan x="0" dy="13">Day 0 is not a day-ahead forecast a service could read, because each product reads a run that started before the</tspan><tspan x="0" dy="13">hour it describes. Every mark is a graphics processing unit (GPU) fit, so no mark mixes devices. Leads are not</tspan><tspan x="0" dy="13">equal: a Previous Runs product reads the freshest run at least a day old, a shorter lead than ENS&apos;s on most hours,</tspan><tspan x="0" dy="13">which favours that product. IFS HRES (9 km, Open-Meteo) is scored on the shared hours minus the target days its</tspan><tspan x="0" dy="13">archive lacks, which the other rows include. That difference alone moves the ENS mean&apos;s day-1 error by +0.022</tspan><tspan x="0" dy="13">points (8.771% on all 35,263 shared rows, 8.792% on the 34,771 rows without the gap days).</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h670v960H0z"/></clipPath><clipPath id="b"><path d="M0 0h670v960H0z"/></clipPath></defs></svg>

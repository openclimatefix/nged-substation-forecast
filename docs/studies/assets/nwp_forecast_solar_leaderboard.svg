2 forecasts. A control gives an XGBoost model the same columns with the shuffled products' values moved among matched hours. Overlapping intervals here can still hide a significant paired difference (Figure 1). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each row is one forecast&apos;s own mean absolute error, as a percentage of capacity, on the hours every forecast is</tspan><tspan x="0" dy="13">scored on, with no weather forecast given for the baselines. Primary XGBoost setting. Smaller is better.</tspan><tspan x="0" dy="13">Only day-1 forecasts, ENS at day 0, climatology and smart persistence at day 1 are shown; the other days are in the</tspan><tspan x="0" dy="13">lead-day figure. P4a blends ENS with the day-1 ICON-EU and IFS 0.25°; P4b uses their day-2 forecasts. A control</tspan><tspan x="0" dy="13">gives an XGBoost model the same columns with the shuffled products&apos; values moved among matched hours. Overlapping</tspan><tspan x="0" dy="13">intervals here can still hide a significant paired difference (Figure 1). Dot: estimate. Line: 95% interval from</tspan><tspan x="0" dy="13">resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v560H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v560H0z"/></clipPath></defs></svg>

l="#009c75" d="M233.7 584.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M137.6 271.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-31.2-150a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#292b2b" d="m61 15.3 4.2-4.2 4.2 4.2-4.2 4.1Z"/><path fill="#306bff" d="M94.4 21.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#10c5f7" d="M134 28.2a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M175.3 34.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M145.1 471.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M183 478.3a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M223.2 484.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M180.1 621.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#10c5f7" d="M224 628.3a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M246.7 634.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M134 221.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M176.6 228.3a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M219.7 234.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M138.3 321.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-11.3-150a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M170 178.3a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M214 184.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M95.9 71.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M128.8 78.3a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M180 84.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M147.4 521.8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M144 421.7a4.2 4.2 0 1 1-8.5 0 4.2 4.2 0 1 1 8.4 0"/></g><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_4_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" text-anchor="end" transform="translate(537 294)">Climatology</text><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" transform="translate(579.4 344)">Smart persistence, day 1</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: At day 1 every weather forecast shown has a lower error than climatology (14.5%); ENS and IFS 0.25° have the lowest error of the single solar forecasts'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: At day 1 every weather forecast shown has a lower error than</tspan><tspan x="0" dy="20">climatology (14.5%); ENS and IFS 0.25° have the lowest error of the</tspan><tspan x="0" dy="20">single solar forecasts</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product; each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day, on the hours every forecast is scored on. Primary XGBoost setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines: the no-weather baselines. Day 0 is ENS's run-day forecast, a bracket side, not a forecast a service could read. Overlapping intervals here can still hide a significant paired difference (Figure 3). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Leads are not equal: a forecast from Open-Meteo's Previous Runs archive has a day-1 lead of 24 + (h mod n) hours, shorter than ENS's 24 + h on most hours, so the comparison favours those forecasts. Only GEFS shares ENS's lead. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Each row is one forecast product; each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day, on the hours every forecast is scored on. Primary XGBoost setting.</tspan><tspan x="0" dy="13">Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines: the</tspan><tspan x="0" dy="13">no-weather baselines.</tspan><tspan x="0" dy="13">Day 0 is ENS&apos;s run-day forecast, a bracket side, not a forecast a service could read. Overlapping intervals here</tspan><tspan x="0" dy="13">can still hide a significant paired difference (Figure 3). Dot: estimate. Line: 95% interval from resampling whole</tspan><tspan x="0" dy="13">months and a fitting seed.</tspan><tspan x="0" dy="13">Leads are not equal: a forecast from Open-Meteo&apos;s Previous Runs archive has a day-1 lead of 24 + (h mod n) hours,</tspan><tspan x="0" dy="13">shorter than ENS&apos;s 24 + h on most hours, so the comparison favours those forecasts. Only GEFS shares ENS&apos;s lead.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v650H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v650H0z"/></clipPath></defs></svg>

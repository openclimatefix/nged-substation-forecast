.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#bf4f04" d="M321.8 624.3a3.4 3.4 0 1 1-6.8 0 3.4 3.4 0 1 1 6.8 0"/><path fill="#306bff" d="M178.2 763.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M218.3 771.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M238.8 780a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#17e58f" d="M285.8 788.1a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#306bff" d="M136.2 283.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M175 291.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M214.2 300a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#17e58f" d="M284.4 308.1a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#292b2b" d="m57.5 395.7 3.3-3.4 3.4 3.4-3.4 3.4Z"/><path fill="#306bff" d="M140.1 403.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#292b2b" d="m83.3 215.7 3.3-3.4 3.4 3.4-3.4 3.4Z"/><path fill="#306bff" d="M129.8 223.8a3.4 3.4 0 1 1-6.8 0 3.4 3.4 0 1 1 6.8 0"/><path fill="#10c5f7" d="M169 231.9a3.4 3.4 0 1 1-6.6 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M209.1 240a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#306bff" d="M101.4 103.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#10c5f7" d="M131.4 111.9a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#009c75" d="M178.1 120a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#17e58f" d="M241 128.1a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/><path fill="#306bff" d="M148.4 643.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0m-3.2-120a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/></g><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_4_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" text-anchor="end" transform="translate(523.3 356)">Climatology</text><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" transform="translate(563 356)">Smart persistence, day 1</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: Error rises with lead to day 10: at day 1 every weather forecast shown has a lower error than climatology (14.5%), but at day 14 neither the ENS mean nor the GEFS mean does; ENS and IFS 0.25° have the lowest day-1 errors'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: Error rises with lead to day 10: at day 1 every weather</tspan><tspan x="0" dy="20">forecast shown has a lower error than climatology (14.5%), but at day 14</tspan><tspan x="0" dy="20">neither the ENS mean nor the GEFS mean does; ENS and IFS 0.25° have the</tspan><tspan x="0" dy="20">lowest day-1 errors</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product. Each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day, on the hours every forecast is scored on. The XGBoost model uses the primary setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines mark the no-weather baselines. Within each row, marks run from day 0 at the top to day 14 at the bottom. Day 0 is read from a run that started 0 to 23 hours (ENS) or 0 to 3 hours (ICON-EU and ICON-D2, Open-Meteo's freshest run) before the hour it describes, so it is not a day-ahead forecast a service could read. Marks at days 5, 10, and 14, and the day-0 marks of ICON-EU and ICON-D2, were fitted later, on a graphics processing unit (GPU), at the primary setting only; a GPU refit of an arm differs from its CPU fit by at most 0.02 points. Overlapping intervals here can still hide a significant paired difference (Figure 3). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Leads are not equal: a forecast from Open-Meteo's Previous Runs archive comes from the freshest run made at least a day before the hour it describes, so its day-1 lead is shorter than ENS's on most hours, which favours that product. Of the products drawn here, only GEFS shares ENS's lead. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>Each row is one forecast product. Each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day, on the hours every forecast is scored on. The XGBoost model uses the</tspan><tspan x="0" dy="13">primary setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in.</tspan><tspan x="0" dy="13">Dashed lines mark the no-weather baselines.</tspan><tspan x="0" dy="13">Within each row, marks run from day 0 at the top to day 14 at the bottom. Day 0 is read from a run that started 0</tspan><tspan x="0" dy="13">to 23 hours (ENS) or 0 to 3 hours (ICON-EU and ICON-D2, Open-Meteo&apos;s freshest run) before the hour it describes, so</tspan><tspan x="0" dy="13">it is not a day-ahead forecast a service could read. Marks at days 5, 10, and 14, and the day-0 marks of ICON-EU</tspan><tspan x="0" dy="13">and ICON-D2, were fitted later, on a graphics processing unit (GPU), at the primary setting only; a GPU refit of an</tspan><tspan x="0" dy="13">arm differs from its CPU fit by at most 0.02 points. Overlapping intervals here can still hide a significant paired</tspan><tspan x="0" dy="13">difference (Figure 3). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Leads are not equal: a forecast from Open-Meteo&apos;s Previous Runs archive comes from the freshest run made at least a</tspan><tspan x="0" dy="13">day before the hour it describes, so its day-1 lead is shorter than ENS&apos;s on most hours, which favours that</tspan><tspan x="0" dy="13">product. Of the products drawn here, only GEFS shares ENS&apos;s lead.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v810H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v810H0z"/></clipPath></defs></svg>

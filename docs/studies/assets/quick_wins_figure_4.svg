 d="M196.6 490.8a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M105.1 511.5a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M202.3 532.2a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'MAE: scores the ensemble mean only'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 906)">MAE: scores the ensemble mean only</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 4: Combining ideas lowers CRPS by up to 1.4 points of capacity, at every lead'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 4: Combining ideas lowers CRPS by up to 1.4 points of capacity,</tspan><tspan x="0" dy="20">at every lead</tspan></text><text aria-label="Subtitle text 'Each dot is the paired difference between an arm and production with cleaning in mean score, over 31 series and 53 weekly ECMWF ensemble (ENS) forecast runs, scored from July 2025 to June 2026; seed 0. Zero means no change. Each line is the 95% interval from resampling whole months. Days 0 to 2 are forecasts up to 72 hours after the run starts; days 3 to 10 are 72 to 264 hours. The first row, absolute-error loss, is the best round 1 arm; each later row adds ideas. The horizontal axis has the same range as Figure 2. Round 2 labels list the ideas combined: abs. loss is the absolute-error loss, stop is early stopping, lead is the forecast lead-time column, wind is the lean wind-farm columns, and pooled is one model per series type with a site identifier. Every row is post hoc: chosen after seeing the round 1 results.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each dot is the paired difference between an arm and production with cleaning in mean score, over 31 series and 53</tspan><tspan x="0" dy="13">weekly ECMWF ensemble (ENS) forecast runs, scored from July 2025 to June 2026; seed 0. Zero means no change.</tspan><tspan x="0" dy="13">Each line is the 95% interval from resampling whole months. Days 0 to 2 are forecasts up to 72 hours after the run</tspan><tspan x="0" dy="13">starts; days 3 to 10 are 72 to 264 hours.</tspan><tspan x="0" dy="13">The first row, absolute-error loss, is the best round 1 arm; each later row adds ideas.</tspan><tspan x="0" dy="13">The horizontal axis has the same range as Figure 2.</tspan><tspan x="0" dy="13">Round 2 labels list the ideas combined: abs. loss is the absolute-error loss, stop is early stopping, lead is the</tspan><tspan x="0" dy="13">forecast lead-time column, wind is the lean wind-farm columns, and pooled is one model per series type with a site</tspan><tspan x="0" dy="13">identifier.</tspan><tspan x="0" dy="13">Every row is post hoc: chosen after seeing the round 1 results.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v558H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v558H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v558H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v558H0z"/></clipPath></defs></svg>

</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v110H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v110H0z"/></clipPath></defs></svg>

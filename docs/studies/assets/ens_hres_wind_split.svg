50h87.6"/><path stroke="#306bff" d="M303 40h108.8M251.5 90h84.3m-164.1 50h83.8M239 190h69.4M25.3 240h93.1"/></g><g fill="#ff4901" aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_4_marks" clip-path="url(#b)" transform="translate(225 332)"><path d="M242.4 20a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m-21.5 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-40 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m58 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-83.4 50a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_5_marks" clip-path="url(#c)" transform="translate(225 332)"><path d="m351 40 4.3-4.2 4.1 4.2-4.1 4.2Zm-60.8 50 4.2-4.2 4.2 4.2-4.2 4.2Zm-83.6 50 4.2-4.2 4.2 4.2-4.2 4.2Zm63.2 50 4.2-4.2 4.2 4.2-4.2 4.2ZM64.3 240l4.1-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Each contrast by label hour'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 298)">Each contrast by label hour</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 14: ENS day 0's gap to UKV and HRES is larger in the later hours of the day, as is ERA5's gap to UKV'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 14: ENS day 0&apos;s gap to UKV and HRES is larger in the later hours</tspan><tspan x="0" dy="20">of the day, as is ERA5&apos;s gap to UKV</tspan></text><text aria-label="Subtitle text 'Labels 00-08 UTC are ENS leads 0 to 8 h from the 00 UTC run, labels 10-23 UTC leads 10 to 23 h. The split mixes lead with time of day and does not show whether ENS could be read in time. UKV against ERA5 involves no forecast lead, but its change between the halves is not time of day alone: HRES's served lead varies with the UTC hour before 1 October 2025, and ERA5's assimilation windows change at 09 to 10 and 21 to 22 UTC. The split cannot apportion the widening between ENS lead and time of day. Change from labels 00-08 UTC to labels 10-23 UTC, in points, exploratory: ECMWF ENS day-0 mean − UKV +0.49 [+0.24, +0.76]; UKV − ERA5 -0.35 [-0.50, -0.18]; ECMWF ENS day-0 mean − ERA5 +0.14 [-0.07, +0.39]; ECMWF ENS day-0 mean − ECMWF HRES +0.33 [+0.14, +0.50]. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three farms are few independent sites. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Labels 00-08 UTC are ENS leads 0 to 8 h from the 00 UTC run, labels 10-23 UTC leads 10 to 23 h. The split mixes</tspan><tspan x="0" dy="13">lead with time of day and does not show whether ENS could be read in time.</tspan><tspan x="0" dy="13">UKV against ERA5 involves no forecast lead, but its change between the halves is not time of day alone: HRES&apos;s</tspan><tspan x="0" dy="13">served lead varies with the UTC hour before 1 October 2025, and ERA5&apos;s assimilation windows change at 09 to 10 and</tspan><tspan x="0" dy="13">21 to 22 UTC. The split cannot apportion the widening between ENS lead and time of day.</tspan><tspan x="0" dy="13">Change from labels 00-08 UTC to labels 10-23 UTC, in points, exploratory: ECMWF ENS day-0 mean − UKV +0.49 [+0.24,</tspan><tspan x="0" dy="13">+0.76]; UKV − ERA5 -0.35 [-0.50, -0.18]; ECMWF ENS day-0 mean − ERA5 +0.14 [-0.07, +0.39]; ECMWF ENS day-0 mean −</tspan><tspan x="0" dy="13">ECMWF HRES +0.33 [+0.14, +0.50].</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v260H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v260H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v260H0z"/></clipPath></defs></svg>

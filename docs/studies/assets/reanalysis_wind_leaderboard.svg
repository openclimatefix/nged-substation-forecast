h173.8"/><path stroke="#10c5f7" d="M136.8 117h198.8m-196.9 26h197"/><path stroke="#306bff" d="M162.8 169h242"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_1_layer_1_marks" clip-path="url(#e)" transform="translate(225 574)"><path fill="#306bff" d="M157.8 13a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m20.7 26a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0M193 65a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#10c5f7" d="M235.5 117a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m1 26a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M281.5 169a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_1_layer_2_marks" clip-path="url(#f)" transform="translate(225 574)"><path stroke="#a3d6e0" stroke-width="2" d="M231.8 91a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'NORA3: Aug 2024 to Aug 2026, 50,041 farm-hours'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 567)">NORA3: Aug 2024 to Aug 2026, 50,041 farm-hours</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: At three wind farms, ICON-D2's wind has the lowest error in both blocks'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: At three wind farms, ICON-D2&apos;s wind has the lowest error in</tspan><tspan x="0" dy="20">both blocks</tspan></text><text aria-label="Subtitle text 'Each arm's own mean absolute error, sorted best first within its block. Compare arms only within a block: the blocks differ in rows, hours of the day, period, and fitted XGBoost models, and even their ERA5 rows differ, so no CERRA row is comparable with any NORA3 row. Overlapping intervals do not show that two arms are equal: every arm's error swings together from month to month, a swing that Figure 2's paired contrasts cancel. CERRA: 0.0% of scored rows are in a calendar month, seen in two or more years, with no training row in their fold, and 4.5% are in a calendar month seen in one year only, which no fold design can cover. NORA3: 0.0% of scored rows are in a calendar month, seen in two or more years, with no training row in their fold, and 0.0% are in a calendar month seen in one year only, which no fold design can cover. Wind heights: ERA5, CERRA, and NORA3 at 100 m, the ICON products at 80 m, UKV at 100 m. Dot: estimate. Line: 95% interval from resampling whole calendar months, each with all three farms' rows, and a fitting seed. The interval does not cover variation between the three farms. Errors are a fraction of each generator's 99th-percentile output, not its nameplate capacity. Three wind farms in Lincolnshire. CERRA and NORA3 are read at 100 m. The lighter, hollow row is ERA5, scored on that block's own rows.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each arm&apos;s own mean absolute error, sorted best first within its block.</tspan><tspan x="0" dy="13">Compare arms only within a block: the blocks differ in rows, hours of the day, period, and fitted</tspan><tspan x="0" dy="13">XGBoost models, and even their ERA5 rows differ, so no CERRA row is comparable with any NORA3 row.</tspan><tspan x="0" dy="13">Overlapping intervals do not show that two arms are equal: every arm&apos;s error swings together from</tspan><tspan x="0" dy="13">month to month, a swing that Figure 2&apos;s paired contrasts cancel.</tspan><tspan x="0" dy="13">CERRA: 0.0% of scored rows are in a calendar month, seen in two or more years, with no training row</tspan><tspan x="0" dy="13">in their fold, and 4.5% are in a calendar month seen in one year only, which no fold design can</tspan><tspan x="0" dy="13">cover.</tspan><tspan x="0" dy="13">NORA3: 0.0% of scored rows are in a calendar month, seen in two or more years, with no training row</tspan><tspan x="0" dy="13">in their fold, and 0.0% are in a calendar month seen in one year only, which no fold design can</tspan><tspan x="0" dy="13">cover.</tspan><tspan x="0" dy="13">Wind heights: ERA5, CERRA, and NORA3 at 100 m, the ICON products at 80 m, UKV at 100 m.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole calendar months, each with all three farms&apos;</tspan><tspan x="0" dy="13">rows, and a fitting seed. The interval does not cover variation between the three farms.</tspan><tspan x="0" dy="13">Errors are a fraction of each generator&apos;s 99th-percentile output, not its nameplate capacity.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire. CERRA and NORA3 are read at 100 m.</tspan><tspan x="0" dy="13">The lighter, hollow row is ERA5, scored on that block&apos;s own rows.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v182H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v182H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v182H0z"/></clipPath></defs></svg>

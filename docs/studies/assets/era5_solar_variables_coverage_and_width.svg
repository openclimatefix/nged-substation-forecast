373 345.5)">Share of outcomes inside the 10 to 90% interval (%)</text></g><path stroke="#292b2b" stroke-width="2" d="m424.2 627.8 4-3.9 3.8 3.9-3.9 3.9Zm-143.5 42.7 3.9-3.9 3.8 3.9-3.8 3.9ZM94.5 790.8l4-4 3.8 4-3.9 3.8Zm45-26.6 3.9-3.9 3.9 3.9-4 3.9Zm91 8.8 3.8-3.8 3.9 3.8-3.9 4ZM91.2 819.7 95 816l4 3.8-4 3.9Zm-2-20.2 3.9-3.9 3.9 3.9-4 3.9Z" aria-hidden="true" class="mark-symbol role-mark concat_1_layer_0_marks" opacity=".7"/><g aria-hidden="true" class="mark-symbol role-mark concat_1_layer_1_marks"><path fill="#ff4901" d="M473.4 627.8a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/><path fill="#17e58f" d="M346.3 670.5a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/><path fill="#306bff" d="M208.2 790.8a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/><path fill="#bf4f04" d="M244.4 764.2a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/><path fill="#fc9700" d="M324.9 773a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/><path fill="#10c5f7" d="M211.4 819.7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/><path fill="#b701ff" d="M195.8 799.5a4.5 4.5 0 1 1-9 0 4.5 4.5 0 1 1 9 0" opacity=".7"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'CAMS clearness index'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(18 584.1)">CAMS clearness index</text></g></g><g aria-label="Symbol legend titled 'Variable set' for fill color with 7 values: G0 minimal (radiation, temperature), G10 + CAMS aerosol, G2 + cloud layers, G9 + all other ERA5, G9 on aerosol rows, G9 without the MARS-only variables, Negative control" aria-roledescription="legend" class="mark-group role-legend"><path d="M52 878h1121v27H52Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M52 894h226v11H52Z" aria-hidden="true" class="background"/><path fill="#ff4901" d="M63 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(68 903)">G0 minimal (radiation, temperature)</text><path d="M289 894h124v11H289Z" aria-hidden="true" class="background"/><path fill="#b701ff" d="M300 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(305 903)">G10 + CAMS aerosol</text><path d="M424 894h118v11H424Z" aria-hidden="true" class="background"/><path fill="#17e58f" d="M435 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(440 903)">G2 + cloud layers</text><path d="M553 894h130v11H553Z" aria-hidden="true" class="background"/><path fill="#306bff" d="M564 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(569 903)">G9 + all other ERA5</text><path d="M694 894h124v11H694Z" aria-hidden="true" class="background"/><path fill="#10c5f7" d="M705 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(710 903)">G9 on aerosol rows</text><path d="M829 894h220v11H829Z" aria-hidden="true" class="background"/><path fill="#bf4f04" d="M840 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(845 903)">G9 without the MARS-only variables</text><path d="M1060 894h112v11h-112Z" aria-hidden="true" class="background"/><path fill="#fc9700" d="M1071 900a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(1076 903)">Negative control</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(52 887)">Variable set</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 13c: Coverage against interval width'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19.1)">Figure 13c: Coverage against interval width</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. The XGBoost model predicts a 10 to 90% interval that should hold 80% of outcomes. Circle: that predicted interval. Diamond: one fixed-width interval, from the same variable set's errors, that holds the same share of outcomes as the circle. A narrower interval at the same share is better, so a set that helps with uncertainty sits left of its diamond. A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar radiation (ssrd), and air temperature (t2m). Each group adds to the one before. G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation. G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation. G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables. G10: G9 plus CAMS aerosol. Negative control: G2 plus shuffled copies of the other variables, which carry no information. MARS-only: 12 ERA5 variables that neither ECMWF's free forecast feed nor Open-Meteo serves. Main XGBoost tuning setting only. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38.1)"><tspan>Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF&apos;s reanalysis of past weather. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">The XGBoost model predicts a 10 to 90% interval that should hold 80% of outcomes.</tspan><tspan x="0" dy="13">Circle: that predicted interval. Diamond: one fixed-width interval, from the same</tspan><tspan x="0" dy="13">variable set&apos;s errors, that holds the same share of outcomes as the circle. A</tspan><tspan x="0" dy="13">narrower interval at the same share is better, so a set that helps with uncertainty</tspan><tspan x="0" dy="13">sits left of its diamond.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar</tspan><tspan x="0" dy="13">radiation (ssrd), and air temperature (t2m). Each group adds to the one before.</tspan><tspan x="0" dy="13">G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation.</tspan><tspan x="0" dy="13">G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation.</tspan><tspan x="0" dy="13">G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables.</tspan><tspan x="0" dy="13">G10: G9 plus CAMS aerosol.</tspan><tspan x="0" dy="13">Negative control: G2 plus shuffled copies of the other variables, which carry no information.</tspan><tspan x="0" dy="13">MARS-only: 12 ERA5 variables that neither ECMWF&apos;s free forecast feed nor Open-Meteo serves.</tspan><tspan x="0" dy="13">Main XGBoost tuning setting only. Exploratory: not named in the study plan before any result existed, and not</tspan><tspan x="0" dy="13">corrected for multiple comparisons.</tspan></text></g></g></svg>

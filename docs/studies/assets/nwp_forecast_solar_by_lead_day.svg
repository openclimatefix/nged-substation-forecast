478.5 304.4)">ICON global</text><text fill="#ff4901" transform="translate(482.2 316.9)">ICON-EU</text><text fill="#ff4901" transform="translate(485.8 337.8)">IFS 0.25°</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 9: Solar error rises with lead day for every forecast, and no product beats the ENS mean at matched lead'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 9: Solar error rises with lead day for every forecast, and no</tspan><tspan x="0" dy="20">product beats the ENS mean at matched lead</tspan></text><text aria-label="Subtitle text 'Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity. Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean's day-0 and day-1 errors; a whole-day product at day 1 lies between them when it is bracketed. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn side by side, and the name of each is written beside its last point. Products with a day-1 forecast only are left out; the day-1 leaderboard shows them. Every product is scored on exactly the same hours. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s day-0 and day-1</tspan><tspan x="0" dy="13">errors; a whole-day product at day 1 lies between them when it is bracketed.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and the name of each is written beside its last point. Products with a day-1 forecast only are left</tspan><tspan x="0" dy="13">out; the day-1 leaderboard shows them. Every product is scored on exactly the same hours.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g></svg>

120.9-31.8a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0m120.9-49.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M253.8 520a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-39.9a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-43.2a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0"/></g><g aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10"><text fill="#306bff" transform="translate(504 515.6)">ENS mean</text><text fill="#292b2b" transform="translate(504 403)">ARPEGE</text><text fill="#10c5f7" transform="translate(504 421.8)">GEFS mean</text><text fill="#fc9700" transform="translate(504 384.3)">GFS (Open-Meteo)</text><text fill="#fc9700" transform="translate(504 365.6)">GFS (native)</text><text fill="#17e58f" transform="translate(504 459.3)">ICON global</text><text fill="#009c75" transform="translate(504 478)">ICON-EU</text><text fill="#bf4f04" transform="translate(504 496.8)">IFS 0.25°</text><text fill="#bf4f04" transform="translate(504 440.6)">IFS HRES 9 km</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 11: Solar error rises with lead day for every forecast; IFS 0.25° cannot be told apart from the ENS mean at days 1 to 3, and every other product has a higher error than ENS'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 11: Solar error rises with lead day for every forecast; IFS 0.25°</tspan><tspan x="0" dy="20">cannot be told apart from the ENS mean at days 1 to 3, and every other</tspan><tspan x="0" dy="20">product has a higher error than ENS</tspan></text><text aria-label="Subtitle text 'Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity. The XGBoost model uses the primary setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean's day-0 and day-1 errors, the two ENS leads between which a Previous Runs product's day-1 lead falls. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn side by side, and each product's name is written beside its last point. The dashed lines are GFS (native), IFS HRES 9 km, and ARPEGE. GFS (native) and IFS HRES 9 km each share a colour with a solid line, GFS (Open-Meteo) and IFS 0.25°. IFS HRES 9 km is IFS HRES (9 km, Open-Meteo): 00 UTC runs only, not checked against a native archive, and its day-3 values after lead 90 hours are interpolated from 3-hourly steps. ICON-EU's day 0 is not drawn, because it reads a run at most 3 hours old. Products fitted at fewer than three of days 0 to 3 are left out, and days 5 to 14 and IFS HRES 9 km's day 0 appear only in Figure 1. Lead day: ENS, GFS (native), and IFS HRES 9 km read a 24-hour band of leads of the 00 UTC run that many days earlier; other products read the freshest run at least that many days old. Every product except IFS HRES 9 km is scored on exactly the same hours; IFS HRES 9 km is scored without the target days its archive lacks. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">The XGBoost model uses the primary setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s</tspan><tspan x="0" dy="13">day-0 and day-1 errors, the two ENS leads between which a Previous Runs product&apos;s day-1 lead falls.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and each product&apos;s name is written beside its last point. The dashed lines are GFS (native), IFS HRES</tspan><tspan x="0" dy="13">9 km, and ARPEGE. GFS (native) and IFS HRES 9 km each share a colour with a solid line, GFS (Open-Meteo) and IFS</tspan><tspan x="0" dy="13">0.25°. IFS HRES 9 km is IFS HRES (9 km, Open-Meteo): 00 UTC runs only, not checked against a native archive, and</tspan><tspan x="0" dy="13">its day-3 values after lead 90 hours are interpolated from 3-hourly steps. ICON-EU&apos;s day 0 is not drawn, because it</tspan><tspan x="0" dy="13">reads a run at most 3 hours old. Products fitted at fewer than three of days 0 to 3 are left out, and days 5 to 14</tspan><tspan x="0" dy="13">and IFS HRES 9 km&apos;s day 0 appear only in Figure 1.</tspan><tspan x="0" dy="13">Lead day: ENS, GFS (native), and IFS HRES 9 km read a 24-hour band of leads of the 00 UTC run that many days</tspan><tspan x="0" dy="13">earlier; other products read the freshest run at least that many days old. Every product except IFS HRES 9 km is</tspan><tspan x="0" dy="13">scored on exactly the same hours; IFS HRES 9 km is scored without the target days its archive lacks.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g></svg>

 3.5 3.5 0 1 1 7 0"/><path fill="#306bff" d="M89.5 500.3a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0M210.3 474a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-41.3a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M452 389.5a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0"/><path fill="#10c5f7" d="M217.5 421a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-39.6a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0m120.9-42.1a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#fc9700" d="M224.8 384.4a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-46a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-23.6a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0"/><path fill="#17e58f" d="M232 432.6a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-44.5a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0M473.7 343a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/><path fill="#009c75" d="M239.3 440a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.8-45a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0M481 349a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0"/><path fill="#bf4f04" d="M246.5 472.6a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0m120.9-34.5a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0m120.9-53.6a3.5 3.5 0 1 1-7 0 3.5 3.5 0 1 1 7 0"/></g><g aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10"><text fill="#306bff" transform="translate(496.7 409)">ENS mean</text><text fill="#292b2b" transform="translate(496.7 315.3)">ARPEGE Europe</text><text fill="#10c5f7" transform="translate(496.7 334)">GEFS mean</text><text fill="#fc9700" transform="translate(496.7 296.5)">GFS</text><text fill="#17e58f" transform="translate(496.7 352.8)">ICON global</text><text fill="#009c75" transform="translate(496.7 371.5)">ICON-EU</text><text fill="#bf4f04" transform="translate(496.7 390.3)">IFS 0.25°</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 11: Solar error rises with lead day for every forecast; IFS 0.25° cannot be told apart from the ENS mean at days 1 to 3, and every other product has a higher error than ENS'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 11: Solar error rises with lead day for every forecast; IFS 0.25°</tspan><tspan x="0" dy="20">cannot be told apart from the ENS mean at days 1 to 3, and every other</tspan><tspan x="0" dy="20">product has a higher error than ENS</tspan></text><text aria-label="Subtitle text 'Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity. Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean's day-0 and day-1 errors; the two ENS leads between which a Previous Runs product's day-1 lead falls. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn side by side, and each product's name is written beside its last point. ICON-EU's day 0 is not drawn here: it is Open-Meteo's freshest ICON-EU run, a lead of at most 3 hours, fitted later on a GPU. Products fitted at fewer than three of days 0 to 3, and days 5, 10, and 14, are left out; Figure 1 shows them. Every product is scored on exactly the same hours. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Mean absolute error of an XGBoost model given each forecast product at each lead day, as a percentage of capacity.</tspan><tspan x="0" dy="13">Primary XGBoost setting. Smaller is better. Shaded bands: the 95% intervals of the ENS mean&apos;s day-0 and day-1</tspan><tspan x="0" dy="13">errors; the two ENS leads between which a Previous Runs product&apos;s day-1 lead falls.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Products at one day are drawn</tspan><tspan x="0" dy="13">side by side, and each product&apos;s name is written beside its last point. ICON-EU&apos;s day 0 is not drawn here: it is</tspan><tspan x="0" dy="13">Open-Meteo&apos;s freshest ICON-EU run, a lead of at most 3 hours, fitted later on a GPU. Products fitted at fewer than</tspan><tspan x="0" dy="13">three of days 0 to 3, and days 5, 10, and 14, are left out; Figure 1 shows them. Every product is scored on exactly</tspan><tspan x="0" dy="13">the same hours.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g></svg>

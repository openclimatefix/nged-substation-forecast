le months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, August 2024 to September 2026. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>ICON-D2&apos;s mean absolute error minus UKV&apos;s. The UKV-at-80-m and hours-into-the-run rows were added after the first</tspan><tspan x="0" dy="13">run.</tspan><tspan x="0" dy="13">The post-upgrade row rests on 8 months, so its interval is likely too narrow.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, August 2024 to September 2026.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v66H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v66H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v44H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v44H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v132H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v132H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v66H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v66H0z"/></clipPath></defs></svg>

 transform="translate(225 491)"><path d="M186.3 20h32.8m1.8 40h69.6M64.3 100h65.9"/></g><g fill="#306bff" aria-hidden="true" class="mark-symbol role-mark concat_1_layer_4_marks" clip-path="url(#d)" transform="translate(225 491)"><path d="M207 20a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m53.7 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-156.2 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="end"><text transform="translate(218 528)">-3.72 [-4.06, -3.39]</text><text transform="translate(218 568)">-2.63 [-3.36, -1.94]</text><text transform="translate(218 608)">-5.81 [-6.54, -5.20]</text></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Quick-wins minus production: same corrected weather pipeline'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 469)">Quick-wins minus production: same corrected weather pipeline</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: Input fixes help solar; the quick-wins recipe gains more'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)">Figure 1: Input fixes help solar; the quick-wins recipe gains more</text><text aria-label="Subtitle text 'Forecasting models train on April 2024–June 2025; their forecasts are scored July 2025–June 2026. Primary training settings; all forecast leads. Panel 1 changes wind and radiation processing; panel 2 compares the whole quick-wins recipe with production. Comparisons match forecasts and observations; each row weights its meters and three training runs equally. A seed sets the random choices in a training run. The 31 series include demand, solar, wind, biofuel, and battery storage. Loss scores predicted power probabilities against observed power; lower is better. It uses pinball loss, which penalises predicted power thresholds above or below observed power, averaged over 19 probability levels and multiplied by two. Frozen capacity is each meter’s 99th percentile of absolute power over the full available history, including readings after the scored period. Dot: mean loss difference on matched forecasts. Line: 95% interval from repeated draws of whole months and one matched training seed. Negative loss differences favour the forecast named before minus in each panel. All rows are planned: written into the study plan before any result existed.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 38)"><tspan>Forecasting models train on April 2024–June 2025; their forecasts are scored July 2025–June 2026.</tspan><tspan x="0" dy="13">Primary training settings; all forecast leads.</tspan><tspan x="0" dy="13">Panel 1 changes wind and radiation processing; panel 2 compares the whole quick-wins recipe with production.</tspan><tspan x="0" dy="13">Comparisons match forecasts and observations; each row weights its meters and three training runs equally.</tspan><tspan x="0" dy="13">A seed sets the random choices in a training run.</tspan><tspan x="0" dy="13">The 31 series include demand, solar, wind, biofuel, and battery storage.</tspan><tspan x="0" dy="13">Loss scores predicted power probabilities against observed power; lower is better. It uses pinball loss, which</tspan><tspan x="0" dy="13">penalises predicted power thresholds above or below observed power, averaged over 19 probability levels and</tspan><tspan x="0" dy="13">multiplied by two.</tspan><tspan x="0" dy="13">Frozen capacity is each meter’s 99th percentile of absolute power over the full available history, including</tspan><tspan x="0" dy="13">readings after the scored period.</tspan><tspan x="0" dy="13">Dot: mean loss difference on matched forecasts. Line: 95% interval from repeated draws of whole months and one</tspan><tspan x="0" dy="13">matched training seed.</tspan><tspan x="0" dy="13">Negative loss differences favour the forecast named before minus in each panel.</tspan><tspan x="0" dy="13">All rows are planned: written into the study plan before any result existed.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v120H0z"/></clipPath></defs></svg>

ach step</tspan><tspan x="0" dy="20">from the row below</tspan></text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. Dot: the error of that variable set at the main XGBoost tuning setting. Hollow diamond: the error of the row below, which is this row's zero. G0 line: 95% interval of its own error. Every other line: 95% interval of the step from the row below, from resampling whole months, drawn from the row below's dot. Right column: the step in points of capacity (negative is a gain) and its interval. A step's interval says nothing about how uncertain the dot's position is. A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar radiation (ssrd), and air temperature (t2m). Each group adds to the one before. G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation. G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation. G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables. Only the G1 step is planned (P1); every other step is exploratory and uncorrected for multiple comparisons. A step depends on the order in which the groups were added.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF&apos;s reanalysis of past weather. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: the error of that variable set at the main XGBoost tuning setting. Hollow diamond: the</tspan><tspan x="0" dy="13">error of the row below, which is this row&apos;s zero.</tspan><tspan x="0" dy="13">G0 line: 95% interval of its own error. Every other line: 95% interval of the step</tspan><tspan x="0" dy="13">from the row below, from resampling whole months, drawn from the row below&apos;s dot.</tspan><tspan x="0" dy="13">Right column: the step in points of capacity (negative is a gain) and its interval.</tspan><tspan x="0" dy="13">A step&apos;s interval says nothing about how uncertain the dot&apos;s position is.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar</tspan><tspan x="0" dy="13">radiation (ssrd), and air temperature (t2m). Each group adds to the one before.</tspan><tspan x="0" dy="13">G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation.</tspan><tspan x="0" dy="13">G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation.</tspan><tspan x="0" dy="13">G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables.</tspan><tspan x="0" dy="13">Only the G1 step is planned (P1); every other step is exploratory and uncorrected for</tspan><tspan x="0" dy="13">multiple comparisons. A step depends on the order in which the groups were added.</tspan></text></g></g></svg>

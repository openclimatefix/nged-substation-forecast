xt><text transform="translate(224.2 302.5)">0.0</text><text transform="translate(272 302.5)">0.4</text><text transform="translate(319.8 302.5)">0.8</text><text transform="translate(367.6 302.5)">1.2</text></g><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(379.5 317.5)">Error difference (points of capacity; more negative is better)</text></g><g aria-label="Y-axis for a discrete scale with 4 values: Causal KF minus B0, Hindsight KF minus B0, Hindsight minus causal, ... without 2 plant-months" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(162.5 199)">Causal KF minus B0</text><text transform="translate(162.5 225)">Hindsight KF minus B0</text><text transform="translate(162.5 251)">Hindsight minus causal</text><text transform="translate(162.5 277)">... without 2 plant-months</text></g></g><path stroke="#292b2b" d="M223.7 183v104" aria-hidden="true" class="mark-rule role-mark concat_1_layer_0_marks"/><g aria-roledescription="text mark container" class="mark-text role-mark concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0; label: no difference" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="10" transform="translate(226.7 179)">no difference</text></g><g stroke-width="2.5" aria-hidden="true" class="mark-rule role-mark concat_1_layer_2_marks"><path stroke="#ff4901" d="M228.5 196h53.4m-25.6 26h118.5"/><path stroke="#306bff" d="M218 248h135.5M205 274h44.6"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_1_layer_3_marks"><path fill="#ff4901" d="M259 196a4.7 4.7 0 1 1-9.6 0 4.7 4.7 0 1 1 9.5 0m50.5 26a4.7 4.7 0 1 1-9.4 0 4.7 4.7 0 1 1 9.4 0"/><path fill="#306bff" d="M279 248a4.7 4.7 0 1 1-9.5 0 4.7 4.7 0 1 1 9.5 0m-47 26a4.7 4.7 0 1 1-9.4 0 4.7 4.7 0 1 1 9.4 0"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_4_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="11"><text transform="translate(408.9 199)">+0.255 [+0.040, +0.487]</text><text transform="translate(408.9 225)">+0.678 [+0.273, +1.265]</text><text transform="translate(408.9 251)">+0.423 [−0.048, +1.086]</text><text transform="translate(408.9 277)">+0.030 [−0.157, +0.216]</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 11: The hindsight Kalman filter did not beat the causal one, and the gap shrank from 0.42 to 0.03 points without two plant-months'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 11: The hindsight Kalman filter did not beat the causal one, and</tspan><tspan x="0" dy="20">the gap shrank from 0.42 to 0.03 points without two plant-months</tspan></text><text aria-label="Subtitle text 'Change in an XGBoost forecast's mean absolute error. The hindsight Kalman filter also reads the weeks after the day it estimates; the causal one reads only the days before. Dot: estimate. Line: 95% interval from resampling whole months. Rows 1 and 2 are against B0 (orange). Rows 3 and 4 are hindsight minus causal (blue), the second without the two plant-months with the largest gap. Exploratory and post hoc.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Change in an XGBoost forecast&apos;s mean absolute error. The hindsight Kalman filter also reads the weeks after the day</tspan><tspan x="0" dy="13">it estimates; the causal one reads only the days before. Dot: estimate. Line: 95% interval from resampling whole</tspan><tspan x="0" dy="13">months.</tspan><tspan x="0" dy="13">Rows 1 and 2 are against B0 (orange). Rows 3 and 4 are hindsight minus causal (blue), the second without the two</tspan><tspan x="0" dy="13">plant-months with the largest gap. Exploratory and post hoc.</tspan></text></g></g></svg>

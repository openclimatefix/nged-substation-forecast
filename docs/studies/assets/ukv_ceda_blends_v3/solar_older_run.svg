ss="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 10: For the six solar farms, the blend with UKV-CEDA&apos;s older run,</tspan><tspan x="0" dy="20">which starts 9 hours before ENS&apos;s run, gains less over padded ENS than</tspan><tspan x="0" dy="20">the planned blend, in the point estimates at every lead day and both</tspan><tspan x="0" dy="20">settings</tspan></text><text aria-label="Subtitle text 'Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the earlier start. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval from resampling whole months and a fitting seed. The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of</tspan><tspan x="0" dy="13">capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The</tspan><tspan x="0" dy="13">older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the</tspan><tspan x="0" dy="13">earlier start. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval from</tspan><tspan x="0" dy="13">resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">blend better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 3 values: Planned blend minus padded ENS, same rows, Older-run blend minus its padded ENS, Older-run blend minus its shuffled control" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 785)"><tspan>Planned blend minus padded</tspan><tspan x="0" dy="12">ENS, same rows</tspan></text><text transform="translate(219.5 835)"><tspan>Older-run blend minus its</tspan><tspan x="0" dy="12">padded ENS</tspan></text><text transform="translate(219.5 885)"><tspan>Older-run blend minus its</tspan><tspan x="0" dy="12">shuffled control</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_2_layer_0_marks"><path stroke="#292b2b" d="M562.5 752v160" aria-label="x: 0" aria-roledescription="rule mark"/></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_2_layer_1_marks" clip-path="url(#g)" transform="translate(225 752)"><path stroke="#306bff" d="M37.7 20H292"/><path stroke="#9cb6e1" d="M121.5 40h210.4"/><path stroke="#306bff" d="M168.2 70H347"/><path stroke="#9cb6e1" d="M221 90h125"/><path stroke="#306bff" d="M221 120h145.2"/><path stroke="#9cb6e1" d="M231.2 140h117.6"/></g><g fill="#306bff" aria-hidden="true" class="mark-symbol role-mark concat_2_layer_2_marks" clip-path="url(#h)" transform="translate(225 752)"><path d="M185.9 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m76.5 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m37.1 50a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g stroke="#9cb6e1" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_2_layer_3_marks" clip-path="url(#i)" transform="translate(225 752)"><path d="m232 40 4.2-4.2 4.2 4.2-4.2 4.2Zm47.3 50 4.2-4.2 4.2 4.2-4.2 4.2Zm6.2 50 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Lead day 3'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 744)">Lead day 3</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 11: For the three wind farms, the blend with UKV-CEDA's older run, which starts 9 hours before ENS's run, gains less over padded ENS than the planned blend, in the point estimates at every lead day and both settings'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 11: For the three wind farms, the blend with UKV-CEDA&apos;s older</tspan><tspan x="0" dy="20">run, which starts 9 hours before ENS&apos;s run, gains less over padded ENS</tspan><tspan x="0" dy="20">than the planned blend, in the point estimates at every lead day and</tspan><tspan x="0" dy="20">both settings</tspan></text><text aria-label="Subtitle text 'Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the earlier start. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval from resampling whole months and a fitting seed. The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>Post hoc. Difference in mean absolute error between two XGBoost models, first arm minus second, in points of</tspan><tspan x="0" dy="13">capacity; negative means the first forecasts better. All rows are the rows where the older run is present. The</tspan><tspan x="0" dy="13">older run leads 12 hours longer than the planned run, so the figure cannot separate the longer lead from the</tspan><tspan x="0" dy="13">earlier start. Filled dot: primary setting. Lighter hollow mark: sensitivity setting. Line: 95% interval from</tspan><tspan x="0" dy="13">resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

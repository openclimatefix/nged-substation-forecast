s for a discrete scale with 5 values: ssrd, in G0, ssrd, in G2, Cloud covers, in G2, ssrd, in G9, Cloud covers, in G9" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(216.5 1238)">ssrd, in G0</text><text transform="translate(216.5 1264)">ssrd, in G2</text><text transform="translate(216.5 1290)">Cloud covers, in G2</text><text transform="translate(216.5 1316)">ssrd, in G9</text><text transform="translate(216.5 1342)">Cloud covers, in G9</text></g></g><path stroke="#17e58f" stroke-width="1.5" d="M289.5 1235h3.4m316.7 52h24.9m-353.9-26h1.7m-22.8 52h2.7m125.8 26h22" aria-hidden="true" class="mark-rule role-mark concat_2_layer_0_marks"/><path fill="#17e58f" d="M295.7 1235a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m328.3 52a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m-338.2-26a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m-20.5 52a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m138.7 26a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0" aria-hidden="true" class="mark-symbol role-mark concat_2_layer_1_marks"/><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Downward solar radiation and the cloud covers, as variables are added'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(102 1215)">Downward solar radiation and the cloud covers, as variables are added</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12b: XGBoost importance of the full set, CAMS clearness index'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 12b: XGBoost importance of the full set, CAMS clearness index</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. Each XGBoost model was refitted on different blocks of months and with different random starts. Dot: mean over the refits. Line: their range. clearness_index: ERA5 solar radiation divided by the sun's top-of-atmosphere flux (an input, not the CAMS target). Dashed rule, first panel: the largest shuffled copy's share (0.2%). Share of total gain: how much of the model's fit a column accounts for. The first two panels use a log scale: each gridline is 10 times the one before, and a share below 0.05% is drawn at 0.05%. Shuffled copies are the same columns shuffled across hours, so they show the share that noise alone earns. Gain is measured on the training data and splits credit between correlated columns. Descriptive only: the planned contrasts decide whether a variable helps.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six NGED solar farms, daylight hours, September 2019 to June 2026. ERA5: ECMWF&apos;s reanalysis of past weather. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Each XGBoost model was refitted on different blocks of months and with different</tspan><tspan x="0" dy="13">random starts. Dot: mean over the refits. Line: their range.</tspan><tspan x="0" dy="13">clearness_index: ERA5 solar radiation divided by the sun&apos;s top-of-atmosphere flux (an</tspan><tspan x="0" dy="13">input, not the CAMS target).</tspan><tspan x="0" dy="13">Dashed rule, first panel: the largest shuffled copy&apos;s share (0.2%).</tspan><tspan x="0" dy="13">Share of total gain: how much of the model&apos;s fit a column accounts for.</tspan><tspan x="0" dy="13">The first two panels use a log scale: each gridline is 10 times the one before, and a</tspan><tspan x="0" dy="13">share below 0.05% is drawn at 0.05%.</tspan><tspan x="0" dy="13">Shuffled copies are the same columns shuffled across hours, so they show the share</tspan><tspan x="0" dy="13">that noise alone earns. Gain is measured on the training data and splits credit</tspan><tspan x="0" dy="13">between correlated columns.</tspan><tspan x="0" dy="13">Descriptive only: the planned contrasts decide whether a variable helps.</tspan></text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="375" class="marks" viewBox="0 0 680 375"><path fill="#fffbf5" d="M0 0h680v375H0z"/><g fill="none" stroke-miterlimit="10" aria-roledescription="group mark container" class="mark-group role-frame root"><path d="M225 205h450z" aria-hidden="true" class="background"/><g aria-roledescription="group mark container" class="mark-group role-scope concat_0_group"><path fill="#fffbf5" d="M225 205h450v120H225Z" aria-hidden="true" class="background"/><g aria-hidden="true" class="mark-group role-axis"><path stroke="#eaeaea" d="M247.5 325.5v-120m46 120v-120m45 120v-120m45 120v-120m45 120v-120m45 120v-120m45 120v-120m45 120v-120m45 120v-120m45 120v-120" class="mark-rule role-axis-grid" pointer-events="none"/></g><g aria-label="X-axis titled 'Difference in mean absolute error (points of capacity; more negative means first product better)' for a linear scale with values from −0.5 to 1.5" aria-roledescription="axis" class="mark-group role-axis" pointer-events="none"><path stroke="#292b2b" d="M247.5 325.5v5m46-5v5m45-5v5m45-5v5m45-5v5m45-5v5m45-5v5m45-5v5m45-5v5m45-5v5" class="mark-rule role-axis-tick"/><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" text-anchor="middle"><text transform="translate(248 340.5)">−0.4</text><text transform="translate(293 340.5)">−0.2</text><text transform="translate(338 340.5)">0</text><text transform="translate(383 340.5)">0.2</text><text transform="translate(428 340.5)">0.4</text><text transform="translate(473 340.5)">0.6</text><text transform="translate(518 340.5)">0.8</text><text transform="translate(563 340.5)">1</text><text transform="translate(608 340.5)">1.2</text><text transform="translate(653 340.5)">1.4</text></g><path stroke="#292b2b" d="M225.5 325.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(450.5 355.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">first product better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 3 values: ECMWF-IFS-HRES − ICON-EU (8.29% vs 8.38%), KNMI HARMONIE-AROME − ICON-EU (8.94% vs 8.38%), DMI HARMONIE-AROME − ICON-D2 (8.83% vs 7.81%)" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 228)"><tspan>ECMWF-IFS-HRES − ICON-EU</tspan><tspan x="0" dy="12">(8.29% vs 8.38%)</tspan></text><text transform="translate(219.5 268)"><tspan>KNMI HARMONIE-AROME − ICON-EU</tspan><tspan x="0" dy="12">(8.94% vs 8.38%)</tspan></text><text transform="translate(219.5 308)"><tspan>DMI HARMONIE-AROME − ICON-D2</tspan><tspan x="0" dy="12">(8.83% vs 7.81%)</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_layer_0_marks"><path stroke="#292b2b" d="M337.5 205v120" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(341.5 199)">no difference</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_layer_2_marks"><text fill="#292b2b" aria-label="x: −0.5" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 199)">← first product better</text></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_layer_3_marks" clip-path="url(#a)" transform="translate(225 205)"><path d="M28.6 20h122.6m33.1 40h97.2m-4.7 40h120"/></g><g fill="#306bff" aria-hidden="true" class="mark-symbol role-mark concat_0_layer_4_marks" clip-path="url(#b)" transform="translate(225 205)"><path d="M96 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m145.6 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m103.7 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'The three planned contrasts'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 183)">The three planned contrasts</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 16: HARMONIE-AROME, as Open-Meteo serves it from DMI's and KNMI's feeds, trails the ICON model of similar grid spacing; IFS-HRES against ICON-EU is not resolved'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 16: HARMONIE-AROME, as Open-Meteo serves it from DMI&apos;s and KNMI&apos;s</tspan><tspan x="0" dy="20">feeds, trails the ICON model of similar grid spacing; IFS-HRES against</tspan><tspan x="0" dy="20">ICON-EU is not resolved</tspan></text><text aria-label="Subtitle text 'The three contrasts named in the study plan before any result existed. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, November 2024 to August 2026. DMI's feed updates every 3 hours, as ICON-D2 does, so the two sit at the same served lead on every row. KNMI's feed is documented as hourly but not measured here, so its contrast mixes weather-model skill with lead. All rows are planned: written into the study plan before any result existed.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>The three contrasts named in the study plan before any result existed.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, November 2024 to August 2026.</tspan><tspan x="0" dy="13">DMI&apos;s feed updates every 3 hours, as ICON-D2 does, so the two sit at the same served lead on every row. KNMI&apos;s feed</tspan><tspan x="0" dy="13">is documented as hourly but not measured here, so its contrast mixes weather-model skill with lead.</tspan><tspan x="0" dy="13">All rows are planned: written into the study plan before any result existed.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v120H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v120H0z"/></clipPath></defs></svg>

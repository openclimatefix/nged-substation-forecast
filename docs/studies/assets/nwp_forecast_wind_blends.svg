, P4b control: ENS + shuffled ICON-EU + IFS 0.25° minus ENS mean day 1" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text font-weight="bold" transform="translate(219.5 602)"><tspan>P4a blend: ENS + ICON-EU + IFS</tspan><tspan x="0" dy="12">0.25° minus ENS mean day 1</tspan><tspan x="0" dy="12">(planned)</tspan></text><text font-weight="bold" transform="translate(219.5 652)"><tspan>P4b blend: ENS + ICON-EU + IFS</tspan><tspan x="0" dy="12">0.25° minus ENS mean day 1</tspan><tspan x="0" dy="12">(planned)</tspan></text><text font-weight="bold" transform="translate(219.5 702)"><tspan>P4a blend minus its own</tspan><tspan x="0" dy="12">control (planned)</tspan></text><text font-weight="bold" transform="translate(219.5 752)"><tspan>P4b blend minus its own</tspan><tspan x="0" dy="12">control (planned)</tspan></text><text transform="translate(219.5 802)"><tspan>P4a control: ENS + shuffled</tspan><tspan x="0" dy="12">ICON-EU + IFS 0.25° minus ENS</tspan><tspan x="0" dy="12">mean day 1</tspan></text><text transform="translate(219.5 852)"><tspan>P4b control: ENS + shuffled</tspan><tspan x="0" dy="12">ICON-EU + IFS 0.25° minus ENS</tspan><tspan x="0" dy="12">mean day 1</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_1_concat_1_layer_0_marks"><path stroke="#292b2b" d="M600 569v310" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_1_concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="end" transform="translate(596 563)">same error</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_1_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −1" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 563)">← first product better</text></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_1_concat_1_layer_3_marks" clip-path="url(#c)" transform="translate(225 569)"><path stroke="#ff4901" d="M55.9 20h142"/><path stroke="#306bff" d="M69 40h125.6"/><path stroke="#ff4901" d="M269.3 70h73"/><path stroke="#306bff" d="M258.4 90H342"/><path stroke="#ff4901" d="M71.2 120h154.5"/><path stroke="#306bff" d="M61.1 140h145.1"/><path stroke="#ff4901" d="M275.3 170h90"/><path stroke="#306bff" d="M256.1 190h86.3"/><path stroke="#ff4901" d="M318.4 220H387"/><path stroke="#306bff" d="M341.3 240H399"/><path stroke="#ff4901" d="M322.9 270h70"/><path stroke="#306bff" d="M339.8 290h61.4"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_1_concat_1_layer_4_marks" clip-path="url(#d)" transform="translate(225 569)"><path fill="#ff4901" d="M133.2 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M137.3 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M310.2 70a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M305.3 90a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M152.7 120a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M138 140a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M323.7 170a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M305 190a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M359.7 220a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M378.8 240a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M365.7 270a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M379.6 290a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Paired differences: blend minus ENS alone, blend minus its own control'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 547)">Paired differences: blend minus ENS alone, blend minus its own control</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 12: For wind power a blend of ENS, ICON-EU and IFS 0.25° lowers the error by 0.66 points at an optimistic lead and 0.18 points at a conservative lead, and its control does not'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 12: For wind power a blend of ENS, ICON-EU and IFS 0.25° lowers</tspan><tspan x="0" dy="20">the error by 0.66 points at an optimistic lead and 0.18 points at a</tspan><tspan x="0" dy="20">conservative lead, and its control does not</tspan></text><text aria-label="Subtitle text 'XGBoost models given the ENS mean alone, or ENS plus two more products. A control has the same columns as its blend, with the two other products' weather shuffled among hours of the same site, month and hour of day, so it carries no real information from them. Points of capacity; negative means the first forecast in a row is better. P4a uses the day-1 forecasts of ICON-EU and IFS 0.25°, P4b their day-2 forecasts. Every product is scored on exactly the same hours. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>XGBoost models given the ENS mean alone, or ENS plus two more products. A control has the same columns as its</tspan><tspan x="0" dy="13">blend, with the two other products&apos; weather shuffled among hours of the same site, month and hour of day, so it</tspan><tspan x="0" dy="13">carries no real information from them. Points of capacity; negative means the first forecast in a row is better.</tspan><tspan x="0" dy="13">P4a uses the day-1 forecasts of ICON-EU and IFS 0.25°, P4b their day-2 forecasts. Every product is scored on</tspan><tspan x="0" dy="13">exactly the same hours. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v220H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v220H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v310H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v310H0z"/></clipPath></defs></svg>

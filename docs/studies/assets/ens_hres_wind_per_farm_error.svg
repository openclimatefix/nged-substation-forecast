e(5 58)"><tspan>Each product&apos;s own mean absolute error at one farm, best first. ICON global is left out, because its served wind</tspan><tspan x="0" dy="13">steps at one farm and its error there would show which.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v156H0z"/></clipPath></defs></svg>

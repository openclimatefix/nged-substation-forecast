-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M61 950.3h118v12.5H61Z" aria-hidden="true" class="background"/><path fill="#17e58f" stroke="#17e58f" stroke-width="1.5" d="M72 956.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(77 959.3)">F2 (cloud layers)</text><path d="M191 950.3h82v12.5h-82Z" aria-hidden="true" class="background"/><path fill="#ff4901" stroke="#ff4901" stroke-width="1.5" d="M202 956.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(207 959.3)">F6 (all 20)</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 8: Change in error by sky regime, by season, and by hour of day'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 8: Change in error by sky regime, by season, and by hour of day</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF's forecast via Open-Meteo. CAMS: satellite irradiance service. Dot: estimate. Line: 95% interval from resampling whole months. Dashed rule: no difference. Each row of the first two panels is one group of hours, pooled over lead days 1 to 3, and each colour is the error with a variable set minus the error with F0, the minimal set. Error: mean absolute error. Third panel: the line is the error with F6 minus the error with F0, as a percentage of F0's error, and the band is its 95% interval. Below the dashed line is a gain. Sky regime from ERA5's total cloud cover: clear below 0.2, overcast from 0.8, broken between. The thresholds were fixed before any result. A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar. F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow, precipitation, pressure, wind, gusts. IFS: ECMWF's 9 km forecast, 00 UTC run, read at a lead day. Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six NGED solar farms, daylight hours, March 2024 to April 2026. IFS: ECMWF&apos;s forecast via Open-Meteo. CAMS:</tspan><tspan x="0" dy="13">satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Dashed rule: no difference. Each row of the first</tspan><tspan x="0" dy="13">two panels is one group of hours, pooled over lead days 1 to 3, and each colour is the error with a variable set</tspan><tspan x="0" dy="13">minus the error with F0, the minimal set. Error: mean absolute error.</tspan><tspan x="0" dy="13">Third panel: the line is the error with F6 minus the error with F0, as a percentage of F0&apos;s error, and the band is</tspan><tspan x="0" dy="13">its 95% interval. Below the dashed line is a gain.</tspan><tspan x="0" dy="13">Sky regime from ERA5&apos;s total cloud cover: clear below 0.2, overcast from 0.8, broken between. The thresholds were</tspan><tspan x="0" dy="13">fixed before any result.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given, beside sun position and calendar.</tspan><tspan x="0" dy="13">F0: IFS radiation and air temperature. Each set adds to the one before. F1: total cloud cover. F2: low, mid, and</tspan><tspan x="0" dy="13">high cloud cover. F3: direct radiation. F4: dew point, column water vapour, boundary-layer height. F5: convective</tspan><tspan x="0" dy="13">energy (CAPE), convective inhibition, visibility. F6 (all 20 IFS variables): surface temperature, snow,</tspan><tspan x="0" dy="13">precipitation, pressure, wind, gusts.</tspan><tspan x="0" dy="13">IFS: ECMWF&apos;s 9 km forecast, 00 UTC run, read at a lead day.</tspan><tspan x="0" dy="13">Lead day L: the forecast was issued L days before the day it describes, so lead day 1 is the morning before.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

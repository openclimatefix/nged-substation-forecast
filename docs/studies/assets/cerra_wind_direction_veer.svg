ize="14" pointer-events="none" transform="translate(225 606)">Positive controls: a veer effect injected into the real target</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 2: Beyond direction at 100 m, more heights or an explicit veer changed the error by 0.011 points or less at the primary setting, and raw directions caught only the 40% veer injection'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 2: Beyond direction at 100 m, more heights or an explicit veer</tspan><tspan x="0" dy="20">changed the error by 0.011 points or less at the primary setting, and</tspan><tspan x="0" dy="20">raw directions caught only the 40% veer injection</tspan></text><text aria-label="Subtitle text 'Each row: the first set of columns minus the second set, on the same rows. Dot: estimate. Line: 95% interval from resampling whole months. Hollow triangle: the second hyperparameter setting. Differences are in points of each wind farm's capacity. Dashed line at +0.05: about the rise in error from swapping 2 inert padding columns for 2 uninformative columns (+0.040 to +0.060 in the negative controls). The injected veer effect cuts power by 40% (0.69 points over all rows) or by 10% (0.17 points) where the wind turns clockwise with height by 10 degrees or more. Three wind farms, September 2019 to June 2026, on CERRA's 3-hourly analysis. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Each row: the first set of columns minus the second set, on the same rows.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Hollow triangle: the second hyperparameter setting.</tspan><tspan x="0" dy="13">Differences are in points of each wind farm&apos;s capacity.</tspan><tspan x="0" 
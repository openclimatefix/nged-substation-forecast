target</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 2: Direction at several heights changed the error by less than the pipeline's noise floor'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 2: Direction at several heights changed the error by less than</tspan><tspan x="0" dy="20">the pipeline&apos;s noise floor</tspan></text><text aria-label="Subtitle text 'Each row: the first set of columns minus the second set, on the same rows. Dot: estimate. Line: 95% interval from resampling whole months. Hollow triangle: the second hyperparameter setting. Differences are in points of each wind farm's capacity. Shaded band: plus and minus 0.05 points, the change the negative controls produced from columns that carry no information. The injected veer effect cuts power by 40% (0.69 points over all rows) or by 10% (0.17 points) where the wind turns clockwise with height by 10 degrees or more. Three wind farms, September 2019 to June 2026, on CERRA's 3-hourly analysis. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each row: the first set of columns minus the second set, on the same rows.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Hollow triangle: the second hyperparameter setting.</tspan><tspan x="0" dy="13">Differences are in points of each wind farm&apos;s capacity.</tspan><tspan x="0" dy="13">Shaded band: plus and minus 0.05 points, the change the negative controls produced from columns that carry no</tspan><tspan x="0" dy="13">information.</tspan><tspan x="0" dy="13">The injected veer effect cuts power by 40% (0.69 points over all rows) or by 10% (0.17 points) where the wind turns</tspan><tspan x="0" dy="13">clockwise with height by 10 degrees or more.</tspan><tspan x="0" dy="13">Three wind farms, September 2019 to June 2026, on CERRA&apos;s 3-hourly analysis.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v308H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v308H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v308H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v308H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v264H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v264H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v264H0z"/></clipPath></defs></svg>

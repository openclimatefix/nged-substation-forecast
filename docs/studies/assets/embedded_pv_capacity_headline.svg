city=".3"/><g stroke-width="2.5" aria-hidden="true" class="mark-rule role-mark concat_0_layer_2_marks"><path stroke="#306bff" d="M360.5 308H409m43.7-78h59.4m-74.7 26h67.3m-45.3-52h80.2M322.7 334h35.6"/><path stroke="#b701ff" d="M346.1 282h88.1"/></g><g stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_0_layer_3_marks"><path fill="#306bff" stroke="#306bff" d="M392 308a4.7 4.7 0 1 1-9.6 0 4.7 4.7 0 1 1 9.5 0m94.4-78a4.7 4.7 0 1 1-9.5 0 4.7 4.7 0 1 1 9.5 0m-6.3 26a4.7 4.7 0 1 1-9.5 0 4.7 4.7 0 1 1 9.5 0m29.5-52a4.7 4.7 0 1 1-9.4 0 4.7 4.7 0 1 1 9.4 0M345.2 334a4.7 4.7 0 1 1-9.5 0 4.7 4.7 0 1 1 9.5 0"/><path fill="#fff" stroke="#b701ff" d="M396 282a4.7 4.7 0 1 1-9.4 0 4.7 4.7 0 1 1 9.5 0"/></g><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_0_layer_4_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" transform="translate(377 363)">range over seven load shapes; no capacity</text></g><g aria-label="Symbol legend titled 'Status in 2025/26' for fill color and stroke color with 3 values: clean, low-power, flagged" aria-roledescription="legend" class="mark-group role-legend"><path d="M138 423h199v29H138Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M138 439.3h46v12.4h-46Z" aria-hidden="true" class="background"/><path fill="#306bff" stroke="#306bff" stroke-width="1.5" d="M139 440.3h10v10h-10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(154 448.3)">clean</text><path d="M196 439.3h70v12.4h-70Z" aria-hidden="true" class="background"/><path fill="#b701ff" stroke="#b701ff" stroke-width="1.5" d="M197 440.3h10v10h-10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(212 448.3)">low-power</text><path d="M278 439.3h58v12.4h-58Z" aria-hidden="true" class="background"/><path fill="#ff4901" stroke="#ff4901" stroke-width="1.5" d="M279 440.3h10v10h-10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(294 448.3)">flagged</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(138 432)">Status in 2025/26</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: Each of the six Primary substations we can size has 2.5 to 4.5 MW of embedded solar'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5.6 19)"><tspan>Figure 1: Each of the six Primary substations we can size has 2.5 to 4.5</tspan><tspan x="0" dy="20">MW of embedded solar</tspan></text><text aria-label="Subtitle text 'Capacity C is the 99th percentile of the half-hourly AC output of the embedded solar, in MW, over the season-year 2025/26 (September 2025 to August 2026). A Primary substation is a substation that steps power down to the local distribution network. Dot: C. Dark line: 95% interval from 200 resamples of the year's days, drawn in blocks of seven consecutive days. Pale bar: C divided by one plus the typical error (median of the undetected resamples) when a day-long load of a quarter of the true capacity (half, for a hollow dot) goes undetected. Larger loads would pull the true capacity lower. Hollow purple dot: the test flags a day-long load of half the capacity in under 80% of resamples, so a large such load could go unnoticed. Orange bar (Kirton): the test found a demand that rises on cloudy days, so no capacity is given; the bar is the range of capacities across seven assumed demand shapes.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.6 58)"><tspan>Capacity C is the 99th percentile of the half-hourly AC output of the embedded solar, in MW, over the season-year</tspan><tspan x="0" dy="13">2025/26 (September 2025 to August 2026). A Primary substation is a substation that steps power down to the local</tspan><tspan x="0" dy="13">distribution network.</tspan><tspan x="0" dy="13">Dot: C. Dark line: 95% interval from 200 resamples of the year&apos;s days, drawn in blocks of seven consecutive days.</tspan><tspan x="0" dy="13">Pale bar: C divided by one plus the typical error (median of the undetected resamples) when a day-long load of a</tspan><tspan x="0" dy="13">quarter of the true capacity (half, for a hollow dot) goes undetected. Larger loads would pull the true capacity</tspan><tspan x="0" dy="13">lower.</tspan><tspan x="0" dy="13">Hollow purple dot: the test flags a day-long load of half the capacity in under 80% of resamples, so a large such</tspan><tspan x="0" dy="13">load could go unnoticed. Orange bar (Kirton): the test found a demand that rises on cloudy days, so no capacity is</tspan><tspan x="0" dy="13">given; the bar is the range of capacities across seven assumed demand shapes.</tspan></text></g></g></svg>

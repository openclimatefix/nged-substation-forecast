ut</tspan></text><text aria-label="Subtitle text 'Exploratory, one site. Four 3-month blocks of one bulk supply point's flow. Dashed line in the upper panel: the detection threshold. Dashed line in the lower panel: the true added power. In June to August the detection statistic rises, but the matched null (0 copies) is flagged there too.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Exploratory, one site. Four 3-month blocks of one bulk supply point&apos;s flow. Dashed line in the upper panel: the</tspan><tspan x="0" dy="13">detection threshold.</tspan><tspan x="0" dy="13">Dashed line in the lower panel: the true added power. In June to August the detection statistic rises, but the</tspan><tspan x="0" dy="13">matched null (0 copies) is flagged there too.</tspan></text></g></g></svg>

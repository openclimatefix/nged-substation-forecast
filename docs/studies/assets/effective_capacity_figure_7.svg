nths and added 0.4 points elsewhere'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 7: The Kalman filter cut error by about 5 points in 3 low plant-</tspan><tspan x="0" dy="20">months and added 0.4 points elsewhere</tspan></text><text aria-label="Subtitle text 'Mean change in an XGBoost forecast's absolute error against B0, weighted by rows, in the three plant-months in which one plant produced about two thirds to three quarters of its neighbours' output, and in every other row. Post hoc. No interval: three plant-months cannot be resampled. KF: the Kalman filter (orange). HYST: hold at static (purple).'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Mean change in an XGBoost forecast&apos;s absolute error against B0, weighted by rows, in the three plant-months in</tspan><tspan x="0" dy="13">which one plant produced about two thirds to three quarters of its neighbours&apos; output, and in every other row. Post</tspan><tspan x="0" dy="13">hoc.</tspan><tspan x="0" dy="13">No interval: three plant-months cannot be resampled. KF: the Kalman filter (orange). HYST: hold at static (purple).</tspan></text></g></g></svg>

4.2 4.2 0 1 1 8.4 0m1.7 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m6.8 40a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0m2.2 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m5.9 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m13.2 80a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m13.8 120 4.2-4.2 4.2 4.2-4.2 4.2Zm41 80 4.2-4.2 4.2 4.2-4.2 4.2Zm46.9 120 4.2-4.2 4.2 4.2-4.2 4.2Zm10.9 40 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Wind'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 1327)">Wind</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: An XGBoost model given several weather products has the lowest error of all the single products and blends tested'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: An XGBoost model given several weather products has the lowest</tspan><tspan x="0" dy="20">error of all the single products and blends tested</tspan></text><text aria-label="Subtitle text 'Each row is an XGBoost model given the named product or blend of products, at the main XGBoost settings, ranked best first. Enriched: each product is also given the hours either side, and CAMS its beam split. The best row a live service anywhere in Great Britain can read: solar, UKV and ICON-EU, enriched (7.55%); wind, UKV and ICON-EU, enriched (5.98%). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to September 2026. The intervals are wide mainly because every row's error rises and falls together from month to month. Figure 2 compares two XGBoost models on the same months, which cancels that shared swing, so two rows can overlap here and still differ significantly there.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each row is an XGBoost model given the named product or blend of products, at the main XGBoost settings, ranked</tspan><tspan x="0" dy="13">best first. Enriched: each product is also given the hours either side, and CAMS its beam split.</tspan><tspan x="0" dy="13">The best row a live service anywhere in Great Britain can read: solar, UKV and ICON-EU, enriched (7.55%); wind, UKV</tspan><tspan x="0" dy="13">and ICON-EU, enriched (5.98%).</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to</tspan><tspan x="0" dy="13">September 2026.</tspan><tspan x="0" dy="13">The intervals are wide mainly because every row&apos;s error rises and falls together from month to month. Figure 2</tspan><tspan x="0" dy="13">compares two XGBoost models on the same months, which cancels that shared swing, so two rows can overlap here and</tspan><tspan x="0" dy="13">still differ significantly there.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v960H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v960H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v960H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v720H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v720H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v720H0z"/></clipPath></defs></svg>

.4 920H305"/><path stroke="#ff4901" d="M157.5 1000h160.2m-143.3 80h149.1"/><path stroke="#306bff" d="M204.7 1160h132.4m-122 80h132.1"/><path stroke="#ff4901" d="M209.3 1320h189.2m-171.3 80h188.1"/></g><g fill="#ff4901" aria-hidden="true" class="mark-symbol role-mark concat_1_layer_1_marks" clip-path="url(#e)" transform="translate(225 3277)"><path d="M152.2 440a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M172 600a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0m-2.1 80 4.1-4.2 4.2 4.2-4.2 4.2Zm43.1 160 4.2-4.2 4.2 4.2-4.2 4.2Zm15.9 160 4.2-4.2 4.2 4.2-4.2 4.2Zm12.6 80 4.2-4.2 4.2 4.2-4.2 4.2Zm51.9 240 4.2-4.2 4.2 4.2-4.2 4.2Zm17.6 80 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_1_layer_2_marks" clip-path="url(#f)" transform="translate(225 3277)"><path d="M130.5 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m1.7 80a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m6.8 80a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0m2.2 80a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m5.9 80a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m13.2 160a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m13.8 240 4.2-4.2 4.2 4.2-4.2 4.2Zm41 160 4.2-4.2 4.2 4.2-4.2 4.2Zm46.9 240 4.2-4.2 4.2 4.2-4.2 4.2Zm10.9 80 4.2-4.2 4.2 4.2-4.2 4.2Z"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Wind'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 3270)">Wind</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: An XGBoost model given several weather products has the lowest error of all the single products and blends tested'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: An XGBoost model given several weather products has the lowest</tspan><tspan x="0" dy="20">error of all the single products and blends tested</tspan></text><text aria-label="Subtitle text 'Each row is an XGBoost model given the named product or blend of products, at the main XGBoost settings, ranked best first. Enriched: each product is also given the hours either side, and CAMS its beam split. The best row a live service anywhere in Great Britain can read: solar, UKV and ICON-EU, enriched (7.55%); wind, UKV and ICON-EU, enriched (5.98%). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to September 2026. The intervals are wide mainly because every row's error rises and falls together from month to month. Figure 2 compares two XGBoost models on the same months, which cancels that shared swing, so two rows can overlap here and still differ significantly there.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each row is an XGBoost model given the named product or blend of products, at the main XGBoost settings, ranked</tspan><tspan x="0" dy="13">best first. Enriched: each product is also given the hours either side, and CAMS its beam split.</tspan><tspan x="0" dy="13">The best row a live service anywhere in Great Britain can read: solar, UKV and ICON-EU, enriched (7.55%); wind, UKV</tspan><tspan x="0" dy="13">and ICON-EU, enriched (5.98%).</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to September 2026. Three wind farms in Lincolnshire, August 2024 to</tspan><tspan x="0" dy="13">September 2026.</tspan><tspan x="0" dy="13">The intervals are wide mainly because every row&apos;s error rises and falls together from month to month. Figure 2</tspan><tspan x="0" dy="13">compares two XGBoost models on the same months, which cancels that shared swing, so two rows can overlap here and</tspan><tspan x="0" dy="13">still differ significantly there.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v2880H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v2880H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v2880H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v1440H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v1440H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v1440H0z"/></clipPath></defs></svg>

 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0" opacity=".9"/><path fill="#306bff" d="m607 377.2 4.2-4.2 4.2 4.2-4.2 4.2Z" opacity=".9"/><path fill="#ff4901" d="M604.2 382.6h8.4v8.4h-8.4Z" opacity=".9"/><path fill="#17e58f" d="m621.5 392.8-4.2 7.2h8.4Z" opacity=".9"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Primary setting'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="18" pointer-events="none" transform="translate(68 206)">Primary setting</text></g></g><g aria-label="Symbol legend for shape and fill color with 4 values: Padded ENS mean, ENS mean + UKV-CEDA, Shuffled, seed 0, Shuffled, seed 1000" aria-roledescription="legend" class="mark-group role-legend"><path d="M68 456h255v29H68Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M68 456.3h112v12.4H68Z" aria-hidden="true" class="background"/><path fill="gray" d="M79 462.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(84 465.3)">Padded ENS mean</text><path d="M192 456.3h130v12.4H192Z" aria-hidden="true" class="background"/><path fill="#306bff" d="m193 462.3 5-5 5 5-5 5Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(208 465.3)">ENS mean + UKV-CEDA</text><path d="M68 472h112v12.5H68Z" aria-hidden="true" class="background"/><path fill="#ff4901" d="M69 473h10v10H69Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(84 481)">Shuffled, seed 0</text><path d="M192 472h130v11.8H192Z" aria-hidden="true" class="background"/><path fill="#17e58f" d="m198 473.7-5 8.6h10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(208 481)">Shuffled, seed 1000</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 5: For the six solar farms, an XGBoost model given ENS's mean alone has a mean absolute error of 8.8% of capacity at lead day 1 and 11.7% at lead day 4, and the four models differ by at most 0.19 points at any lead day'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 5: For the six solar farms, an XGBoost model given ENS&apos;s mean</tspan><tspan x="0" dy="20">alone has a mean absolute error of 8.8% of capacity at lead day 1 and</tspan><tspan x="0" dy="20">11.7% at lead day 4, and the four models differ by at most 0.19 points</tspan><tspan x="0" dy="20">at any lead day</tspan></text><text aria-label="Subtitle text 'Mean absolute error of each XGBoost model at the primary setting, in percent of capacity, one row per lead day and one mark per model. Shuffled is the ENS mean plus UKV-CEDA's columns shuffled within generator, year-month, and hour of day, under the seed named. The tables on this page give both settings. The marks carry no interval: every model's error rises and falls together from month to month, which makes an interval on one model's level far wider than the gaps between models. The paired intervals on those gaps are in the headline figure. The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 98)"><tspan>Mean absolute error of each XGBoost model at the primary setting, in percent of capacity, one row per lead day and</tspan><tspan x="0" dy="13">one mark per model. Shuffled is the ENS mean plus UKV-CEDA&apos;s columns shuffled within generator, year-month, and</tspan><tspan x="0" dy="13">hour of day, under the seed named. The tables on this page give both settings. The marks carry no interval: every</tspan><tspan x="0" dy="13">model&apos;s error rises and falls together from month to month, which makes an interval on one model&apos;s level far wider</tspan><tspan x="0" dy="13">than the gaps between models. The paired intervals on those gaps are in the headline figure.</tspan><tspan x="0" dy="13">The six solar farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g></svg>

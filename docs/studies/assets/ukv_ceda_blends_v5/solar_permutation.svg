2.5Zm-18.2 0h2.5v34h-2.5Zm80.8 0h2.5v34h-2.5Z" opacity=".7"/></g><path fill="#306bff" d="m328.9 574 7.4-7.4 7.4 7.4-7.4 7.4Z" aria-hidden="true" class="mark-symbol role-mark concat_4_layer_1_marks" opacity=".7"/><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_4_layer_2_marks"><path stroke="#292b2b" stroke-dasharray="4,3" d="M408.8 552v44" aria-label="x: 0" aria-roledescription="rule mark"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Lead day 4: P1 -0.054, rank 6 of 18, p-value 0.333'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="18" pointer-events="none" transform="translate(8 543)">Lead day 4: P1 -0.054, rank 6 of 18, p-value 0.333</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 11: For six solar farms, the planned blend's gain over padded ENS is larger than all 17 shuffled controls' at days 1, 2, and 3'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5.5 19)"><tspan>Figure 11: For six solar farms, the planned blend&apos;s gain over padded ENS</tspan><tspan x="0" dy="20">is larger than all 17 shuffled controls&apos; at days 1, 2, and 3</tspan></text><text aria-label="Subtitle text 'Each grey tick is one shuffled control: UKV-CEDA's columns shuffled within generator, year-month, and hour of day under its own seed, minus padded ENS, as a difference in mean absolute error in points of capacity at the primary setting. The blue diamond is the planned blend minus padded ENS. The dashed line is zero: no difference from padded ENS. The p-value is the share of the 18 values (17 controls and P1) at or below P1, so with 17 controls it cannot go below 0.056. Rank 1 is the lowest error. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.5 58)"><tspan>Each grey tick is one shuffled control: UKV-CEDA&apos;s columns shuffled within generator, year-month, and hour of day</tspan><tspan x="0" dy="13">under its own seed, minus padded ENS, as a difference in mean absolute error in points of capacity at the primary</tspan><tspan x="0" dy="13">setting. The blue diamond is the planned blend minus padded ENS. The dashed line is zero: no difference from padded</tspan><tspan x="0" dy="13">ENS.</tspan><tspan x="0" dy="13">The p-value is the share of the 18 values (17 controls and P1) at or below P1, so with 17 controls it cannot go</tspan><tspan x="0" dy="13">below 0.056. Rank 1 is the lowest error. Every error is a fraction of the generator&apos;s own capacity, taken as its</tspan><tspan x="0" dy="13">99th percentile of metered output.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g></svg>

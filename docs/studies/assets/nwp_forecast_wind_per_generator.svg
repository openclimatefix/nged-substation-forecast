ext-anchor="middle" transform="translate(450.5 434.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">first product better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 3 values: Generator W1, Generator W2, Generator W3" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 277)">Generator W1</text><text transform="translate(219.5 327)">Generator W2</text><text transform="translate(219.5 377)">Generator W3</text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_concat_1_layer_0_marks"><path stroke="#292b2b" d="M369 244v160" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(373 238)">same error</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −0.8" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 238)">← first product better</text></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_concat_1_layer_3_marks" clip-path="url(#a)" transform="translate(225 244)"><path stroke="#ff4901" d="M291.4 16.7h118.1"/><path stroke="#306bff" d="M136.6 30h91"/><path stroke="#b701ff" d="M114.5 43.3h30.4"/><path stroke="#ff4901" d="M259.2 66.7H353"/><path stroke="#306bff" d="M146.5 80h102.8"/><path stroke="#b701ff" d="M88.4 93.3h42.5"/><path stroke="#ff4901" d="M60.7 116.7h237.6"/><path stroke="#306bff" d="M79.6 130h121.9"/><path stroke="#b701ff" d="M47.5 143.3h79.7"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_4_marks" clip-path="url(#b)" transform="translate(225 244)"><path fill="#ff4901" d="M351.2 16.7a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M185.3 30a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#b701ff" d="M135 43.3a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M309 66.7a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M202.7 80a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#b701ff" d="M116 93.3a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M196.6 116.7a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M146 130a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#b701ff" d="M93.5 143.3a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 8: At two of the three wind farms UKV has a higher error than ENS at day 1, and at two of the three wind farms the P4b blend has a lower error'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 8: At two of the three wind farms UKV has a higher error than ENS</tspan><tspan x="0" dy="20">at day 1, and at two of the three wind farms the P4b blend has a lower</tspan><tspan x="0" dy="20">error</tspan></text><text aria-label="Subtitle text 'Difference in mean absolute error between two XGBoost models, first product minus second, in points of capacity, at each generator alone. Negative means the first product forecasts better. Primary XGBoost setting. The 95% interval resamples whole months and a fitting seed within one generator, so it does not cover differences between generators. All rows are exploratory. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. Every product is scored on exactly the same hours.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Difference in mean absolute error between two XGBoost models, first product minus second, in points of capacity, at</tspan><tspan x="0" dy="13">each generator alone. Negative means the first product forecasts better. Primary XGBoost setting. The 95% interval</tspan><tspan x="0" dy="13">resamples whole months and a fitting seed within one generator, so it does not cover differences between</tspan><tspan x="0" dy="13">generators. All rows are exploratory.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output. Every product is scored on exactly</tspan><tspan x="0" dy="13">the same hours.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v160H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v160H0z"/></clipPath></defs></svg>

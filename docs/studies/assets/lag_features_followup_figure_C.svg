 3.5 0 1 1 7 0" opacity=".7"/><path fill="#306bff" d="M531.7 996.9h7v7h-7Z" opacity=".7"/><path fill="#ff4901" d="m436 1009-3.6 6h7Z" opacity=".7"/><path fill="#292b2b" d="M474.2 1032.3a3.5 3.5 0 1 1-7.1 0 3.5 3.5 0 1 1 7 0" opacity=".7"/><path fill="#306bff" d="M461.6 1040.4h7v7h-7Z" opacity=".7"/><path fill="#ff4901" d="m473.5 1052.4-3.5 6.2h7Z" opacity=".7"/></g></g><g aria-label="Symbol legend titled 'Months scored (era)' for shape, fill color and stroke color with 3 values: 2025-10 onwards (8 months), 2025-10 to 2025-12, 2026-02 onwards" aria-roledescription="legend" class="mark-group role-legend"><path d="M157 1120h427v29H157Z" aria-hidden="true" class="background" pointer-events="none"/><g class="mark-group role-legend-entry"><g aria-roledescription="group mark container" class="mark-group role-scope" pointer-events="none"><path d="M157 1136.3h172v12.5H157Z" aria-hidden="true" class="background"/><path fill="#292b2b" stroke="#292b2b" stroke-width="1.5" d="M168 1142.3a5 5 0 1 1-10 0 5 5 0 1 1 10 0" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(173 1145.3)">2025-10 onwards (8 months)</text><path d="M341 1136.3h124v12.5H341Z" aria-hidden="true" class="background"/><path fill="#306bff" stroke="#306bff" stroke-width="1.5" d="M342 1137.3h10v10h-10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(357 1145.3)">2025-10 to 2025-12</text><path d="M477 1136.6h106v11.8H477Z" aria-hidden="true" class="background"/><path fill="#ff4901" stroke="#ff4901" stroke-width="1.5" d="m483 1138.3-5 8.6h10Z" class="mark-symbol role-legend-symbol"/><text fill="#292b2b" class="mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(493 1145.6)">2026-02 onwards</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(157 1129)">Months scored (era)</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Follow-up figure C: On the 8 months not used for screening, PC, W7, and TF gained most over B0, but AN did not'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Follow-up figure C: On the 8 months not used for screening, PC, W7, and</tspan><tspan x="0" dy="20">TF gained most over B0, but AN did not</tspan></text><text aria-label="Subtitle text 'Mean absolute error minus B0's at lead-day 1 (the forecast for the day after the day it is issued), per-plant fits, primary (default XGBoost) setting. Dot: estimate. Line: 95% interval from resampling whole months. Zero is B0. An era is a period during which one version of the weather forecast product ran. The black rows use all 8 months. The study has no 2026-01, so the later era starts at 2026-02. An era of fewer than 6 months has a wide interval. The screening rule picked AN from the first 10 months, so AN's row here is out of sample. All rows are post hoc: written after the first run's results were known. Arms. B0: the baseline with no lag. PC: the ratio of power to CAMS satellite irradiance. W7: the minimum, maximum, and mean of the same hour over the last 7 whole days. TF: the 30-day ratio of power to forecast irradiance (the transfer ratio). Q30: the 30-day 90th percentile and median of the same hour. L1: B0 plus the power at the same hour on the latest whole day before the forecast was issued (two days before the target day for a day-ahead forecast). AN: the analogue ensemble, the power on the 5 recent days whose forecast clear-sky index (the forecast's irradiance relative to clear sky) was closest to the target day's. L2: L1 plus that hour's weather forecast. N2: a random day from months not being scored (a null control). N1: a random day 8 to 28 days earlier (keeps the plant's slowly changing output level). S3: a two-step forecast that adds the first-stage forecast's mean residual over the last 1, 7, and 30 days. KS: all of L1, IM, W7, Q30, TF, S3, and RP together. S2: a two-step forecast that adds a first-stage forecast and its residual at the lag hour. CTX7: seven separate daily lags and their weather forecasts. CK: the plant's clipping ceiling. IM: the morning's power on the forecast day. RP: the plant's recent energy relative to the other plants. T1: days since the record began. Month-block folds interleave, so trees can interpolate a scored month's level from months on both sides; its gain is what interpolation buys, never drift a live forecast could use.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Mean absolute error minus B0&apos;s at lead-day 1 (the forecast for the day after the day it is issued), per-plant fits,</tspan><tspan x="0" dy="13">primary (default XGBoost) setting. Dot: estimate. Line: 95% interval from resampling whole months. Zero is B0.</tspan><tspan x="0" dy="13">An era is a period during which one version of the weather forecast product ran. The black rows use all 8 months.</tspan><tspan x="0" dy="13">The study has no 2026-01, so the later era starts at 2026-02. An era of fewer than 6 months has a wide interval.</tspan><tspan x="0" dy="13">The screening rule picked AN from the first 10 months, so AN&apos;s row here is out of sample.</tspan><tspan x="0" dy="13">All rows are post hoc: written after the first run&apos;s results were known.</tspan><tspan x="0" dy="13">Arms. B0: the baseline with no lag. PC: the ratio of power to CAMS satellite irradiance. W7: the minimum, maximum,</tspan><tspan x="0" dy="13">and mean of the same hour over the last 7 whole days. TF: the 30-day ratio of power to forecast irradiance (the</tspan><tspan x="0" dy="13">transfer ratio). Q30: the 30-day 90th percentile and median of the same hour. L1: B0 plus the power at the same</tspan><tspan x="0" dy="13">hour on the latest whole day before the forecast was issued (two days before the target day for a day-ahead</tspan><tspan x="0" dy="13">forecast). AN: the analogue ensemble, the power on the 5 recent days whose forecast clear-sky index (the forecast&apos;s</tspan><tspan x="0" dy="13">irradiance relative to clear sky) was closest to the target day&apos;s. L2: L1 plus that hour&apos;s weather forecast. N2: a</tspan><tspan x="0" dy="13">random day from months not being scored (a null control). N1: a random day 8 to 28 days earlier (keeps the plant&apos;s</tspan><tspan x="0" dy="13">slowly changing output level). S3: a two-step forecast that adds the first-stage forecast&apos;s mean residual over the</tspan><tspan x="0" dy="13">last 1, 7, and 30 days. KS: all of L1, IM, W7, Q30, TF, S3, and RP together. S2: a two-step forecast that adds a</tspan><tspan x="0" dy="13">first-stage forecast and its residual at the lag hour. CTX7: seven separate daily lags and their weather forecasts.</tspan><tspan x="0" dy="13">CK: the plant&apos;s clipping ceiling. IM: the morning&apos;s power on the forecast day. RP: the plant&apos;s recent energy</tspan><tspan x="0" dy="13">relative to the other plants. T1: days since the record began. Month-block folds interleave, so trees can</tspan><tspan x="0" dy="13">interpolate a scored month&apos;s level from months on both sides; its gain is what interpolation buys, never drift a</tspan><tspan x="0" dy="13">live forecast could use.</tspan></text></g></g></svg>

mean day 1, 3-hourly steps" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 308)"><tspan>P1a: UKV day 1 minus ENS mean</tspan><tspan x="0" dy="12">day 1, 3-hourly steps</tspan></text><text transform="translate(219.5 358)"><tspan>P1b: UKV day 1 minus ENS mean</tspan><tspan x="0" dy="12">day 0</tspan></text><text transform="translate(219.5 408)"><tspan>P2a: ICON-EU day 1 minus ENS</tspan><tspan x="0" dy="12">mean day 1, 3-hourly steps</tspan></text><text transform="translate(219.5 458)"><tspan>P2b: ICON-EU day 1 minus ENS</tspan><tspan x="0" dy="12">mean day 0</tspan></text><text transform="translate(219.5 508)"><tspan>P3: GEFS mean day 1 minus ENS</tspan><tspan x="0" dy="12">mean day 1, 3-hourly steps</tspan></text><text transform="translate(219.5 558)"><tspan>P4a: ENS mean day 1 + ICON-EU</tspan><tspan x="0" dy="12">day 1 + IFS 0.25° day 1 minus</tspan><tspan x="0" dy="12">ENS mean day 1, 3-hourly steps</tspan></text><text transform="translate(219.5 608)"><tspan>P4b: ENS mean day 1 + ICON-EU</tspan><tspan x="0" dy="12">day 2 + IFS 0.25° day 2 minus</tspan><tspan x="0" dy="12">ENS mean day 1, 3-hourly steps</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_concat_1_layer_0_marks"><path stroke="#292b2b" d="M379.3 275v360" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(383.3 269)">same error</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −1.2" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 269)">← first product better</text></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_concat_1_layer_3_marks" clip-path="url(#a)" transform="translate(225 275)"><path stroke="#ff4901" d="M213.4 20h76.8"/><path stroke="#306bff" d="M202 40h79.2"/><path stroke="#ff4901" d="M342.9 70h64.7"/><path stroke="#306bff" d="M333.1 90h65.7"/><path stroke="#ff4901" d="M146 120h57.7"/><path stroke="#306bff" d="M145.4 140h51"/><path stroke="#ff4901" d="M273.3 170H322"/><path stroke="#306bff" d="M268.7 190h49.8"/><path stroke="#ff4901" d="M231.2 220h64.4"/><path stroke="#306bff" d="M238.1 240h58.2"/><path stroke="#ff4901" d="M44.9 270h48.7"/><path stroke="#306bff" d="M49.4 290h43"/><path stroke="#ff4901" d="M118 320h25.1"/><path stroke="#306bff" d="M114.3 340H143"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_4_marks" clip-path="url(#b)" transform="translate(225 275)"><path fill="#ff4901" d="M257.5 20a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M248 40a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M378.7 70a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M369.3 90a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M180.2 120a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M175.7 140a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M301.4 170a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M297 190a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M268.8 220a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M270.6 240a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M74.1 270a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M75.5 290a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M134.8 320a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M133.1 340a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Planned contrasts'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 253)">Planned contrasts</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 4: For wind power, ENS beats UKV and GEFS, ICON-EU is unresolved against ENS, and a blend lowers the error by 0.18 points even at a conservative lead'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 4: For wind power, ENS beats UKV and GEFS, ICON-EU is unresolved</tspan><tspan x="0" dy="20">against ENS, and a blend lowers the error by 0.18 points even at a</tspan><tspan x="0" dy="20">conservative lead</tspan></text><text aria-label="Subtitle text 'Difference in mean absolute error between two XGBoost models, each given one forecast product, first product minus second, in points of capacity. Negative means the first product forecasts better. Every product is scored on exactly the same hours. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. P1a, P2a, P3, P4a, and P4b compare at the ENS mean's day-1 lead; P1b and P2b compare with the ENS mean at day 0, so a product's day-1 error lies between the two ENS errors when it is bracketed. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. All rows are planned: written into the study plan before any result existed.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Difference in mean absolute error between two XGBoost models, each given one forecast product, first product minus</tspan><tspan x="0" dy="13">second, in points of capacity. Negative means the first product forecasts better. Every product is scored on</tspan><tspan x="0" dy="13">exactly the same hours. Every error is a fraction of the generator&apos;s own capacity, taken as its 99th percentile of</tspan><tspan x="0" dy="13">metered output.</tspan><tspan x="0" dy="13">P1a, P2a, P3, P4a, and P4b compare at the ENS mean&apos;s day-1 lead; P1b and P2b compare with the ENS mean at day 0, so</tspan><tspan x="0" dy="13">a product&apos;s day-1 error lies between the two ENS errors when it is bracketed. Dot: estimate. Line: 95% interval</tspan><tspan x="0" dy="13">from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026.</tspan><tspan x="0" dy="13">All rows are planned: written into the study plan before any result existed.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v360H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v360H0z"/></clipPath></defs></svg>

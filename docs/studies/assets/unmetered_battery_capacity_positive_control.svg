</g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Real demand'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="18" pointer-events="none" transform="translate(6 425.5)">Real demand</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 10: The positive control passes its rule, but its intervals are narrower than 90% on replicas'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19.5)"><tspan>Figure 10: The positive control passes its rule, but its intervals are</tspan><tspan x="0" dy="20">narrower than 90% on replicas</tspan></text><text aria-label="Subtitle text 'A 40% merchant battery whose usable duration and efficiency lie off the estimator's grid, 10 fresh draws on 7 series in each block: 70 fits per bar. Dashed line: the nominal 90%. The rule needed 187 of 280 replica fits to hold both power and energy; 202 did. On real demand every interval holds the truth, because the likelihood is tempered by the residual's autocorrelation, which widens them.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58.5)"><tspan>A 40% merchant battery whose usable duration and efficiency lie off the estimator&apos;s grid, 10 fresh draws on 7</tspan><tspan x="0" dy="13">series in each block: 70 fits per bar.</tspan><tspan x="0" dy="13">Dashed line: the nominal 90%. The rule needed 187 of 280 replica fits to hold both power and energy; 202 did. On</tspan><tspan x="0" dy="13">real demand every interval holds the truth, because the likelihood is tempered by the residual&apos;s autocorrelation,</tspan><tspan x="0" dy="13">which widens them.</tspan></text></g></g></svg>

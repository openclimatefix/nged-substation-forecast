ath fill="#292b2b" d="m212 661.7 3.4-3.4 3.3 3.4-3.3 3.3Z"/><path fill="#306bff" d="M286.3 669.8a3.4 3.4 0 1 1-6.7 0 3.4 3.4 0 1 1 6.7 0"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10"><text transform="translate(8 390)">ENS mean</text><text transform="translate(8 450)">IFS 0.25°</text><text transform="translate(8 510)">ICON-EU</text><text transform="translate(8 570)">ICON-D2</text><text transform="translate(8 630)">ENS control member</text><text transform="translate(8 690)">IFS HRES (9 km, Open-Meteo)</text><text transform="translate(8 750)">ICON global</text><text transform="translate(8 810)">GFS (Open-Meteo)</text><text transform="translate(8 870)">KNMI HARMONIE-AROME</text><text transform="translate(8 930)">DMI HARMONIE-AROME</text><text transform="translate(8 990)">UKV</text><text transform="translate(8 1050)">GEFS mean</text><text transform="translate(8 1110)">GFS (native)</text></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_6_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" text-anchor="end"><text transform="translate(557.1 345)">Smart persistence, day 1</text><text transform="translate(577.8 315)">Climatology</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 2: For wind power, error rises with lead: at day 1 every weather forecast shown has a lower error than climatology (18.5%), but at day 14 neither the ENS mean nor the GEFS mean does; the ENS mean and IFS 0.25° have the lowest day-1 errors'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5.5 19)"><tspan>Figure 2: For wind power, error rises with lead: at day 1 every weather</tspan><tspan x="0" dy="20">forecast shown has a lower error than climatology (18.5%), but at day 14</tspan><tspan x="0" dy="20">neither the ENS mean nor the GEFS mean does; the ENS mean and IFS 0.25°</tspan><tspan x="0" dy="20">have the lowest day-1 errors</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product. Each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day. Smaller is better. Marks run from day 0 at the top to day 14 at the bottom; day 7 is a grey diamond and day 0 is a black diamond. A lead day with no mark was not fitted, because it is beyond the product's forecast range or not in the archive we hold; nothing is filled in. Dashed lines mark the no- weather baselines. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Overlapping intervals can still hide a significant paired difference (Figure 4). Day 0 is not a day-ahead forecast a service could read, because each product reads a run that started before the hour it describes. Leads are not equal: a Previous Runs product reads the freshest run at least a day old, a shorter lead than ENS's on most hours, which favours that product. IFS HRES (9 km, Open-Meteo) is scored on slightly fewer hours: the shared hours minus the target days its archive lacks. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5.5 98)"><tspan>Each row is one forecast product. Each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day. Smaller is better. Marks run from day 0 at the top to day 14 at the</tspan><tspan x="0" dy="13">bottom; day 7 is a grey diamond and day 0 is a black diamond. A lead day with no mark was not fitted, because it is</tspan><tspan x="0" dy="13">beyond the product&apos;s forecast range or not in the archive we hold; nothing is filled in. Dashed lines mark the no-</tspan><tspan x="0" dy="13">weather baselines. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Overlapping</tspan><tspan x="0" dy="13">intervals can still hide a significant paired difference (Figure 4).</tspan><tspan x="0" dy="13">Day 0 is not a day-ahead forecast a service could read, because each product reads a run that started before the</tspan><tspan x="0" dy="13">hour it describes. Leads are not equal: a Previous Runs product reads the freshest run at least a day old, a</tspan><tspan x="0" dy="13">shorter lead than ENS&apos;s on most hours, which favours that product. IFS HRES (9 km, Open-Meteo) is scored on</tspan><tspan x="0" dy="13">slightly fewer hours: the shared hours minus the target days its archive lacks.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h670v840H0z"/></clipPath><clipPath id="b"><path d="M0 0h670v840H0z"/></clipPath></defs></svg>

re 2: At day 1 every weather forecast shown has a lower error than climatology (18.5%), by more than 9 points; ENS, IFS 0.25° and ICON-EU have the lowest error of the single wind forecasts'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 2: At day 1 every weather forecast shown has a lower error than</tspan><tspan x="0" dy="20">climatology (18.5%), by more than 9 points; ENS, IFS 0.25° and ICON-EU</tspan><tspan x="0" dy="20">have the lowest error of the single wind forecasts</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product; each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day, on the hours every forecast is scored on. Primary XGBoost setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines: the no-weather baselines. Day 0 is ENS's run-day forecast, a bracket side, not a forecast a service could read. Overlapping intervals here can still hide a significant paired difference (Figure 4). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Leads are not equal: a forecast from Open-Meteo's Previous Runs archive has a day-1 lead of 24 + (h mod n) hours, shorter than ENS's 24 + h on most hours, so the comparison favours those forecasts. Only GEFS shares ENS's lead. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Each row is one forecast product; each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day, on the hours every forecast is scored on. Primary XGBoost setting.</tspan><tspan x="0" dy="13">Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines: the</tspan><tspan x="0" dy="13">no-weather baselines.</tspan><tspan x="0" dy="13">Day 0 is ENS&apos;s run-day forecast, a bracket side, not a forecast a service could read. Overlapping intervals here</tspan><tspan x="0" dy="13">can still hide a significant paired difference (Figure 4). Dot: estimate. Line: 95% interval from resampling whole</tspan><tspan x="0" dy="13">months and a fitting seed.</tspan><tspan x="0" dy="13">Leads are not equal: a forecast from Open-Meteo&apos;s Previous Runs archive has a day-1 lead of 24 + (h mod n) hours,</tspan><tspan x="0" dy="13">shorter than ENS&apos;s 24 + h on most hours, so the comparison favours those forecasts. Only GEFS shares ENS&apos;s lead.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v550H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v550H0z"/></clipPath></defs></svg>

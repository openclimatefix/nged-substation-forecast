<tspan>ENS mean day 0 (a bracket</tspan><tspan x="0" dy="12">side, not a product)</tspan></text><text transform="translate(219.5 287)"><tspan>P4a blend: ENS + ICON-EU + IFS</tspan><tspan x="0" dy="12">0.25°</tspan></text><text transform="translate(219.5 315)"><tspan>P4b blend: ENS + ICON-EU + IFS</tspan><tspan x="0" dy="12">0.25°</tspan></text><text transform="translate(219.5 343)"><tspan>P4a control: ENS + shuffled</tspan><tspan x="0" dy="12">ICON-EU + IFS 0.25°</tspan></text><text transform="translate(219.5 371)"><tspan>P4b control: ENS + shuffled</tspan><tspan x="0" dy="12">ICON-EU + IFS 0.25°</tspan></text><text transform="translate(219.5 399)">ENS mean day 1</text><text transform="translate(219.5 427)">IFS 0.25° day 1</text><text transform="translate(219.5 455)">ICON-EU day 1</text><text transform="translate(219.5 483)">ICON-D2 day 1</text><text transform="translate(219.5 511)">ENS control member day 1</text><text transform="translate(219.5 539)">ICON global day 1</text><text transform="translate(219.5 567)">GFS day 1</text><text transform="translate(219.5 595)">KNMI HARMONIE-AROME day 1</text><text transform="translate(219.5 623)">DMI HARMONIE-AROME day 1</text><text transform="translate(219.5 651)">UKV day 1</text><text transform="translate(219.5 679)">GEFS mean day 1</text><text transform="translate(219.5 707)"><tspan>Smart persistence day 1 (no</tspan><tspan x="0" dy="12">weather)</tspan></text><text transform="translate(219.5 735)">Climatology (no weather)</text></g></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_concat_1_layer_0_marks" clip-path="url(#a)" transform="translate(225 242)"><path stroke="#ff4901" d="M39.5 14h52.4m-45 28h53.8M59.3 70h53.3M62.5 98h54m-53.7 28h54m-53.6 28h55.5m-56.2 28h57.6M67 210h57.1m-56.4 28h57.1m-54.2 28H127m-55 28h67.3m-59.8 28H136m-53.2 28h53.6m-52.6 28h54.6m-54.5 28h55.7m-52.5 28h52.3"/><path stroke="#306bff" d="M289 462h102m-88.1 28H412"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_1_marks" clip-path="url(#b)" transform="translate(225 242)"><path fill="#ff4901" d="M68.4 14a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m7.8 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m12.7 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m3.5 28a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m.5 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m.9 28a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m.2 28a4.2 4.2 0 1 1-8.5 0 4.2 4.2 0 1 1 8.4 0m4.5 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m1.1 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m2.6 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m5.7 28a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0m3.2 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0m1.4 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m1.7 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0m.7 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m2.4 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M346.4 462a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m17.8 28a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 8: At day 1 every forecast beats climatology (18.5%) by more than 9 points; ENS, IFS 0.25° and ICON-EU have the lowest error of the single wind forecasts'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 8: At day 1 every forecast beats climatology (18.5%) by more than</tspan><tspan x="0" dy="20">9 points; ENS, IFS 0.25° and ICON-EU have the lowest error of the single</tspan><tspan x="0" dy="20">wind forecasts</tspan></text><text aria-label="Subtitle text 'Each row is one forecast's own mean absolute error, as a percentage of capacity, on the hours every forecast is scored on, with no weather forecast given for the baselines. Primary XGBoost setting. Smaller is better. Only day-1 forecasts, ENS at day 0, climatology and smart persistence at day 1 are shown; the other days are in the lead-day figure. P4a blends ENS with the day-1 ICON-EU and IFS 0.25°; P4b uses their day-2 forecasts. A control gives an XGBoost model the same columns with the shuffled products' values moved among matched hours. Overlapping intervals here can still hide a significant paired difference (Figure 2). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Each row is one forecast&apos;s own mean absolute error, as a percentage of capacity, on the hours every forecast is</tspan><tspan x="0" dy="13">scored on, with no weather forecast given for the baselines. Primary XGBoost setting. Smaller is better.</tspan><tspan x="0" dy="13">Only day-1 forecasts, ENS at day 0, climatology and smart persistence at day 1 are shown; the other days are in the</tspan><tspan x="0" dy="13">lead-day figure. P4a blends ENS with the day-1 ICON-EU and IFS 0.25°; P4b uses their day-2 forecasts. A control</tspan><tspan x="0" dy="13">gives an XGBoost model the same columns with the shuffled products&apos; values moved among matched hours. Overlapping</tspan><tspan x="0" dy="13">intervals here can still hide a significant paired difference (Figure 2). Dot: estimate. Line: 95% interval from</tspan><tspan x="0" dy="13">resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v504H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v504H0z"/></clipPath></defs></svg>

fill="#306bff" d="M109.9 287a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M138.4 293.5a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#009c75" d="M171 300a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#17e58f" d="M266 306.5a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#292b2b" d="m54.3 180.5 4.2-4.2 4.2 4.2-4.2 4.2Z"/><path fill="#306bff" d="M103 187a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#292b2b" d="m63.2 130.5 4.2-4.2 4.2 4.2-4.2 4.2Z"/><path fill="#306bff" d="M102.1 137a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M133.2 143.5a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#009c75" d="M168.9 150a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M98.4 87a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#10c5f7" d="M117.4 93.5a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#009c75" d="M153.4 100a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#17e58f" d="M239.4 106.5a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M113.6 387a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m1.9 100a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/></g><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_4_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" text-anchor="end" transform="translate(523 327.5)">Smart persistence, day 1</text><text fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_5_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="10" transform="translate(547.7 327.5)">Climatology</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 2: Error rises with lead: at day 1 every weather forecast shown has a lower error than climatology (18.5%), but at day 14 the ENS mean's error is not lower; ENS, IFS 0.25° and ICON-EU have the lowest error of the single day-1 forecasts'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 2: Error rises with lead: at day 1 every weather forecast shown</tspan><tspan x="0" dy="20">has a lower error than climatology (18.5%), but at day 14 the ENS mean&apos;s</tspan><tspan x="0" dy="20">error is not lower; ENS, IFS 0.25° and ICON-EU have the lowest error of</tspan><tspan x="0" dy="20">the single day-1 forecasts</tspan></text><text aria-label="Subtitle text 'Each row is one forecast product; each mark is an XGBoost model's mean absolute error, as a percentage of capacity, given that product's forecast at one lead day, on the hours every forecast is scored on. Primary XGBoost setting. Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines: the no-weather baselines. Day 0 is a forecast made hours before the hour it describes (ENS's run-day forecast, or Open-Meteo's freshest ICON run), not a day-ahead forecast a service could read. Marks at days 5, 10 and 14 and ICON's day 0 were fitted later, on a GPU, at the primary setting only; a GPU fit of the same arm differs from its CPU fit by 0.04 to 0.09 points, lower. Overlapping intervals here can still hide a significant paired difference (Figure 4). Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Leads are not equal: a forecast from Open-Meteo's Previous Runs archive has a day-1 lead of 24 + (h mod n) hours, shorter than ENS's 24 + h on most hours, so the comparison favours those forecasts. Only GEFS shares ENS's lead. Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of the generator's own capacity.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 98)"><tspan>Each row is one forecast product; each mark is an XGBoost model&apos;s mean absolute error, as a percentage of capacity,</tspan><tspan x="0" dy="13">given that product&apos;s forecast at one lead day, on the hours every forecast is scored on. Primary XGBoost setting.</tspan><tspan x="0" dy="13">Smaller is better. A lead day with no mark was not fitted for that product; nothing is filled in. Dashed lines: the</tspan><tspan x="0" dy="13">no-weather baselines.</tspan><tspan x="0" dy="13">Day 0 is a forecast made hours before the hour it describes (ENS&apos;s run-day forecast, or Open-Meteo&apos;s freshest ICON</tspan><tspan x="0" dy="13">run), not a day-ahead forecast a service could read. Marks at days 5, 10 and 14 and ICON&apos;s day 0 were fitted later,</tspan><tspan x="0" dy="13">on a GPU, at the primary setting only; a GPU fit of the same arm differs from its CPU fit by 0.04 to 0.09 points,</tspan><tspan x="0" dy="13">lower. Overlapping intervals here can still hide a significant paired difference (Figure 4). Dot: estimate. Line:</tspan><tspan x="0" dy="13">95% interval from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Leads are not equal: a forecast from Open-Meteo&apos;s Previous Runs archive has a day-1 lead of 24 + (h mod n) hours,</tspan><tspan x="0" dy="13">shorter than ENS&apos;s 24 + h on most hours, so the comparison favours those forecasts. Only GEFS shares ENS&apos;s lead.</tspan><tspan x="0" dy="13">Scored hours of the three wind farms in Lincolnshire, December 2024 to September 2026. Every error is a fraction of</tspan><tspan x="0" dy="13">the generator&apos;s own capacity.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v575H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v575H0z"/></clipPath></defs></svg>

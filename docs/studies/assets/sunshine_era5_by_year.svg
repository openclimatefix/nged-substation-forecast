ls both satellite retrievals by more than 3 points in every year from 2021 to 2026'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 8: On matched months, ERA5 trails both satellite retrievals by</tspan><tspan x="0" dy="20">more than 3 points in every year from 2021 to 2026</tspan></text><text aria-label="Subtitle text 'Each product's mean absolute error minus ERA5's, on January to August of one calendar year, on the hours all four products cover. Every year is restricted to the same months so a partial 2026 compares against the same months of the complete years before it. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, January 2021 to August 2026. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each product&apos;s mean absolute error minus ERA5&apos;s, on January to August of one calendar year, on the hours all four</tspan><tspan x="0" dy="13">products cover. Every year is restricted to the same months so a partial 2026 compares against the same months of</tspan><tspan x="0" dy="13">the complete years before it.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, January 2021 to August 2026.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v240H0z"/></clipPath></defs></svg>

t fill="#292b2b" aria-label="Title text 'Paired differences, primary setting'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 150)">Paired differences, primary setting</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 2: A second height gives most of the gain from using more CERRA wind heights'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 2: A second height gives most of the gain from using more CERRA</tspan><tspan x="0" dy="20">wind heights</tspan></text><text aria-label="Subtitle text 'Each row: the first set of columns minus the second set, on the same rows. Dot: estimate. Line: 95% interval from resampling whole months. Hollow triangle: the second hyperparameter setting. Errors are a fraction of each wind farm's capacity. Three wind farms, September 2019 to June 2026, on CERRA's 3-hourly analysis. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory or, where marked, post hoc.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each row: the first set of columns minus the second set, on the same rows.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Hollow triangle: the second hyperparameter setting.</tspan><tspan x="0" dy="13">Errors are a fraction of each wind farm&apos;s capacity.</tspan><tspan x="0" dy="13">Three wind farms, September 2019 to June 2026, on CERRA&apos;s 3-hourly analysis.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory or, where marked, post hoc.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v320H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v320H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v320H0z"/></clipPath></defs></svg>

 8.4 0"/></g><g stroke="#306bff" stroke-width="2" aria-hidden="true" class="mark-symbol role-mark concat_3_layer_1_layer_6_marks" clip-path="url(#m)" transform="translate(225 838)"><path d="m218.6 22.4-4.2 7.2h8.4Zm12.8 52-4.2 7.2h8.4Zm-16 52-4.2 7.2h8.3Z"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_3_layer_1_layer_7_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="11"><text transform="translate(469.9 867)">-0.00 [-0.01, +0.00]</text><text transform="translate(511.6 919)">+0.00 [-0.01, +0.02]</text><text transform="translate(469.9 971)">-0.00 [-0.01, +0.00]</text></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'P4: solar farm power, XGBoost models'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 816)">P4: solar farm power, XGBoost models</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: At four stations UKV-CEDA is closer than ERA5 for wind and temperature, but ERA5 gives the lower wind-power error, and the choice does not move solar power'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: At four stations UKV-CEDA is closer than ERA5 for wind and</tspan><tspan x="0" dy="20">temperature, but ERA5 gives the lower wind-power error, and the choice</tspan><tspan x="0" dy="20">does not move solar power</tspan></text><text aria-label="Subtitle text 'Each dot is UKV-CEDA's mean absolute error minus ERA5's, so a negative value favours UKV-CEDA, and each line is a 95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as clear. A hollow triangle is the second hyperparameter setting. A dashed line has too few months for an interval. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Each dot is UKV-CEDA&apos;s mean absolute error minus ERA5&apos;s, so a negative value favours UKV-CEDA, and each line is a</tspan><tspan x="0" dy="13">95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as</tspan><tspan x="0" dy="13">clear.</tspan><tspan x="0" dy="13">A hollow triangle is the second hyperparameter setting. A dashed line has too few months for an interval.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="l"><path d="M0 0h450v156H0z"/></clipPath><clipPath id="m"><path d="M0 0h450v156H0z"/></clipPath></defs></svg>

te(368.5 662)">-0.14 [-0.15, -0.12]</text><text transform="translate(376 714)">-0.12 [-0.14, -0.11]</text><text transform="translate(379 766)">-0.12 [-0.14, -0.10]</text><text transform="translate(391 818)">-0.11 [-0.12, -0.09]</text></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Wind speed by UKV-CEDA lead (post hoc)'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 507)">Wind speed by UKV-CEDA lead (post hoc)</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 5: UKV-CEDA's advantage at the four stations shrinks as the lead grows'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 5: UKV-CEDA&apos;s advantage at the four stations shrinks as the lead</tspan><tspan x="0" dy="20">grows</tspan></text><text aria-label="Subtitle text 'Each dot is UKV-CEDA's mean absolute error minus ERA5's, so a negative value favours UKV-CEDA, and each line is a 95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as clear. A lead is the UTC hour modulo 6, so a lead is also an hour of day. All rows are post hoc. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each dot is UKV-CEDA&apos;s mean absolute error minus ERA5&apos;s, so a negative value favours UKV-CEDA, and each line is a</tspan><tspan x="0" dy="13">95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as</tspan><tspan x="0" dy="13">clear.</tspan><tspan x="0" dy="13">A lead is the UTC hour modulo 6, so a lead is also an hour of day. All rows are post hoc.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v312H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v312H0z"/></clipPath></defs></svg>

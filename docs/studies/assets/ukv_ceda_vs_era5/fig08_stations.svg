span><tspan x="0" dy="20">one station decides the sign</tspan></text><text aria-label="Subtitle text 'Each dot is UKV-CEDA's mean absolute error minus ERA5's, so a negative value favours UKV-CEDA, and each line is a 95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as clear. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each dot is UKV-CEDA&apos;s mean absolute error minus ERA5&apos;s, so a negative value favours UKV-CEDA, and each line is a</tspan><tspan x="0" dy="13">95% interval from resampling whole calendar months. The grey band is the margin a difference must pass to read as</tspan><tspan x="0" dy="13">clear.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v884H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v884H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v884H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v884H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v104H0z"/></clipPath><clipPath id="i"><path d="M0 0h450v104H0z"/></clipPath></defs></svg>

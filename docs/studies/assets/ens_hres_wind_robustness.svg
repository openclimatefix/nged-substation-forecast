 refitted under each fold design. The designs were added after the first results, so every row here is exploratory. A fold is a block of whole months held out for scoring. A design says where the blocks are cut and what the XGBoost model is told about each hour's era. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three farms are few independent sites. All rows are exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>The three planned contrasts refitted under each fold design. The designs were added after the first results, so</tspan><tspan x="0" dy="13">every row here is exploratory.</tspan><tspan x="0" dy="13">A fold is a block of whole months held out for scoring. A design says where the blocks are cut and what the XGBoost</tspan><tspan x="0" dy="13">model is told about each hour&apos;s era.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Three wind farms in Lincolnshire, December 2024 to September 2026: 43,555 farm-hours in 22 calendar months. Three</tspan><tspan x="0" dy="13">farms are few independent sites.</tspan><tspan x="0" dy="13">All rows are exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v240H0z"/></clipPath></defs></svg>

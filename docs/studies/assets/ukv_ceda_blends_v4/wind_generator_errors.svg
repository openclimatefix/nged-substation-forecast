rk-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 8: At the three wind farms, the blend's mean absolute error runs from 6.7% to 9.4% of capacity at lead day 1, and from 11.2% to 13.2% at lead day 4'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 8: At the three wind farms, the blend&apos;s mean absolute error runs</tspan><tspan x="0" dy="20">from 6.7% to 9.4% of capacity at lead day 1, and from 11.2% to 13.2% at</tspan><tspan x="0" dy="20">lead day 4</tspan></text><text aria-label="Subtitle text 'Mean absolute error of the padded ENS model and of the blend at each generator alone, at the primary setting, in percent of capacity. The report prints the same errors for the two shuffled controls. The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Mean absolute error of the padded ENS model and of the blend at each generator alone, at the primary setting, in</tspan><tspan x="0" dy="13">percent of capacity. The report prints the same errors for the two shuffled controls.</tspan><tspan x="0" dy="13">The three wind farms, up to 21 calendar months of out-of-fold forecasts. Every error is a fraction of the</tspan><tspan x="0" dy="13">generator&apos;s own capacity, taken as its 99th percentile of metered output.</tspan></text></g></g></svg>

stroke="#10c5f7" d="m415 1095 3.8-3.8 3.9 3.9-3.9 3.8Z"/><path stroke="#ff4901" d="m423.6 1186.5 3.9-3.9 3.9 3.9-3.9 3.9Z"/><path stroke="#306bff" d="m432.3 1136.7 3.9-3.8 3.9 3.8-3.9 4Z"/><path stroke="#10c5f7" d="m560 1068.3 3.8-3.8 3.9 3.8-3.9 4Z"/><path stroke="#ff4901" d="m568.6 1156 3.9-4 3.9 4-3.9 3.8Z"/><path stroke="#306bff" d="m577.3 1108.7 3.9-3.8 3.9 3.8-3.9 3.9Z"/></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 17: WeatherNext 3's error against ENS mean for the six solar farms, in the months before July, from July, and pooled'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 17: WeatherNext 3&apos;s error against ENS mean for the six solar</tspan><tspan x="0" dy="20">farms, in the months before July, from July, and pooled</tspan></text><text aria-label="Subtitle text 'Each mark is an XGBoost model's error, given one forecast product, in percent of capacity, or the difference between two such models in points of capacity. Top panel: WeatherNext 3's error minus the reference's, on the same rows. Lower panels: each product's own error. Dot: estimate. Line: 95% interval from resampling whole months. Filled dots are WeatherNext 3; hollow diamonds are the reference. The three colours are three groups of the same out-of-fold rows: February to June 2026 (4 calendar months), July to September 2026 (3 months), and every row from February to September 2026 (7 months). Only the second group is certain to lie after WeatherNext 3's training data, and the third mixes both, so it is not a fair comparison and not the headline until the archive's provenance is confirmed. Each calendar month occurs in one year only, so every contrast is descriptive. Every product is scored on exactly the same hours. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each mark is an XGBoost model&apos;s error, given one forecast product, in percent of capacity, or the difference</tspan><tspan x="0" dy="13">between two such models in points of capacity. Top panel: WeatherNext 3&apos;s error minus the reference&apos;s, on the same</tspan><tspan x="0" dy="13">rows. Lower panels: each product&apos;s own error. Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">Filled dots are WeatherNext 3; hollow diamonds are the reference.</tspan><tspan x="0" dy="13">The three colours are three groups of the same out-of-fold rows: February to June 2026 (4 calendar months), July to</tspan><tspan x="0" dy="13">September 2026 (3 months), and every row from February to September 2026 (7 months). Only the second group is</tspan><tspan x="0" dy="13">certain to lie after WeatherNext 3&apos;s training data, and the third mixes both, so it is not a fair comparison and</tspan><tspan x="0" dy="13">not the headline until the archive&apos;s provenance is confirmed. Each calendar month occurs in one year only, so every</tspan><tspan x="0" dy="13">contrast is descriptive.</tspan><tspan x="0" dy="13">Every product is scored on exactly the same hours. Every error is a fraction of the generator&apos;s own capacity, taken</tspan><tspan x="0" dy="13">as its 99th percentile of metered output.</tspan></text></g></g></svg>

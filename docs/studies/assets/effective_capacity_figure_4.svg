mark-text role-legend-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" transform="translate(476 567)">post hoc</text></g></g><text fill="#292b2b" class="mark-text role-legend-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" pointer-events="none" transform="translate(176 535)">Estimator family</text></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 4: On plant-months whose output matched the neighbouring plants', only HYST and the references stayed still'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 4: On plant-months whose output matched the neighbouring plants&apos;,</tspan><tspan x="0" dy="20">only HYST and the references stayed still</tspan></text><text aria-label="Subtitle text 'Each dot: the share of days, in 23 plant-months whose output was within 5% of the neighbouring plants', on which an estimator's capacity moved more than 5% from its median over the previous 90 days. A day on which an estimator fell back to the static capacity counts as a move. Dashed line: the plan's gate. Smaller is better, but S0 and EM stay still because they cannot follow a loss (Figure 3). Post hoc: designed after the results.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 58)"><tspan>Each dot: the share of days, in 23 plant-months whose output was within 5% of the neighbouring plants&apos;, on which an</tspan><tspan x="0" dy="13">estimator&apos;s capacity moved more than 5% from its median over the previous 90 days. A day on which an estimator fell</tspan><tspan x="0" dy="13">back to the static capacity counts as a move.</tspan><tspan x="0" dy="13">Dashed line: the plan&apos;s gate. Smaller is better, but S0 and EM stay still because they cannot follow a loss (Figure</tspan><tspan x="0" dy="13">3). Post hoc: designed after the results.</tspan></text></g></g></svg>

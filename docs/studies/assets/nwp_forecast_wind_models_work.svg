etting. A gap in a line is an hour</tspan><tspan x="0" dy="13">outside the scored rows.</tspan><tspan x="0" dy="13">The week is chosen by rule from measured output alone: the week with the largest mean hour-to-hour change in</tspan><tspan x="0" dy="13">output. Each vertical axis runs from 0 to 110% of the generator&apos;s own capacity.</tspan></text></g></g></svg>

incolnshire, December 2022 to September 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 58)"><tspan>Each product&apos;s own mean absolute error, sorted best first.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months.</tspan><tspan x="0" dy="13">The intervals are wide mainly because every product&apos;s error swings together from month to month, a swing that</tspan><tspan x="0" dy="13">Figure 2&apos;s paired contrasts cancel.</tspan><tspan x="0" dy="13">Capacity is each generator&apos;s 99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to September 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v240H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v240H0z"/></clipPath></defs></svg>

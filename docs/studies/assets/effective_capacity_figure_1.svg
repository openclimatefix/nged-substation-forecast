roke="#b701ff" d="M248.7 419.9 244 428h9.5Z"/></g><g fill="#292b2b" aria-hidden="true" class="mark-text role-mark concat_1_layer_7_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="11"><text transform="translate(443.7 297)">+0.255 [+0.004, +0.563]</text><text transform="translate(443.7 323)">+0.259 [−0.022, +0.599]</text><text transform="translate(443.7 349)">−0.022 [−0.145, +0.067]</text><text transform="translate(443.7 375)">−0.036 [−0.185, +0.068]</text><text transform="translate(443.7 401)">−0.081 [−0.216, +0.015]</text><text transform="translate(443.7 427)">−0.113 [−0.260, +0.004]</text><text transform="translate(443.7 453)">+0.004 [−0.223, +0.320]</text><text transform="translate(443.7 479)">+0.093 [−0.088, +0.268]</text><text transform="translate(443.7 505)">+0.175 [−0.024, +0.330]</text><text transform="translate(443.7 531)">+0.267 [+0.041, +0.429]</text><text transform="translate(443.7 557)">+0.290 [+0.083, +0.520]</text><text transform="translate(443.7 583)">+0.358 [−0.062, +0.611]</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: A capacity estimate that updates daily raised day-ahead solar error at 6 plants, and one that holds the static value until a drop lasts did not'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Figure 1: A capacity estimate that updates daily raised day-ahead solar</tspan><tspan x="0" dy="20">error at 6 plants, and one that holds the static value until a drop</tspan><tspan x="0" dy="20">lasts did not</tspan></text><text aria-label="Subtitle text 'Change in an XGBoost forecast's mean absolute error when its training power is divided by an estimate of each plant's capacity, against B0, which divides by the plant's static capacity and has an error of 8.93 points of capacity. Dot: estimate. Line: 95% interval over the 18 scored months. Dashed lines: 2% of B0's error (0.179 points), the smallest change the plan counted as worth acting on. Planned: written into the plan before any result existed. Post hoc: designed after the results. Hollow triangle: the second XGBoost setting. KF pick: the Kalman filter, which the plan's selection rule chose. No-fit bound: B0's forecast multiplied by each plant-month's output relative to its neighbours. HYST holds the static capacity until a drop lasts 7 days. Estimators below HYST ran at the primary setting only. CX1, a post hoc convex estimator, is off the scale at +3.222 [+2.380, +4.238].'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 78)"><tspan>Change in an XGBoost forecast&apos;s mean absolute error when its training power is divided by an estimate of each</tspan><tspan x="0" dy="13">plant&apos;s capacity, against B0, which divides by the plant&apos;s static capacity and has an error of 8.93 points of</tspan><tspan x="0" dy="13">capacity.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval over the 18 scored months. Dashed lines: 2% of B0&apos;s error (0.179 points), the</tspan><tspan x="0" dy="13">smallest change the plan counted as worth acting on. Planned: written into the plan before any result existed. Post</tspan><tspan x="0" dy="13">hoc: designed after the results. Hollow triangle: the second XGBoost setting.</tspan><tspan x="0" dy="13">KF pick: the Kalman filter, which the plan&apos;s selection rule chose. No-fit bound: B0&apos;s forecast multiplied by each</tspan><tspan x="0" dy="13">plant-month&apos;s output relative to its neighbours. HYST holds the static capacity until a drop lasts 7 days.</tspan><tspan x="0" dy="13">Estimators below HYST ran at the primary setting only. CX1, a post hoc convex estimator, is off the scale at +3.222</tspan><tspan x="0" dy="13">[+2.380, +4.238].</tspan></text></g></g></svg>

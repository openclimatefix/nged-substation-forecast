 to 0.001" aria-roledescription="axis" class="mark-group role-axis" pointer-events="none"><path stroke="#292b2b" d="M207.5 948.5v5m31-5v5m30-5v5m31-5v5m30-5v5m31-5v5m31-5v5m30-5v5m31-5v5m30-5v5m31-5v5m30-5v5m31-5v5m31-5v5m30-5v5" class="mark-rule role-axis-tick"/><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" text-anchor="middle"><text transform="translate(207.6 963.5)">−0.013</text><text transform="translate(268.8 963.5)">−0.011</text><text transform="translate(330 963.5)">−0.009</text><text transform="translate(391 963.5)">−0.007</text><text transform="translate(452.2 963.5)">−0.005</text><text transform="translate(513.3 963.5)">−0.003</text><text transform="translate(574.4 963.5)">−0.001</text><text transform="translate(635.6 963.5)">0.001</text></g><path stroke="#292b2b" d="M192.5 948.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(417.5 978.5)">CRPS, G10 minus G9 (clearness index; more negative is better)</text></g><g aria-label="Y-axis for a discrete scale with 4 values: Clear (882 d, 76 mo), Clear and dusty (55 d, 27 mo), Dusty, any sky (155 d, 50 mo), Clear and clean (646 d, 76 mo)" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(186.5 860)">Clear (882 d, 76 mo)</text><text transform="translate(186.5 886)">Clear and dusty (55 d, 27 mo)</text><text transform="translate(186.5 912)">Dusty, any sky (155 d, 50 mo)</text><text transform="translate(186.5 938)">Clear and clean (646 d, 76 mo)</text></g></g><path stroke="#292b2b" stroke-dasharray="4,3" d="M604.5 844v104" aria-hidden="true" class="mark-rule role-mark concat_3_layer_0_marks"/><path stroke="#17e58f" stroke-width="1.5" d="M504.8 857h54m-329.3 26h307.1m-101.7 26h109.3m1.5 26h31" aria-hidden="true" class="mark-rule role-mark concat_3_layer_1_marks"/><path fill="#17e58f" d="M537.2 857a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m-127.6 26a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m89.6 26a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0m65.4 26a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0" aria-hidden="true" class="mark-symbol role-mark concat_3_layer_2_marks"/><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'CAMS clearness index: CRPS'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(6 836)">CAMS clearness index: CRPS</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 14: Whether CAMS aerosol helps in cloud-free and dusty hours'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Figure 14: Whether CAMS aerosol helps in cloud-free and dusty hours</text><text aria-label="Subtitle text 'Six NGED solar farms, daylight hours, September 2019 to December 2025. ERA5: ECMWF's reanalysis of past weather. CAMS: satellite irradiance service. Dot: estimate. Line: 95% interval from resampling whole months. Main XGBoost tuning setting. Dashed rules: no difference, and (on the error panels) the smallest improvement worth acting on (0.1 percentage points). Labels give distinct days (d) and months (mo). A row is assessed only with at least 20 days in 12 months. Aerosol: optical depth from CAMS's EAC4 reanalysis (a CAMS global atmosphere record). Clear: ERA5 total cloud cover below 0.2. Dusty: dust optical depth in the top 5% of hours. Clean: total aerosol optical depth below its median. CRPS scores the whole predicted distribution; error is the mean absolute error. EAC4 is a reanalysis of past aerosol, which is less uncertain than a forecast of it. A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar radiation (ssrd), and air temperature (t2m). Each group adds to the one before. G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation. G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation. G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables. G10: G9 plus CAMS aerosol. Clearness index: irradiance divided by the irradiance at the top of the atmosphere. Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 38)"><tspan>Six NGED solar farms, daylight hours, September 2019 to December 2025. ERA5: ECMWF&apos;s reanalysis of past weather.</tspan><tspan x="0" dy="13">CAMS: satellite irradiance service.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Main XGBoost tuning</tspan><tspan x="0" dy="13">setting. Dashed rules: no difference, and (on the error panels) the smallest</tspan><tspan x="0" dy="13">improvement worth acting on (0.1 percentage points). Labels give distinct days (d)</tspan><tspan x="0" dy="13">and months (mo). A row is assessed only with at least 20 days in 12 months.</tspan><tspan x="0" dy="13">Aerosol: optical depth from CAMS&apos;s EAC4 reanalysis (a CAMS global atmosphere record).</tspan><tspan x="0" dy="13">Clear: ERA5 total cloud cover below 0.2. Dusty: dust optical depth in the top 5% of</tspan><tspan x="0" dy="13">hours. Clean: total aerosol optical depth below its median. CRPS scores the whole</tspan><tspan x="0" dy="13">predicted distribution; error is the mean absolute error.</tspan><tspan x="0" dy="13">EAC4 is a reanalysis of past aerosol, which is less uncertain than a forecast of it.</tspan><tspan x="0" dy="13">A variable set is the list of inputs the XGBoost model is given. G0: sun position, ERA5 solar</tspan><tspan x="0" dy="13">radiation (ssrd), and air temperature (t2m). Each group adds to the one before.</tspan><tspan x="0" dy="13">G1: total cloud cover. G2: low, mid, and high cloud cover. G3: clear-sky radiation.</tspan><tspan x="0" dy="13">G4: cloud water and cloud base height. G5: direct beam. G6: wind and thermal radiation.</tspan><tspan x="0" dy="13">G7: humidity and haze. G8: snow and albedo. G9 (the full set): all other ERA5 variables.</tspan><tspan x="0" dy="13">G10: G9 plus CAMS aerosol.</tspan><tspan x="0" dy="13">Clearness index: irradiance divided by the irradiance at the top of the atmosphere.</tspan><tspan x="0" dy="13">Exploratory: not named in the study plan before any result existed, and not corrected for multiple comparisons.</tspan></text></g></g></svg>

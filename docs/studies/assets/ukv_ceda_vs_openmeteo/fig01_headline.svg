ll="#292b2b" aria-hidden="true" class="mark-text role-mark concat_3_layer_1_layer_8_marks" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="end" transform="translate(504.6 1149)">+0.27 [+0.14, +0.43]</text><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Solar power, P3: transfer penalty'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 994)">Solar power, P3: transfer penalty</text></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 1: Power errors from CEDA's and Open-Meteo's UKV differ for wind and differ for solar before PS47, and moving a CEDA-trained model onto Open-Meteo's values shows a penalty for wind and is unresolved for solar'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 1: Power errors from CEDA&apos;s and Open-Meteo&apos;s UKV differ for wind</tspan><tspan x="0" dy="20">and differ for solar before PS47, and moving a CEDA-trained model onto</tspan><tspan x="0" dy="20">Open-Meteo&apos;s values shows a penalty for wind and is unresolved for solar</tspan></text><text aria-label="Subtitle text 'Dot: the primary hyperparameter setting. Hollow triangle: the second setting. Grey band: the margin. Line: 95% interval from resampling whole calendar months. Row labels give the two models' mean absolute errors in % of capacity, CEDA against Open-Meteo (P3: the CEDA- trained model on Open-Meteo's values against the Open-Meteo-trained model). Wind reads the whole overlap. Solar is planned on the era before the PS47 upgrade only, because Open-Meteo builds its hourly irradiance differently afterwards. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Dot: the primary hyperparameter setting. Hollow triangle: the second setting.</tspan><tspan x="0" dy="13">Grey band: the margin. Line: 95% interval from resampling whole calendar months.</tspan><tspan x="0" dy="13">Row labels give the two models&apos; mean absolute errors in % of capacity, CEDA against Open-Meteo (P3: the CEDA-</tspan><tspan x="0" dy="13">trained model on Open-Meteo&apos;s values against the Open-Meteo-trained model).</tspan><tspan x="0" dy="13">Wind reads the whole overlap. Solar is planned on the era before the PS47 upgrade only, because Open-Meteo builds</tspan><tspan x="0" dy="13">its hourly irradiance differently afterwards.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="g"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="h"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="j"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="k"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="l"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="n"><path d="M0 0h450v208H0z"/></clipPath><clipPath id="o"><path d="M0 0h450v208H0z"/></clipPath></defs></svg>

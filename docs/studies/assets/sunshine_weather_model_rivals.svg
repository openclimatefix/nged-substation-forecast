pgrade: January 2026; its rows rest on 7 months, so their intervals are likely too narrow. Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator's 99th-percentile output. Six solar farms in Lincolnshire, December 2022 to August 2026. Planned: one of the comparisons written into the study plan before any result existed. Every other row is exploratory.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Top two panels: each rival&apos;s mean absolute error minus ICON-EU&apos;s. Bottom panel: UKV&apos;s minus ERA5&apos;s, by period; UKV</tspan><tspan x="0" dy="13">rebuilt is the mean of its two snapshots. Rows other than the all-hours rows of the top two panels were added after</tspan><tspan x="0" dy="13">the first run.</tspan><tspan x="0" dy="13">Since August 2024: Open-Meteo&apos;s own UKV download. The upgrade: January 2026; its rows rest on 7 months, so their</tspan><tspan x="0" dy="13">intervals are likely too narrow.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months. Capacity is each generator&apos;s 99th-percentile</tspan><tspan x="0" dy="13">output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, December 2022 to August 2026.</tspan><tspan x="0" dy="13">Planned: one of the comparisons written into the study plan before any result existed. Every other row is</tspan><tspan x="0" dy="13">exploratory.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h420v120H0z"/></clipPath><clipPath id="b"><path d="M0 0h420v120H0z"/></clipPath><clipPath id="c"><path d="M0 0h420v160H0z"/></clipPath><clipPath id="d"><path d="M0 0h420v160H0z"/></clipPath><clipPath id="f"><path d="M0 0h420v210H0z"/></clipPath><clipPath id="g"><path d="M0 0h420v210H0z"/></clipPath><clipPath id="i"><path d="M0 0h420v210H0z"/></clipPath></defs></svg>

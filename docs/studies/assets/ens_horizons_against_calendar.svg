shire, every hour, August 2024 to September 2026.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Mean absolute error of an XGBoost model given ENS&apos;s ensemble mean minus the same model given no weather at all,</tspan><tspan x="0" dy="13">only the ENS arms&apos; calendar and sun-geometry columns, with the day-of-year column and with calendar month instead.</tspan><tspan x="0" dy="13">All marks are post hoc: added after the first and second science reviews.</tspan><tspan x="0" dy="13">Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Capacity is each generator&apos;s</tspan><tspan x="0" dy="13">99th-percentile output.</tspan><tspan x="0" dy="13">Six solar farms in Lincolnshire, every daylight hour, April 2024 to September 2026. Three wind farms in</tspan><tspan x="0" dy="13">Lincolnshire, every hour, August 2024 to September 2026.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="c"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="d"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="e"><path d="M0 0h450v410H0z"/></clipPath><clipPath id="f"><path d="M0 0h450v410H0z"/></clipPath></defs></svg>

5Z" aria-hidden="true" class="background"/><g aria-hidden="true" class="mark-group role-axis"><path stroke="#eaeaea" d="M265.5 647.5v-360m66 360v-360m66 360v-360m66 360v-360m66 360v-360m67 360v-360m66 360v-360" class="mark-rule role-axis-grid" pointer-events="none"/></g><g aria-label="X-axis titled 'Difference in mean absolute error (points of capacity; more negative means first product better)' for a linear scale with values from −0.8 to 2.6" aria-roledescription="axis" class="mark-group role-axis" pointer-events="none"><path stroke="#292b2b" d="M265.5 647.5v5m66-5v5m66-5v5m66-5v5m66-5v5m67-5v5m66-5v5" class="mark-rule role-axis-tick"/><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" text-anchor="middle"><text transform="translate(265.2 662.5)">−0.5</text><text transform="translate(331.4 662.5)">0</text><text transform="translate(397.6 662.5)">0.5</text><text transform="translate(463.7 662.5)">1</text><text transform="translate(530 662.5)">1.5</text><text transform="translate(596 662.5)">2</text><text transform="translate(662.3 662.5)">2.5</text></g><path stroke="#292b2b" d="M225.5 647.5h450" class="mark-rule role-axis-domain"/><text fill="#292b2b" class="mark-text role-axis-title" font-family="Matter XH, DM Sans, sans-serif" font-size="11" text-anchor="middle" transform="translate(450.5 677.5)"><tspan>Difference in mean absolute error (points of capacity; more negative means</tspan><tspan x="0" dy="13">first product better)</tspan></text></g><g aria-label="Y-axis for a discrete scale with 7 values: P1a: UKV day 1 minus ENS mean day 1, P1b: UKV day 1 minus ENS mean day 0, P2a: ICON-EU day 1 minus ENS mean day 1, P2b: ICON-EU day 1 minus ENS mean day 0, P3: GEFS mean day 1 minus ENS mean day 1, P4a: ENS mean day 1 + ICON-EU day 1 + IFS 0.25° day 1 minus ENS mean day 1, P4b: ENS mean day 1 + ICON-EU day 2 + IFS 0.25° day 2 minus ENS mean day 1" aria-roledescription="axis" class="mark-group role-axis"><g fill="#292b2b" class="mark-text role-axis-label" font-family="Matter Semi Mono, Roboto Mono, monospace" font-size="10" pointer-events="none" text-anchor="end"><text transform="translate(219.5 320)"><tspan>P1a: UKV day 1 minus ENS mean</tspan><tspan x="0" dy="12">day 1</tspan></text><text transform="translate(219.5 370)"><tspan>P1b: UKV day 1 minus ENS mean</tspan><tspan x="0" dy="12">day 0</tspan></text><text transform="translate(219.5 420)"><tspan>P2a: ICON-EU day 1 minus ENS</tspan><tspan x="0" dy="12">mean day 1</tspan></text><text transform="translate(219.5 470)"><tspan>P2b: ICON-EU day 1 minus ENS</tspan><tspan x="0" dy="12">mean day 0</tspan></text><text transform="translate(219.5 520)"><tspan>P3: GEFS mean day 1 minus ENS</tspan><tspan x="0" dy="12">mean day 1</tspan></text><text transform="translate(219.5 570)"><tspan>P4a: ENS mean day 1 + ICON-EU</tspan><tspan x="0" dy="12">day 1 + IFS 0.25° day 1 minus</tspan><tspan x="0" dy="12">ENS mean day 1</tspan></text><text transform="translate(219.5 620)"><tspan>P4b: ENS mean day 1 + ICON-EU</tspan><tspan x="0" dy="12">day 2 + IFS 0.25° day 2 minus</tspan><tspan x="0" dy="12">ENS mean day 1</tspan></text></g></g><g aria-roledescription="rule mark container" class="mark-rule role-mark concat_0_concat_1_layer_0_marks"><path stroke="#292b2b" d="M330.9 287v360" aria-label="x: 0" aria-roledescription="rule mark"/></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_1_marks"><text fill="#292b2b" aria-label="x: 0" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" transform="translate(334.9 281)">same error</text></g><g aria-roledescription="text mark container" class="mark-text role-mark concat_0_concat_1_layer_2_marks"><text fill="#292b2b" aria-label="x: −0.8" aria-roledescription="text mark" font-family="Matter XH, DM Sans, sans-serif" font-size="11" font-weight="bold" transform="translate(225 269)">← first product better</text></g><g stroke-width="2" aria-hidden="true" class="mark-rule role-mark concat_0_concat_1_layer_3_marks" clip-path="url(#a)" transform="translate(225 287)"><path stroke="#ff4901" d="M215 20h114.4"/><path stroke="#306bff" d="M213.7 40H329"/><path stroke="#ff4901" d="M304 70h100"/><path stroke="#306bff" d="M298 90h99.7"/><path stroke="#ff4901" d="M183.2 120h64.2"/><path stroke="#306bff" d="M187.8 140h58.4"/><path stroke="#ff4901" d="M266 170h63.4"/><path stroke="#306bff" d="M261.3 190h66.4"/><path stroke="#ff4901" d="M229.9 220h87.9"/><path stroke="#306bff" d="M228.6 240h89.9"/><path stroke="#ff4901" d="M42 270h35"/><path stroke="#306bff" d="M50.6 290h32.3"/><path stroke="#ff4901" d="M91.9 320h18.4"/><path stroke="#306bff" d="M99.4 340h15.5"/></g><g aria-hidden="true" class="mark-symbol role-mark concat_0_concat_1_layer_4_marks" clip-path="url(#b)" transform="translate(225 287)"><path fill="#ff4901" d="M274.4 20a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M273.7 40a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M357.8 70a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M351.7 90a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#ff4901" d="M218.2 120a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M220.2 140a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M301.6 170a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M298.3 190a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M278.4 220a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M276.7 240a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M64.1 270a4.2 4.2 0 1 1-8.3 0 4.2 4.2 0 1 1 8.3 0"/><path fill="#306bff" d="M71.7 290a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#ff4901" d="M105.7 320a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0"/><path fill="#306bff" d="M112 340a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.3 0"/></g><g class="mark-group role-title"><text fill="#292b2b" aria-label="Title text 'Planned contrasts'" aria-roledescription="title" class="mark-text role-title-text" font-family="Matter XH, DM Sans, sans-serif" font-size="14" pointer-events="none" transform="translate(225 253)">Planned contrasts</text></g></g></g><g fill="#292b2b" class="mark-group role-title" font-family="Matter XH, DM Sans, sans-serif" pointer-events="none"><text aria-label="Title text 'Figure 3: For solar power, ENS beats UKV and ICON-EU at matched lead and GEFS at equal lead. A blend lowers the error by 0.35 points at an optimistic lead and shows no detectable gain at a conservative lead'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(5 19)"><tspan>Figure 3: For solar power, ENS beats UKV and ICON-EU at matched lead and</tspan><tspan x="0" dy="20">GEFS at equal lead. A blend lowers the error by 0.35 points at an</tspan><tspan x="0" dy="20">optimistic lead and shows no detectable gain at a conservative lead</tspan></text><text aria-label="Subtitle text 'Difference in mean absolute error between two XGBoost models, each given one forecast product, first product minus second, in points of capacity. Negative means the first product forecasts better. Every product is scored on exactly the same hours. Every error is a fraction of the generator's own capacity, taken as its 99th percentile of metered output. P1a, P2a, P3, P4a, and P4b compare at the ENS mean's day-1 lead; P1b and P2b compare with the ENS mean at day 0, so a product's day-1 error lies between the two ENS errors when it is bracketed. Dot: estimate. Line: 95% interval from resampling whole months and a fitting seed. Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026. All rows are planned: written into the study plan before any result existed.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(5 78)"><tspan>Difference in mean absolute error between two XGBoost models, each given one forecast product, first product minus</tspan><tspan x="0" dy="13">second, in points of capacity. Negative means the first product forecasts better. Every product is scored on</tspan><tspan x="0" dy="13">exactly the same hours. Every error is a fraction of the generator&apos;s own capacity, taken as its 99th percentile of</tspan><tspan x="0" dy="13">metered output.</tspan><tspan x="0" dy="13">P1a, P2a, P3, P4a, and P4b compare at the ENS mean&apos;s day-1 lead; P1b and P2b compare with the ENS mean at day 0, so</tspan><tspan x="0" dy="13">a product&apos;s day-1 error lies between the two ENS errors when it is bracketed. Dot: estimate. Line: 95% interval</tspan><tspan x="0" dy="13">from resampling whole months and a fitting seed.</tspan><tspan x="0" dy="13">Scored hours of the six solar farms in Lincolnshire, December 2024 to September 2026.</tspan><tspan x="0" dy="13">All rows are planned: written into the study plan before any result existed.</tspan></text></g></g><defs><clipPath id="a"><path d="M0 0h450v360H0z"/></clipPath><clipPath id="b"><path d="M0 0h450v360H0z"/></clipPath></defs></svg>

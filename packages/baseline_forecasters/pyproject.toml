[project]
name = "baseline-forecasters"
version = "0.2.1"
description = "Naive baseline forecasters that a trained model has to beat"
readme = "README.md"
authors = [
    { name = "Jack Kelly", email = "jack@openclimatefix.org" }
]
requires-python = ">=3.14"
dependencies = [
    "contracts",
    "ml_core",
    "patito",
    "polars>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

# Manual heuristic forecaster configuration.
#
# The top-level _target_ identifies the BaseForecaster subclass to instantiate; model_params are
# validated by that class's CONFIG_CLASS, as in conf/model/xgboost.yaml.
#
# Only the power lags become ensemble members, ranked shortest lag first. The forecaster reads no
# weather. Registration accepts a list that holds a weather feature or holds no power lag, and
# either list raises only when trained_cv_model runs.

_target_: baseline_forecasters.manual_heuristic.ManualHeuristicForecaster

model_params:
  selected_features:
    # Weekly analogues: the same weekday and time of day over the last 6 weeks.
    - "power_lag_168h" # 1 week
    - "power_lag_336h" # 2 weeks
    - "power_lag_504h" # 3 weeks
    - "power_lag_672h" # 4 weeks
    - "power_lag_840h" # 5 weeks
    - "power_lag_1008h" # 6 weeks
    # Annual analogues: the same weekday and time of day 49 to 55 weeks back.
    - "power_lag_8232h" # 49 weeks
    - "power_lag_8400h" # 50 weeks
    - "power_lag_8568h" # 51 weeks
    - "power_lag_8736h" # 52 weeks
    - "power_lag_8904h" # 53 weeks
    - "power_lag_9072h" # 54 weeks
    - "power_lag_9240h" # 55 weeks

  # MLflow experiment tags (used for leaderboard grouping)
  weather_source: "none"
  training_strategy: "none"

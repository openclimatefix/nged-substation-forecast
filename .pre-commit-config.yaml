repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # A Vega/Altair chart exported straight to SVG trips the hook's 500 KB default, because a
      # plot of half-hourly data carries one path point per reading. Run the export through
      # `npx svgo@4 --multipass --precision=1` before committing it — that is how
      # docs/example_power_forecast.svg came down from 571 KB to 296 KB, with no visible change.
      - id: check-added-large-files

  - repo: local
    hooks:
      # Two ruff-check hooks, split on one thing: whether `--fix` is safe to run on the file.
      #
      # When an autofix needs a name the file does not import yet, ruff inserts the import into the
      # file's *top-level* import block. In a marimo notebook that is the wrong place: marimo never
      # executes module-level statements, it rebuilds the notebook from `with app.setup:` plus the
      # `@app.cell` functions, so the new import is invisible to every cell and the notebook dies
      # with a NameError the next time it is opened. `ruff check` then reports success, because the
      # file it produced is perfectly valid Python.
      #
      # This is a whole class, not one rule — any fix that adds an import does it (UP017 and UP035
      # today; the FURB/PERF fixes that reach for `itertools` would too) — and ruff has no per-file
      # fixability setting to express it: `unfixable` is global, and `per-file-ignores` would
      # silence the check as well as the fix. So the notebooks are checked but never auto-fixed,
      # and a finding in one is applied by hand, into `app.setup`.
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
        # `[^/]+` cannot cross a directory separator, so this reaches the marimo apps sitting
        # directly in each package and never `packages/dashboard/src/` or `packages/*/tests/`.
        # Deliberately generic rather than a list of the six filenames: a seventh notebook would
        # otherwise be exposed to exactly the silent breakage this exists to prevent.
        exclude: &marimo_notebooks >-
          ^packages/(notebooks|dashboard)/[^/]+\.py$
      - id: ruff-check-marimo
        name: ruff check (marimo notebooks, no --fix)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        files: *marimo_notebooks
      # The hooks above never auto-fix a notebook, but a hand-typed `uv run ruff check . --fix`
      # still can, and `marimo check --fix` leaves the same breakage behind by another route. So
      # every commit that touches a notebook also checks its cells bind every name they reference
      # — see the script's docstring. `tests/test_marimo_notebooks.py` runs the same check in CI.
      - id: check-marimo-notebooks
        name: marimo notebooks (no unbound names)
        entry: uv run python scripts/check_marimo_notebooks.py
        language: system
        types: [python]
        files: *marimo_notebooks
      # Markdown is in scope because ruff formats the Python inside a fenced code block, and CI
      # runs `ruff format --check .` over the whole tree. With `types: [python]` the hook never saw
      # a `.md` file, so a snippet in a docs page or a SKILL.md passed the commit and failed CI.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, markdown]
      - id: ty
        name: ty
        entry: uv run --all-packages ty check --project .
        language: system
        pass_filenames: false
        always_run: true
      - id: pymarkdown
        name: pymarkdown (markdown files)
        entry: uv run pymarkdown scan
        language: system
        types: [markdown]
        exclude: ^plans/
      - id: lint-docstring-markdown
        name: pymarkdown (Python docstrings)
        entry: uv run python scripts/lint_docstring_markdown.py
        language: system
        types: [python]
      # `mkdocs build --strict` only validates links *inside* docs/, so a link to the published
      # site from a docstring, a comment, or a workflow file can point at a page a rename moved,
      # or an anchor a heading rewrite killed, with nothing to catch it. This hook does — see the
      # script's docstring for why it converts each page with the real markdown converter instead
      # of a hand-rolled slugify.
      # Scans the whole repo rather than the staged files: a link to the site can sit in any text
      # file, and a `types_or` list missed `.env.example` and `pyproject.toml`, both of which carry
      # one today. A full scan takes under a second, so there is nothing to buy by narrowing it.
      # Ruff's D417 fires only when an `Args:` section is present and incomplete. A parameter block
      # written under `Attributes:`, and an `Args:` entry naming a parameter that a rename removed,
      # both pass every rule ruff has selected — and `geo.h3` carried one of each for months.
      # pydoclint reads the signature and the docstring and compares them; `[tool.pydoclint]` in
      # pyproject.toml says which of its checks this repo wants and why.
      - id: pydoclint
        name: pydoclint (docstrings match signatures)
        entry: uv run --isolated --no-project --with pydoclint pydoclint --quiet
        language: system
        types: [python]
        exclude: *marimo_notebooks
      # Sphinx cross-reference roles render as literal text. mkdocstrings parses these docstrings
      # as Markdown and nothing resolves the role, so `:func:` + backticked name reaches the
      # published API page verbatim — a reader sees the markup instead of the name. Plain
      # backticks are the house style and render correctly. 46 of these were live on the site
      # before anyone looked at the built HTML, because every local check passes: ruff, pydoclint
      # and `mkdocs build --strict` all read the docstring as prose and have no opinion about it.
      - id: no-sphinx-roles
        name: no Sphinx cross-reference roles (they render as raw text)
        entry: ':(func|class|meth|mod|attr|data|obj|exc|ref):`'
        language: pygrep
        types: [python]
      - id: check-docs-links
        name: docs links (check_docs_links)
        entry: uv run python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        always_run: true

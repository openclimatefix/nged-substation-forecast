name: CI

# Per-PR quality gate: lint, format, types, markdown, and the offline test suite.
# The network-gated tests are NOT run here — they run in nightly_network_tests.yml.
# Design rationale (including why this is a bespoke workflow rather than OCF's reusable
# branch_ci.yml template):
# https://openclimatefix.github.io/nged-substation-forecast/architecture/testing/#continuous-integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Resolves and downloads an interpreter satisfying requires-python; no setup-python step needed.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --all-packages so that `ty check` can resolve imports for leaf workspace members
      # (e.g. dashboard, notebooks) that nothing depends on and a plain sync would omit.
      # --locked fails the build if uv.lock is out of date with the pyproject.toml files.
      - name: Install workspace
        run: uv sync --locked --all-packages

      # Every step below uses --no-sync so that each one runs against exactly what the step above
      # installed. A bare `uv run` would re-resolve and re-sync per step, which costs time and
      # would quietly paper over a lock file the install step should have rejected. It would not
      # uninstall the --all-packages members: `uv run` syncs inexactly, and `--exact` is opt-in.
      - name: Lint (ruff check)
        run: uv run --no-sync ruff check .

      - name: Format (ruff format --check)
        run: uv run --no-sync ruff format --check .

      # Ruff's D417 only catches an `Args:` section that is present and incomplete; pydoclint
      # compares the whole of `Args:` and `Returns:` against the signature. See `[tool.pydoclint]`
      # in pyproject.toml.
      - name: Docstring lint (pydoclint)
        run: uv run --isolated --no-project --with pydoclint==0.9.1 pydoclint --quiet --style=google .

      - name: Type-check (ty)
        run: uv run --no-sync ty check

      - name: Markdown lint (pymarkdown)
        run: uv run --no-sync pymarkdown scan -r docs README.md CLAUDE.md packages/*/README.md

      # Two halves of one job: mkdocs validates links within docs/, check_docs_links validates
      # links from anywhere else to the published site. Neither sees what the other does.
      - name: Docs build (mkdocs --strict)
        run: uv run --no-sync mkdocs build --strict --site-dir /tmp/ci-site

      - name: Docs links (check_docs_links)
        run: uv run --no-sync python scripts/lint/check_docs_links.py

      - name: Test (pytest)
        run: uv run --no-sync pytest

      # Five hooks have no step above — trailing-whitespace, end-of-file-fixer, check-yaml,
      # no-sphinx-roles, and lint-docstring-markdown — and the pymarkdown hook scans every tracked
      # markdown file, not the narrower set the step above passes it. Commit-time hooks are not
      # enough on their own: both failures in #812 landed from commits where the hooks never ran,
      # which is the state of a clone where `pre-commit install` was never run.
      # `check-added-large-files` stays commit-time-only: without `--enforce-all` it inspects only
      # the files staged as additions, and `--enforce-all` would fail today on three tracked files
      # that already exceed 500 KB. This step repeats ruff, ty, pydoclint, pymarkdown, and
      # check_docs_links, each of which has a step above, and adds a few seconds.
      - name: Pre-commit (every hook, every file)
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

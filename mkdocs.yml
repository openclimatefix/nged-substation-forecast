site_name: NGED Substation Forecast

validation:
  links:
    anchors: warn

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - content.code.copy

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/ocf.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_if_no_docstring: true
            inherited_members: true
            members_order: source
  - include-markdown
  # Keeps URLs that have been shared outside the docs working after a page is renamed.
  - redirects:
      redirect_maps:
        background/nged-incumbent-forecast.md: background/manual-heuristic-forecast.md
        studies/weather-products-for-the-past.md: studies/past-weather/solar.md
        studies/weather-products-for-past-solar.md: studies/past-weather/solar.md
        studies/weather-products-for-past-wind.md: studies/past-weather/wind.md
        studies/blending-weather-products.md: studies/past-weather/blending.md
        studies/ens-forecast-horizons.md: studies/forecasts/ens-horizons.md
        studies/nwp-forecasts-at-matched-leads.md: studies/forecasts/matched-lead.md
        ml_experimentation/index.md: cross-validation/index.md
        ml_experimentation/dagster-workflow.md: cross-validation/dagster-workflow.md
        ml_experimentation/model-configuration.md: cross-validation/model-configuration.md
        ml_experimentation/cross-validation-folds.md: cross-validation/cross-validation-folds.md

